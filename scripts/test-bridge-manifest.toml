# Ephemeral bridge manifest for `just secretspec-validate-local` end-to-end test.
#
# This template is copied to $BDIR/test-manifest.toml at validation time, then
# sed-substituted to inject the actual temp-dir path into the `sops://` and
# `dotenv://` URIs. The cluster's `secretspec-validate-local` recipe uses
# absolute paths to avoid heredoc/just-parser whitespace conflicts inside the
# justfile recipe body — `cp` + `sed` keeps the recipe body pure 4-space
# indented (just rejects any tab/space mixing in a single recipe).
#
# The provider fork's CI bridge fixture (in /home/j_kro/Projects/secretspec/
# .github/workflows/ci.yml) uses the same template structure, so drift between
# cluster and provider-fork validation stays zero.
#
# SHAPE NOTES (against cachix fork `pub struct Profile` in
# /home/j_kro/Projects/secretspec-core/secretspec/src/config.rs):
#
#   * `Profile::defaults: Option<ProfileDefaults>` is a sub-table; the per-profile
#     provider chain lives in `[profiles.default.defaults].providers`, not at
#     the top level of `[profiles.default]`. Putting `providers = [...]` at the
#     top level makes the `#[serde(flatten)] HashMap<String, Secret>` field
#     try to deserialize the Array as a Secret entry, which fails with
#     "invalid length 1, expected struct SecretSerde with 9 elements".
#
#   * Each Secret entry under `[profiles.default]` MUST have `description`
#     (validation rejects `Some("")` and `None`); `required = true` is the
#     default unless overridden, so explicit `required = true` documents the
#     test's expectation that sops:// resolution completes.
#
#   * The sops:// URI uses triple-slash form (`sops:///abs/path`) so cachix's
#     `SopsConfig::try_from` extracts the absolute file path with empty host.
#     `sops://./relative` would also work (host="." path="/relative"),
#     but for an ephemeral test-fixture under mktemp the absolute form is
#     unambiguous and survives shell `cd` race conditions.
#
[project]
name = "ci-bridge-fixture"
# cachix fork's `Config::parse_document` (config.rs:430-ish) hard-rejects any
# revision != "1.0" with `UnsupportedRevision`. The cluster's secretspec.toml
# uses revision = "1.0" too — keep the test fixture on the same schema rev so
# the bridge validates against the exact same parse pipeline.
revision = "1.0"

[providers]
sops   = "sops://@BDIR@/test-fixture.yaml"
env    = "env://"
dotenv = "dotenv://@BDIR@/.env.bridge"

# Profile-wide defaults: provider chain so every Secret in [profiles.default]
# falls through `sops -> dotenv -> env` until one resolves.
[profiles.default.defaults]
providers = ["sops", "dotenv", "env"]

[profiles.default]
ci_dummy_secret = { description = "Ephemeral CI dummy — proves sops:// subprocess dispatch round-trips through the cachix fork", required = true }
