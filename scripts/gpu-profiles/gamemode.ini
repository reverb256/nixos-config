# GameMode configuration for autonomous GPU workload management
# Location: ~/.config/gamemode.ini

[general]
# Suppress the script output and info
suppress_scripts_info=1

[gpu]
# Enable GPU optimizations
apply_gpu_optimisations=accept-responsibility

# NVIDIA GPU 0 (3060 Ti)
[gpu:0]
# Apply these settings when GameMode starts
gpu_device=0
# Performance mode: 0=Adaptive, 1=Prefer Max Performance, 2=Auto
nv_powermizer_mode=1
# Core clock offset (MHz)
nv_core_clock_mhz_offset=180
# Memory clock offset (MHz)
nv_mem_clock_mhz_offset=700

# NVIDIA GPU 1 (3090) - Display GPU
[gpu:1]
gpu_device=1
nv_powermizer_mode=1
nv_core_clock_mhz_offset=150
nv_mem_clock_mhz_offset=600

[custom]
# Custom scripts to run when GameMode starts/ends
# These are executed with the shell

# START HOOKS: Run when GameMode activates (game starts)
start=/etc/nixos/scripts/gpu-profiles/gaming.sh

# END HOOKS: Run when GameMode deactivates (game exits)
end=/etc/nixos/scripts/gpu-profiles/ai-inference.sh

# Script timeout in seconds
script_timeout=10
