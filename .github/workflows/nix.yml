name: Nix CI + GitOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v4

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Check Nix flake
        run: nix flake check

      - name: Build zephyr configuration
        run: nix build .#nixosConfigurations.zephyr.config.system.build.toplevel --no-link

      - name: Build nexus configuration
        run: nix build .#nixosConfigurations.nexus.config.system.build.toplevel --no-link

      - name: Build forge configuration
        run: nix build .#nixosConfigurations.forge.config.system.build.toplevel --no-link

      - name: Build sentry configuration
        run: nix build .#nixosConfigurations.sentry.config.system.build.toplevel --no-link

  merge-to-infra:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge main → infra
        run: |
          git fetch origin infra
          git checkout infra
          git merge main --no-edit
          git push origin infra

      - name: Trigger deployment
        run: |
          curl -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"ref": "infra", "repository": "${{ github.repository }}"}'
        continue-on-error: true
