name: Auto-delete head branches

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-head:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Delete head branch
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
        with:
          script: |
            const pr = context.payload.pull_request;
            await github.rest.git.deleteRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${pr.head.ref}`
            });
      - name: Cleanup stale branches
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          OLDEST=7
          NOW=$(date +%s)
          for branch in $(gh api repos/${{ github.repository }}/branches --jq '.[].name'); do
            if [[ \"$branch\" == \"main\" || \"$branch\" == \"develop\" || \"$branch\" == \"master\" ]]; then continue; fi
            COMMIT=$(gh api repos/${{ github.repository }}/commits/$branch --jq '.[0].commit.author.date')
            TS=$(date -d \"$COMMIT\" +%s)
            if (( NOW - TS > OLDEST*86400 )); then
              echo \"Deleting stale branch $branch\"
              gh api repos/${{ github.repository }} -X DELETE /git/refs/heads/$branch
            fi
          done