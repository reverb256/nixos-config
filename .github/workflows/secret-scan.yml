name: secret-scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: [self-hosted, nixos, nexus, builder]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Self-hosted runners on this fleet are NixOS; gitleaks is not on the
      # base image PATH, so use the prebuilt binary via the official action.
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
