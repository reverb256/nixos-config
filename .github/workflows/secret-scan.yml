name: secret-scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: [self-hosted, nixos, nexus, builder]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      # Self-hosted NixOS runners: run gitleaks from the nix store directly.
      # Avoids the gitleaks-action (needs a paid GITLEAKS_LICENSE secret and
      # a Docker/PATH assumption that breaks on NixOS runners).
      - name: Run gitleaks
        run: |
          GITLEAKS="$(find /nix/store -maxdepth 3 -name gitleaks -type f 2>/dev/null | head -1)"
          if [ -z "$GITLEAKS" ]; then
            echo "::error::gitleaks not found in nix store — run: nix profile install nixpkgs#gitleaks"
            exit 2
          fi
          echo "using: $GITLEAKS"
          "$GITLEAKS" detect --source=. --redact --exit-code 1
