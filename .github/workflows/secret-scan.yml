name: secret-scan

on:
  pull_request:
  push:
    branches: [main, prod]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      # GitHub-hosted runner (repo is public → free hosted minutes). No
      # self-hosted/nix-store dependency: download the gitleaks release
      # binary directly. Avoids gitleaks-action (needs a paid
      # GITLEAKS_LICENSE on non-personal plans).
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          curl -sL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version
      - name: Run gitleaks
        run: gitleaks detect --source=. --redact --exit-code 1
