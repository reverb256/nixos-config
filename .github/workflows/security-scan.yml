---
name: Security Scan

on:
  schedule:
    - cron: '0 5 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: Dependency and Vulnerability Scan
    runs-on: [self-hosted, nixos]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@b97f05dcb019ddea06450a50ef6203d2fdc19fee
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: OSV Scanner
        run: |
          nix-shell -p osv-scanner --run 'osv-scanner --recursive --format=sarif --output=/tmp/results.sarif .' || true
          echo --- Summary ---
          nix-shell -p osv-scanner --run 'osv-scanner --recursive . 2> /dev/null' | tail -20 || true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@3b1a19a80ab047f35cbb237b5bd9bdc1e14f166c
        with:
          sarif_file: /tmp/results.sarif

      - name: Trivy filesystem scan
        continue-on-error: true
        run: nix-shell -p trivy --run 'trivy filesystem --scanners vuln,secret --exit-code 0 --format sarif --output /tmp/trivy-results.sarif /etc/nixos 2> /dev/null' || true

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@3b1a19a80ab047f35cbb237b5bd9bdc1e14f166c
        with:
          sarif_file: /tmp/trivy-results.sarif
