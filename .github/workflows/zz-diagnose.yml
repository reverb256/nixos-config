---
name: Zz Diagnose

# TEMPORARY diagnostic workflow (remove after CI/CD fix confirmed).
# Bisect step 2: does `on: pull_request:` alone break self-hosted runs?
# (nix-actions job removed; if this passes, the nix actions are the culprit)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-actions:
    name: Probe-No-Actions
    runs-on: [self-hosted, nixos]
    steps:
      - name: Hello
        run: echo "no-actions probe ran on $(hostname)"

  with-checkout:
    name: Probe-With-Checkout
    runs-on: [self-hosted, nixos]
    steps:
      - name: Checkout
        # pin:actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Hello
        run: echo "checkout probe ran on $(hostname)"
