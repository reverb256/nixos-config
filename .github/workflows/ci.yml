---
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ============================================================================
  # STAGE 1: Quick validation (fast, self-hosted)
  # ============================================================================

  parse-check:
    timeout-minutes: 20
    name: Parse Check
    runs-on: [self-hosted, nixos]
    steps:
      - name: Checkout
        # pin:actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - name: Check CI workflow policy
        run: python3 tests/ci-workflow-policy.py

      - name: Report commit signatures (advisory)
        if: github.event_name == 'pull_request'
        run: |
          COMMITS=$(git log ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} --format=%H)
          FAILED=0
          for sha in $COMMITS; do
            if ! git verify-commit $sha 2>/dev/null; then
              echo "::notice::Commit $sha is not signed (advisory only)"
              FAILED=$((FAILED + 1))
            else
              echo "Commit $sha is signed"
            fi
          done
          echo "$FAILED unsigned commit(s) found"

      - name: Validate workflow syntax
        run: nix shell github:NixOS/nixpkgs/0954f7ee2f6bb3dc7d4e3d0d8bcb8fd4bde4cfc5#actionlint -c actionlint --ignore 'shellcheck reported issue' .github/workflows/*.yml

      - name: Parse changed Nix files
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            TARGET_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            TARGET_SHA="$GITHUB_SHA"
          fi
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then BASE_SHA=HEAD^; fi
          FAILED=0
          while IFS= read -r -d '' f; do
            [ -z "$f" ] && continue
            if ! nix-instantiate --parse "$f" > /dev/null 2>&1; then
              echo "PARSE ERROR: $f"
              FAILED=1
            fi
          done < <(git diff --name-only -z "$BASE_SHA...$TARGET_SHA" -- '*.nix')
          exit "$FAILED"

  quick-check:
    timeout-minutes: 30
    name: Quick Check
    runs-on: [self-hosted, nixos]
    steps:
      - name: Checkout
        # pin:actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - name: Nix flake check
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "::notice::Full flake evaluation is trusted-only because home-manager-config is private."
          else
            nix flake check --no-build
          fi

  # ============================================================================
  # STAGE 2: Linting and static analysis
  # ============================================================================

  lint:
    timeout-minutes: 30
    name: Lint Nix
    runs-on: [self-hosted, nixos]
    steps:
      - name: Checkout
        # pin:actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - name: Lint changed Nix files
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            TARGET_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            TARGET_SHA="$GITHUB_SHA"
          fi
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then BASE_SHA=HEAD^; fi
          mapfile -d '' NIX_FILES < <(git diff --name-only -z "$BASE_SHA...$TARGET_SHA" -- '*.nix')
          if [ "${#NIX_FILES[@]}" -eq 0 ]; then
            echo "No changed Nix files; skip file lint."
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            for f in "${NIX_FILES[@]}"; do
              nix --extra-experimental-features 'nix-command flakes' shell nixpkgs#alejandra nixpkgs#statix nixpkgs#deadnix nixpkgs#just -c alejandra --check "$f"
              if [ "$f" = "flake.nix" ] || [ "$f" = "modules/services/bonsai.nix" ] || [ "$f" = "hosts/zephyr/configuration.nix" ]; then
                echo "::notice::Skipping pre-existing Statix/Deadnix findings in $f; Alejandra remains enforced."
              else
                nix --extra-experimental-features 'nix-command flakes' shell nixpkgs#alejandra nixpkgs#statix nixpkgs#deadnix nixpkgs#just -c statix check "$f"
                nix --extra-experimental-features 'nix-command flakes' shell nixpkgs#alejandra nixpkgs#statix nixpkgs#deadnix nixpkgs#just -c deadnix --fail "$f"
              fi
            done
          else
            nix --extra-experimental-features 'nix-command flakes' shell nixpkgs#alejandra nixpkgs#statix nixpkgs#deadnix nixpkgs#just -c just lint
          fi

  # ============================================================================
  # STAGE 2b: Impurity guard (issue #309) — no hardcoded /home/<user> paths
  # ============================================================================

  home-path-guard:
    timeout-minutes: 15
    name: Home Path Guard (#309)
    runs-on: [self-hosted, nixos]
    steps:
      - name: Checkout
        # pin:actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Fail on hardcoded /home/j_kro paths (issue #309)
        run: |
          set -uo pipefail
          FAILED=0
          # Scope: the shared cross-host layer (modules/system, network,
          # security, overlays). User-scoped service paths (modules/services,
          # development, hosts/*) are tracked for migration in #309 and are
          # intentionally NOT scanned here. Allow: (a) container images that
          # parameterize the home (overlays/images.nix, packages/*), (b)
          # multi-line option-default metadata (boot-emergency-diagnostics
          # ggufPath entries), (c) comments, (d) the derivation idiom
          # `users.users.j_kro.home or "/home/j_kro"` itself, (e) same-line
          # option `default =`/`example =`/`homeDirectory =` metadata.
          while IFS= read -r file; do
            case "$file" in
              overlays/images.nix|modules/system/boot-emergency-diagnostics.nix) continue ;;
              *.nix) ;;
              *) continue ;;
            esac
            # process substitution so FAILED propagates out of the loop
            while IFS=: read -r line rest; do
              [ -z "$rest" ] && continue
              trimmed="${rest#"${rest%%[![:space:]]*}"}"
              case "$trimmed" in
                \#*) continue ;;
              esac
              echo "$rest" | grep -qE 'users\.users\.j_kro\.home or' && continue
              echo "$rest" | grep -qE '(default|example|homeDirectory)\s*=' && continue
              echo "::error file=$file,line=$line::$rest"
              FAILED=1
            done < <(grep -n '/home/j_kro' "$file" 2>/dev/null || true)
          done < <(find modules/system modules/network modules/security overlays -name '*.nix' 2>/dev/null)
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Hardcoded /home/j_kro path in shared layer (issue #309). Use config.users.users.j_kro.home instead."
            exit 1
          fi
          echo "Clean: no hardcoded /home/j_kro paths in the shared cross-host layer."

  # ============================================================================
  # STAGE 3: Test suite (source-level validation, no heavy nix eval)
  # ============================================================================

  tests:
    timeout-minutes: 90
    name: Test Suite
    runs-on: [self-hosted, nixos]
    needs: [parse-check]
    steps:
      - name: Checkout
        # pin:actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - name: Parse all test files
        run: |
          for test in tests/*.nix; do
            echo "Parsing $test..."
            nix-instantiate --parse "$test" > /dev/null
          done

      # ── Source-level test suite (eval gate) ────────────────────────────
      # Each tests/*.nix returns { passed = bool; failures = [...]; } (or
      # all_pass). Previously this job ran `nix-instantiate --eval` and never
      # asserted the result — a failing test exited 0. Now every test is
      # evaluated strictly and the job FAILS on `passed=false`/`all_pass=false`
      # or a non-empty failures list. The same tests are also wired into
      # flake.nix `checks.x86_64-linux` so `nix flake check` gates them too.

      - name: Run source-level test suite (asserts passed/all_pass)
        run: |
          set -uo pipefail
          FAILED=0
          for test in tests/*.nix; do
            name=$(basename "$test" .nix)
            [ "$name" = "lib" ] && continue
            echo "=== $name ==="
            out=$(nix-instantiate --eval --strict --arg pkgs 'import <nixpkgs> {}' "$test" 2>&1)
            rc=$?
            echo "$out" | tail -2
            if [ $rc -ne 0 ]; then
              echo "::error::test $name FAILED to evaluate"
              FAILED=1
              continue
            fi
            # Assert SUCCESS (passed=true / all_pass=true). Every test exposes
            # one of these; checking for `passed = false` instead would
            # false-positive on the empty `failures = [ ]` of passing tests.
            if ! echo "$out" | grep -qE 'passed\s*=\s*true|all_pass\s*=\s*true'; then
              echo "::error::test $name FAILED assertions"
              echo "$out" | grep -E 'failures|passed|all_pass' || true
              FAILED=1
              continue
            fi
            echo "::notice::test $name PASSED"
          done
          exit $FAILED

  # ============================================================================
  # STAGE 4: Host-specific build validation
  # ============================================================================

  security:
    timeout-minutes: 30
    name: Security Scan
    runs-on: [self-hosted, nixos]
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        # pin:actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - name: Run osv-scanner
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            TARGET_SHA="${{ github.event.pull_request.head.sha }}"
            SCAN_FILES=()
            while IFS= read -r -d '' file; do
              [ -f "$file" ] || continue
              case "$file" in
                *.go.mod|*.go.sum|*requirements*.txt|*Pipfile.lock|*poetry.lock|*pyproject.toml|*package-lock.json|*pnpm-lock.yaml|*yarn.lock|*Cargo.toml|*Cargo.lock|*composer.lock|*Gemfile.lock|*pubspec.lock|*.csproj|*.fsproj|*.gradle|*.gradle.kts|*pom.xml)
                  SCAN_FILES+=("$file")
                  ;;
              esac
            done < <(git diff --name-only -z "$BASE_SHA...$TARGET_SHA")
            if [ "${#SCAN_FILES[@]}" -eq 0 ]; then
              echo "::notice::No dependency manifests changed; full OSV scan runs on trusted pushes."
              exit 0
            fi
            printf 'Scanning changed manifests:\n- %s\n' "${SCAN_FILES[@]}"
            nix shell github:NixOS/nixpkgs/0954f7ee2f6bb3dc7d4e3d0d8bcb8fd4bde4cfc5#osv-scanner -c osv-scanner --no-resolve --format=sarif --output=results.sarif "${SCAN_FILES[@]}"
          else
            nix shell github:NixOS/nixpkgs/0954f7ee2f6bb3dc7d4e3d0d8bcb8fd4bde4cfc5#osv-scanner -c osv-scanner --no-resolve --recursive --format=sarif --output=results.sarif "$PWD"
          fi

      - name: Upload SARIF
        if: always() && github.event_name != 'pull_request' && hashFiles('results.sarif') != ''
        # pin:github/codeql-action/upload-sarif@v3
        uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b
        with:
          sarif_file: results.sarif

  # ============================================================================
  # STAGE 5: Build (heavy, self-hosted runner only)
  # ============================================================================

  build:
    timeout-minutes: 360
    name: Build Configs
    needs: [quick-check, lint, tests]
    # Hosted GitHub runners are retired (2026-08-13) — all jobs run on the
    # pinned Nexus builder only.
    runs-on: [self-hosted, nixos, nexus, builder]
    steps:
      - name: Checkout
        # pin:actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - name: Pre-deploy validation (trusted main only)
        if: github.event_name != 'pull_request'
        run: |
          FLAKE="$GITHUB_WORKSPACE" ./scripts/preflight-check.sh --no-fetch

      - name: Documentation verification
        if: github.event_name != 'pull_request'
        run: |
          bash docs/meta/VERIFICATION-SUITE/run.sh

      - name: Build all hosts
        if: github.event_name != 'pull_request'
        run: |
          for host in zephyr nexus forge sentry; do
            echo "Building $host..."
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              BUILD_CMD=(nix build ".#nixosConfigurations.$host.config.system.build.toplevel" --no-link)
            else
              BUILD_CMD=(nixos-rebuild build --flake ".#$host")
            fi
            if ! "${BUILD_CMD[@]}" 2>&1 | tee "/tmp/build-$host.log"; then
              echo "ERROR: Build failed for $host"
              cat "/tmp/build-$host.log"
              exit 1
            fi
            echo "✓ $host built successfully"
            # Validate generated unbound config
            if [ -L "result" ] && [ -f "result/etc/unbound/unbound.conf" ]; then
              echo "--- unbound-checkconf $host ---"
              nix-shell -p unbound --run "unbound-checkconf result/etc/unbound/unbound.conf" || \
                echo "::warning::unbound-checkconf failed for $host"
            fi
            rm -f result
          done

      - name: Validate k8s manifests (kubeconform)
        if: github.event_name != 'pull_request'
        run: |
          nix build '.#kubernetes.combined.manifestYAMLFile' --no-link -o /tmp/k8s-manifest
          if [ -f /tmp/k8s-manifest ]; then
            nix-shell -p kubeconform --run 'kubeconform -summary /tmp/k8s-manifest'
            rm -f /tmp/k8s-manifest
          else
            echo "ERROR: k8s manifest not produced"
            exit 1
          fi
