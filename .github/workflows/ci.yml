---
name: CI

on:
  pull_request:
  push:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  # ============================================================================
  # STAGE 1: Quick validation (fast, runs on GitHub runners)
  # ============================================================================

  parse-check:
    name: Parse Check
    runs-on: [self-hosted, nixos]
    steps:
      - name: Checkout
        # pin:actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - name: Verify commit signatures
        if: github.event_name == 'pull_request'
        run: |
          COMMITS=$(git log ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} --format=%H)
          FAILED=0
          for sha in $COMMITS; do
            if ! git verify-commit $sha 2>/dev/null; then
              echo "::warning::Commit $sha is NOT signed"
              FAILED=$((FAILED + 1))
            else
              echo "Commit $sha is signed"
            fi
          done
          echo "$FAILED unsigned commit(s) found"

      - name: Install Nix
        # pin:cachix/install-nix-action@v31
        uses: cachix/install-nix-action@b97f05dcb019ddea06450a50ef6203d2fdc19fee
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Parse all Nix files
        run: |
          FAILED=0
          find . -name "*.nix" -not -path "./.git/*" | while read -r f; do
            if ! nix-instantiate --parse "$f" > /dev/null 2>&1; then
              echo "PARSE ERROR: $f"
              FAILED=1
            fi
          done
          exit $FAILED

  quick-check:
    name: Quick Check
    runs-on: [self-hosted, nixos]
    steps:
      - name: Checkout
        # pin:actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - name: Install Nix
        # pin:cachix/install-nix-action@v31
        uses: cachix/install-nix-action@b97f05dcb019ddea06450a50ef6203d2fdc19fee
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Cachix
        # pin:cachix/cachix-action@v17
        uses: cachix/cachix-action@02b16339eddcf6ea27126a830c7f1992855cae13
        with:
          name: reverb-os
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Nix flake check
        run: nix flake check --no-build

  # ============================================================================
  # STAGE 2: Linting and static analysis
  # ============================================================================

  lint:
    name: Lint Nix
    runs-on: [self-hosted, nixos]
    steps:
      - name: Checkout
        # pin:actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - name: Install Nix
        # pin:cachix/install-nix-action@v31
        uses: cachix/install-nix-action@b97f05dcb019ddea06450a50ef6203d2fdc19fee
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Cachix
        # pin:cachix/cachix-action@v17
        uses: cachix/cachix-action@02b16339eddcf6ea27126a830c7f1992855cae13
        with:
          name: reverb-os
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Run statix
        run: |
          # Exclude easykubenix modules and standalone flakes that use non-standard syntax
          find . -name "*.nix" -not -path "./.git/*" \
            -not -path "./kubernetes/*" \
            -not -name "recovery-usb.nix" \
            -not -name "portable-usb.nix" \
            -print0 | xargs -0 nix shell nixpkgs#statix --command statix check 2>&1 | grep -q 'Error:' && exit 1 || exit 0
      - name: Run deadnix
        run: nix shell nixpkgs#deadnix --command deadnix --no-lambda-arg --no-lambda-pattern-names . 2>&1 | tee /tmp/deadnix.log || true; if grep -qE '^Found|Warning' /tmp/deadnix.log 2>/dev/null; then echo '::warning::deadnix found unused code'; fi

  # ============================================================================
  # STAGE 3: Test suite (source-level validation, no heavy nix eval)
  # ============================================================================

  tests:
    name: Test Suite
    runs-on: [self-hosted, nixos]
    needs: [parse-check]
    steps:
      - name: Checkout
        # pin:actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - name: Install Nix
        # pin:cachix/install-nix-action@v31
        uses: cachix/install-nix-action@b97f05dcb019ddea06450a50ef6203d2fdc19fee
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Parse all test files
        run: |
          for test in tests/*.nix; do
            echo "Parsing $test..."
            nix-instantiate --parse "$test" > /dev/null
          done

      - name: Module Import Integrity Test (F12)
        run: |
          nix-instantiate --eval \
            --arg pkgs 'import <nixpkgs> {}' \
            tests/import-integrity.nix

      - name: Module Template Compliance Test (F13)
        run: |
          nix-instantiate --eval \
            --arg pkgs 'import <nixpkgs> {}' \
            tests/module-template-compliance.nix

      - name: Firewall Lint Test (F14)
        run: |
          nix-instantiate --eval \
            --arg pkgs 'import <nixpkgs> {}' \
            tests/firewall-lint.nix

      - name: K3s Cluster Test (F15)
        run: |
          nix-instantiate --eval \
            --arg pkgs 'import <nixpkgs> {}' \
            tests/k3s-cluster.nix

      - name: Network Constants Test (F22)
        run: |
          nix-instantiate --eval \
            --arg pkgs 'import <nixpkgs> {}' \
            tests/network-constants.nix

      - name: Integration Smoke Test (F23)
        run: |
          nix-instantiate --eval \
            --arg pkgs 'import <nixpkgs> {}' \
            tests/integration-smoke.nix

      - name: Flake Input Consistency Test (F29)
        run: |
          nix-instantiate --eval \
            --arg pkgs 'import <nixpkgs> {}' \
            tests/flake-input-consistency.nix

      - name: Host Configuration Test
        run: |
          nix-instantiate --eval             --arg pkgs 'import <nixpkgs> {}'             tests/host-configuration.nix

      - name: Options Consistency Test
        run: |
          nix-instantiate --eval             --arg pkgs 'import <nixpkgs> {}'             tests/options-consistency.nix

  # ============================================================================
  # STAGE 4: Host-specific build validation
  # ============================================================================

  security:
    name: Security Scan
    runs-on: [self-hosted, nixos]
    steps:
      - name: Checkout
        # pin:actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - name: Run osv-scanner
        run: |
          nix-shell -p osv-scanner --run 'osv-scanner --recursive --format=sarif --output=results.sarif $PWD' || true

      - name: Upload SARIF
        if: always() && hashFiles('results.sarif') != ''
        # pin:github/codeql-action/upload-sarif@v3
        uses: github/codeql-action/upload-sarif@3b1a19a80ab047f35cbb237b5bd9bdc1e14f166c
        with:
          sarif_file: results.sarif

  # ============================================================================
  # STAGE 5: Build (heavy, self-hosted runner only)
  # ============================================================================

  build:
    name: Build Configs
    needs: [quick-check, lint, tests]
    runs-on: [self-hosted, nixos]
    steps:
      - name: Checkout
        # pin:actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - name: Pre-deploy validation
        continue-on-error: true
        run: |
          ./scripts/pre-deploy-check.sh all || echo "::warning::pre-deploy-check failed (niri git input fetch issue)"

      - name: Documentation verification
        run: |
          just docs-audit 2>/dev/null || echo "::warning::just docs-audit failed — LIVE/ documents may need updates"

      - name: Build all hosts
        run: |
          for host in zephyr nexus forge sentry; do
            echo "Building $host..."
            if ! nixos-rebuild build --flake .#$host 2>&1 | tee /tmp/build-$host.log; then
              echo "ERROR: Build failed for $host"
              cat /tmp/build-$host.log
              exit 1
            fi
            echo "✓ $host built successfully"
            # Validate generated unbound config
            if [ -L "result" ] && [ -f "result/etc/unbound/unbound.conf" ]; then
              echo "--- unbound-checkconf $host ---"
              nix-shell -p unbound --run "unbound-checkconf result/etc/unbound/unbound.conf" || \
                echo "::warning::unbound-checkconf failed for $host"
            fi
            rm -f result
          done

      - name: Validate k8s manifests (kubeconform)
        run: |
          nix build '.#kubernetes.combined.manifestYAMLFile' --no-link -o /tmp/k8s-manifest 2>&1 || \
            echo "::warning::k8s manifest build failed (frozen-hash anomaly?)"
          if [ -f /tmp/k8s-manifest ]; then
            nix-shell -p kubeconform --run 'kubeconform -summary /tmp/k8s-manifest' || \
              echo "::warning::kubeconform found issues in k8s manifests"
            rm -f /tmp/k8s-manifest
          fi
