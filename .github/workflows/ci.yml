---
name: CI

on:
  pull_request:
  push:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  # ============================================================================
  # STAGE 1: Quick validation (fast, runs on GitHub runners)
  # ============================================================================

  parse-check:
    name: Parse Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # pin:actions/checkout@v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Nix
        # pin:cachix/install-nix-action@v25
        uses: cachix/install-nix-action@6004951b182f8860210c8d6f0d808ec5b1a33d28
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Parse all Nix files
        run: |
          FAILED=0
          find . -name "*.nix" -not -path "./.git/*" | while read -r f; do
            if ! nix-instantiate --parse "$f" > /dev/null 2>&1; then
              echo "PARSE ERROR: $f"
              FAILED=1
            fi
          done
          exit $FAILED

  quick-check:
    name: Quick Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # pin:actions/checkout@v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Nix
        # pin:cachix/install-nix-action@v25
        uses: cachix/install-nix-action@6004951b182f8860210c8d6f0d808ec5b1a33d28
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Cachix
        # pin:cachix/cachix-action@v14
        uses: cachix/cachix-action@18cf96c7c98e048e10a83abd92116114cd8504be
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nixos-community

      - name: Nix flake check
        run: nix flake check

  # ============================================================================
  # STAGE 2: Linting and static analysis
  # ============================================================================

  lint:
    name: Lint Nix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # pin:actions/checkout@v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Nix
        # pin:cachix/install-nix-action@v25
        uses: cachix/install-nix-action@6004951b182f8860210c8d6f0d808ec5b1a33d28

      - name: Setup Cachix
        # pin:cachix/cachix-action@v14
        uses: cachix/cachix-action@18cf96c7c98e048e10a83abd92116114cd8504be
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nixos-community

      - name: Run statix
        run: nix shell nixpkgs#statix --command statix check .

      - name: Run deadnix
        run: nix shell nixpkgs#deadnix --command deadnix -f .

  # ============================================================================
  # STAGE 3: Test suite (source-level validation, no heavy nix eval)
  # ============================================================================

  tests:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: [parse-check]
    steps:
      - name: Checkout
        # pin:actions/checkout@v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Nix
        # pin:cachix/install-nix-action@v25
        uses: cachix/install-nix-action@6004951b182f8860210c8d6f0d808ec5b1a33d28

      - name: Parse all test files
        run: |
          for test in tests/*.nix; do
            echo "Parsing $test..."
            nix-instantiate --parse "$test" > /dev/null
          done

      - name: Module Import Integrity Test (F12)
        run: |
          nix-instantiate --eval \
            --arg pkgs 'import <nixpkgs> {}' \
            tests/import-integrity.nix

      - name: Module Template Compliance Test (F13)
        run: |
          nix-instantiate --eval \
            --arg pkgs 'import <nixpkgs> {}' \
            tests/module-template-compliance.nix

      - name: Firewall Lint Test (F14)
        run: |
          nix-instantiate --eval \
            --arg pkgs 'import <nixpkgs> {}' \
            tests/firewall-lint.nix

      - name: K3s Cluster Test (F15)
        run: |
          nix-instantiate --eval \
            --arg pkgs 'import <nixpkgs> {}' \
            tests/k3s-cluster.nix

      - name: Network Constants Test (F22)
        run: |
          nix-instantiate --eval \
            --arg pkgs 'import <nixpkgs> {}' \
            tests/network-constants.nix

      - name: Integration Smoke Test (F23)
        run: |
          nix-instantiate --eval \
            --arg pkgs 'import <nixpkgs> {}' \
            tests/integration-smoke.nix

      - name: Flake Input Consistency Test (F29)
        run: |
          nix-instantiate --eval \
            --arg pkgs 'import <nixpkgs> {}' \
            tests/flake-input-consistency.nix

  # ============================================================================
  # STAGE 4: Security scanning
  # ============================================================================

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # pin:actions/checkout@v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Run osv-scanner
        # pin:google/osv-scanner-action@v2.3.5
        uses: google/osv-scanner-action@c51854704019a247608d928f370c98740469d4b5
        with:
          scan-args: |
            --skip-git
            --recursive
            --format=sarif
            --output=results.sarif

      - name: Upload SARIF
        if: always()
        # pin:github/codeql-action/upload-sarif@v3
        uses: github/codeql-action/upload-sarif@3b1a19a80ab047f35cbb237b5bd9bdc1e14f166c
        with:
          sarif_file: results.sarif

  # ============================================================================
  # STAGE 5: Build (heavy, self-hosted runner only)
  # ============================================================================

  build:
    name: Build Configs
    needs: [quick-check, lint, tests]
    runs-on: [self-hosted, nixos]
    steps:
      - name: Checkout
        # pin:actions/checkout@v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Pre-deploy validation
        run: |
          cd /etc/nixos
          ./scripts/pre-deploy-check.sh all

      - name: Build all hosts
        run: |
          # Build each host configuration (NFS-based, no Colmena needed)
          for host in zephyr nexus forge sentry; do
            echo "Building $host..."
            if ! nixos-rebuild build --flake .#$host 2>&1 | tee /tmp/build-$host.log; then
              echo "ERROR: Build failed for $host"
              cat /tmp/build-$host.log
              exit 1
            fi
          done

      - name: Verify build outputs
        run: |
          for host in zephyr nexus forge sentry; do
            echo "Verifying $host build output..."
            if [ ! -f "/nix/var/nix/profiles/system-$host" ]; then
              echo "ERROR: Build output not found for $host"
              exit 1
            fi
          done
