name: doc-rot-guard

on:
  schedule:
    - cron: '0 4 * * *'  # Daily at 4 AM
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/**'
      - 'modules/**'
      - 'hosts/**'
      - 'kubernetes/**'
      - 'justfile'

concurrency:
  group: doc-rot-guard
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  stale-check:
    runs-on: [self-hosted, nixos]
    steps:
      # pin:actions/checkout@v4
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      # pin:cachix/install-nix-action@v31
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Cache Nix store
        # pin:cachix/cachix-action@v17
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71
        with:
          name: reverb-os
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nixos-community

      - name: Run documentation verification suite
        run: |
          nix develop --command just docs-audit

      - name: Report documentation failure
        if: failure()
        run: |
          echo "Documentation verification failed. Run 'just docs-audit' locally and fix the reported active-doc or link failure."
          exit 1