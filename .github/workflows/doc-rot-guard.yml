name: doc-rot-guard

on:
  schedule:
    - cron: '0 4 * * *'  # Daily at 4 AM
  workflow_dispatch:
  # NO pull_request trigger: the PR branch is untrusted code evaluated via
  # `nix develop --command just docs-audit` on the self-hosted runner
  # (supply-chain boundary, ci-workflow-policy.py). PR docs regressions are
  # caught by ci.yml's trusted-only "Documentation verification" step.

concurrency:
  group: doc-rot-guard
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stale-check:
    runs-on: [self-hosted, nixos]
    steps:
      # pin:actions/checkout@v4
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - name: Run documentation verification suite
        run: |
          nix develop --command just docs-audit

      - name: Report documentation failure
        if: failure()
        run: |
          echo "Documentation verification failed. Run 'just docs-audit' locally and fix the reported active-doc or link failure."
          exit 1