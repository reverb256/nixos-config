---
name: Zz Diagnose B

# TEMPORARY diagnostic workflow (remove after CI/CD fix confirmed).
# Bisect 4b: does cachix/cachix-action@5f2d7c52 alone break startup?

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cachix-only:
    name: Probe-B-Cachix
    runs-on: [self-hosted, nixos]
    steps:
      - name: Checkout
        # pin:actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Setup Cachix
        # pin:cachix/cachix-action@v17
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71
        with:
          name: reverb-os
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Hello
        run: echo "cachix probe ran on $(hostname)"
