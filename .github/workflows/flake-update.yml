---
name: Update Flake Lock

on:
  schedule:
    # Project inputs: weekly Sunday 3am UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      target:
        description: 'Which inputs to update'
        required: true
        default: 'projects'
        type: choice
        options:
          - projects
          - nixpkgs
          - all

permissions:
  contents: write
  pull-requests: write

jobs:
  update-projects:
    name: Update project flake inputs
    if: github.event.inputs.target == 'projects' || github.event.inputs.target == 'all' || github.event_name == 'schedule'
    # Self-hosted runner required: project inputs are local paths (path:/data/projects/own/*)
    runs-on: [self-hosted, nixos]
    strategy:
      fail-fast: false
      matrix:
        input:
          - ai-gateway
          - knowledge-fabric
          - llama-turboquant
          - compute-market
          - mcp-registry
          - caddy-ingress
          - gpu-proxy
    steps:
      - name: Checkout
        # pin:actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install Nix
        # pin:cachix/install-nix-action@v31
        uses: cachix/install-nix-action@b97f05dcb019ddea06450a50ef6203d2fdc19fee
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Cachix
        # pin:cachix/cachix-action@v17
        uses: cachix/cachix-action@02b16339eddcf6ea27126a830c7f1992855cae13
        with:
          name: reverb-os
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Update ${{ matrix.input }}
        run: |
          BEFORE=$(git rev-parse HEAD:flake.lock)
          nix flake update ${{ matrix.input }}
          AFTER=$(git rev-parse HEAD:flake.lock)

          if [ "$BEFORE" = "$AFTER" ]; then
            echo "No changes for ${{ matrix.input }}"
            echo "CHANGED=false" >> $GITHUB_ENV
          else
            echo "CHANGED=true" >> $GITHUB_ENV
          fi

      - name: Verify build
        if: env.CHANGED == 'true'
        run: nix flake check

      - name: Create PR
        if: env.CHANGED == 'true'
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c
        with:
          title: "chore(deps): update ${{ matrix.input }} flake input"
          body: |
            Automated selective flake input update.

            Updated input: `${{ matrix.input }}`

            Only this input was updated to isolate any breakage.
            Please review and verify the changes work correctly.
          branch: update/deps-${{ matrix.input }}
          commit-message: "chore(deps): update ${{ matrix.input }} flake input"
          delete-branch: true

  update-nixpkgs:
    name: Update nixpkgs
    if: github.event.inputs.target == 'nixpkgs' || github.event.inputs.target == 'all'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # pin:actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install Nix
        # pin:cachix/install-nix-action@v31
        uses: cachix/install-nix-action@b97f05dcb019ddea06450a50ef6203d2fdc19fee
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Cachix
        # pin:cachix/cachix-action@v17
        uses: cachix/cachix-action@02b16339eddcf6ea27126a830c7f1992855cae13
        with:
          name: reverb-os
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Update nixpkgs only
        run: nix flake update nixpkgs

      - name: Verify build
        run: nix flake check

      - name: Create PR
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c
        with:
          title: "chore(deps): update nixpkgs"
          body: |
            Automated nixpkgs update.

            **WARNING**: nixpkgs update may trigger cascading rebuilds
            including hermes-agent npm dependencies.

            Please review carefully before merging.
          branch: update/deps-nixpkgs
          commit-message: "chore(deps): update nixpkgs"
          delete-branch: true
