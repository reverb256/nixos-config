---
name: Update Flake Lock

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-flake:
    name: Update flake.lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # pin:actions/checkout@v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Nix
        # pin:cachix/install-nix-action@v25
        uses: cachix/install-nix-action@6004951b182f8860210c8d6f0d808ec5b1a33d28
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Cachix
        # pin:cachix/cachix-action@v14
        uses: cachix/cachix-action@18cf96c7c98e048e10a83abd92116114cd8504be
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Update flake.lock
        run: nix flake update

      - name: Build to verify
        run: nix flake check

      - name: Create PR
        # pin:peter-evans/create-pull-request@v6
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c
        with:
          title: "chore: update flake.lock"
          body: |
            Automated flake.lock update

            Changes:
            - Updated nixpkgs
            - Updated other flake inputs

            Please review the changes and ensure nothing breaks.
          branch: update/flake-lock
          commit-message: "chore: update flake.lock"
          delete-branch: true
