---
name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      target:
        description: 'Target host(s)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - zephyr
          - nexus
          - forge
          - sentry

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cluster
    runs-on: [self-hosted, nixos]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pre-deploy validation
        run: |
          cd /etc/nixos
          ./scripts/pre-deploy-check.sh "${{ github.event.inputs.target || 'all' }}"

      - name: Pause mining
        run: |
          sudo systemctl stop mining.target

      - name: Deploy to hosts
        run: |
          # Colmena-based deployment with dependency management and rollback
          cd /etc/nixos

          # Signal GPU scheduler (for GPU nodes: zephyr, nexus, forge)
          signal_gpu_scheduler() {
            local state=$1
            local host=$2
            if [ "$host" = "zephyr" ] || [ "$host" = "nexus" ] || [ "$host" = "forge" ]; then
              if [ "$host" = "zephyr" ]; then
                echo "$state" | sudo tee /run/gpu-scheduler/ai-state > /dev/null
              else
                ssh $host "echo '$state' | sudo tee /run/gpu-scheduler/ai-state > /dev/null"
              fi
            fi
          }

          # Build Colmena command with target selection
          if [ "${{ github.event.inputs.target }}" != "all" ] && [ -n "${{ github.event.inputs.target }}" ]; then
            COLMENA_TARGET="--on ${{ github.event.inputs.target }}"
          else
            COLMENA_TARGET=""
          fi

          # Signal deployment start for GPU nodes
          if [ -z "$COLMENA_TARGET" ]; then
            for host in zephyr nexus forge; do
              signal_gpu_scheduler "DEPLOY_IN_PROGRESS" "$host"
            done
          else
            signal_gpu_scheduler "DEPLOY_IN_PROGRESS" "${{ github.event.inputs.target }}"
          fi

          # Deploy using Colmena
          if ! nix run .#apps.x86_64-linux.colmena -- apply $COLMENA_TARGET 2>&1 | tee /tmp/deploy-colmena.log; then
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "ERROR: Colmena deployment failed"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            cat /tmp/deploy-colmena.log
            exit 1
          fi

          # Signal deployment complete for GPU nodes
          if [ -z "$COLMENA_TARGET" ]; then
            for host in zephyr nexus forge; do
              signal_gpu_scheduler "IDLE" "$host"
            done
          else
            signal_gpu_scheduler "IDLE" "${{ github.event.inputs.target }}"
          fi

          echo "✓ Successfully deployed using Colmena"

      - name: Resume mining
        if: always()
        run: |
          sudo systemctl start mining.target

      - name: Health check
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Running health checks..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          for host in zephyr nexus forge sentry; do
            echo "Checking $host..."
            if [ "$host" = "zephyr" ]; then
              if curl -f http://127.0.0.1:8080/health 2>/dev/null; then
                echo "✓ $host health check passed"
              else
                echo "⚠ $host health check failed (no endpoint configured)"
              fi
            else
              if ssh $host "curl -f http://127.0.0.1:8080/health" 2>/dev/null; then
                echo "✓ $host health check passed"
              else
                echo "⚠ $host health check failed (no endpoint configured)"
              fi
            fi
          done

      - name: Notify on failure
        if: failure()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "DEPLOYMENT FAILED"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Check the workflow logs for details"
