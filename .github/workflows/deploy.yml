---
name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      target:
        description: 'Target host(s)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - zephyr
          - nexus
          - forge
          - sentry

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cluster
    runs-on: [self-hosted, nixos]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pre-deploy validation
        run: |
          cd /etc/nixos
          ./scripts/pre-deploy-check.sh "${{ github.event.inputs.target || 'all' }}"

      - name: Pause mining
        run: |
          sudo systemctl stop xmrig@* || true
          sudo systemctl stop lolminer-* || true

      - name: Deploy to hosts
        run: |
          # NFS-based deployment: config is already on hosts via NFS mount
          # Just need to SSH and run nixos-rebuild on each target
          
          rebuild_host() {
            local host=$1
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Deploying to $host..."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            
            if [ "$host" = "zephyr" ]; then
              # Local deployment
              if ! sudo /etc/nixos/scripts/nixos-rebuild-safe.sh switch --flake /etc/nixos#zephyr 2>&1 | tee /tmp/deploy-$host.log; then
                echo "ERROR: Deployment failed for $host"
                cat /tmp/deploy-$host.log
                return 1
              fi
            else
              # Remote deployment (config already mounted via NFS)
              if ! ssh $host "sudo nixos-rebuild switch --flake /etc/nixos#$host" 2>&1 | tee /tmp/deploy-$host.log; then
                echo "ERROR: Deployment failed for $host"
                cat /tmp/deploy-$host.log
                return 1
              fi
            fi
            
            echo "✓ Successfully deployed to $host"
          }
          
          # Track failures
          FAILED_HOSTS=()
          
          if [ "${{ github.event.inputs.target }}" = "zephyr" ]; then
            rebuild_host "zephyr" || FAILED_HOSTS+=("zephyr")
          elif [ "${{ github.event.inputs.target }}" = "nexus" ]; then
            rebuild_host "nexus" || FAILED_HOSTS+=("nexus")
          elif [ "${{ github.event.inputs.target }}" = "forge" ]; then
            rebuild_host "forge" || FAILED_HOSTS+=("forge")
          elif [ "${{ github.event.inputs.target }}" = "sentry" ]; then
            rebuild_host "sentry" || FAILED_HOSTS+=("sentry")
          else
            # Deploy to all hosts (continue on error to report all failures)
            for host in zephyr nexus forge sentry; do
              rebuild_host "$host" || FAILED_HOSTS+=("$host")
            done
          fi
          
          # Exit with error if any deployments failed
          if [ ${#FAILED_HOSTS[@]} -gt 0 ]; then
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "ERROR: Deployment failed for: ${FAILED_HOSTS[*]}"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            exit 1
          fi

      - name: Resume mining
        if: always()
        run: |
          sudo systemctl start xmrig@* || true
          sudo systemctl start lolminer-* || true

      - name: Health check
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Running health checks..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          for host in zephyr nexus forge sentry; do
            echo "Checking $host..."
            if [ "$host" = "zephyr" ]; then
              if curl -f http://127.0.0.1:8080/health 2>/dev/null; then
                echo "✓ $host health check passed"
              else
                echo "⚠ $host health check failed (no endpoint configured)"
              fi
            else
              if ssh $host "curl -f http://127.0.0.1:8080/health" 2>/dev/null; then
                echo "✓ $host health check passed"
              else
                echo "⚠ $host health check failed (no endpoint configured)"
              fi
            fi
          done

      - name: Notify on failure
        if: failure()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "DEPLOYMENT FAILED"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Check the workflow logs for details"
