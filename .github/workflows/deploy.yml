---
name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target host(s)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - zephyr
          - nexus
          - forge
          - sentry
          - krash3

permissions:
  contents: write
  id-token: write

jobs:
  deploy:
    name: Deploy to Cluster
    runs-on: [self-hosted, nixos]
    steps:
      - name: Checkout
        # pin:actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Pre-build validation
        run: |
          cd /etc/nixos
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Pre-build: verifying configs build before deploying..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          TARGET="${{ github.event.inputs.target }}"
          if [ "$TARGET" = "all" ]; then
            HOSTS="zephyr nexus forge sentry krash3"
          else
            HOSTS="$TARGET"
          fi

          for host in $HOSTS; do
            echo "Building $host..."
            if ! nixos-rebuild build --flake .#$host 2>&1 | tee /tmp/prebuild-$host.log; then
              echo ""
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "ERROR: Build failed for $host -- aborting deploy"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              cat /tmp/prebuild-$host.log
              exit 1
            fi
            echo "✓ $host builds successfully"
          done

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "All targets build successfully. Proceeding with deploy..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Pause mining
        run: |
          sudo systemctl stop mining.target

      - name: Deploy to hosts
        run: |
          cd /etc/nixos

          # Signal GPU scheduler
          signal_gpu_scheduler() {
            local state=$1
            local host=$2
            if [ "$host" = "zephyr" ] || [ "$host" = "nexus" ] || [ "$host" = "forge" ] || [ "$host" = "sentry" ]; then
              if [ "$host" = "zephyr" ]; then
                echo "$state" | sudo tee /run/gpu-scheduler/ai-state > /dev/null
              else
                ssh $host "echo '$state' | sudo tee /run/gpu-scheduler/ai-state > /dev/null"
              fi
            fi
          }

          ALL_HOSTS="zephyr nexus forge sentry krash3"
          GPU_HOSTS="zephyr nexus forge sentry"

          TARGET="${{ github.event.inputs.target }}"
          if [ "$TARGET" = "all" ]; then
            COLMENA_TARGET=""
            DEPLOY_HOSTS="$ALL_HOSTS"
          else
            COLMENA_TARGET="--on $TARGET"
            DEPLOY_HOSTS="$TARGET"
          fi

          # Signal deployment start for GPU nodes
          for host in $GPU_HOSTS; do
            signal_gpu_scheduler "AI_START" "$host"
          done

          # Deploy using Colmena
          if ! nix run .#apps.x86_64-linux.colmena -- apply $COLMENA_TARGET 2>&1 | tee /tmp/deploy-colmena.log; then
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "ERROR: Colmena deployment failed, attempting rollback..."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            if [ -z "$COLMENA_TARGET" ]; then
              nix run .#apps.x86_64-linux.colmena -- rollback --all 2>&1 | tee -a /tmp/deploy-colmena.log
            else
              nix run .#apps.x86_64-linux.colmena -- rollback --on "$TARGET" 2>&1 | tee -a /tmp/deploy-colmena.log
            fi

            for host in $GPU_HOSTS; do
              signal_gpu_scheduler "" "$host"
            done

            cat /tmp/deploy-colmena.log
            exit 1
          fi

          # Signal deployment complete for GPU nodes
          for host in $GPU_HOSTS; do
            signal_gpu_scheduler "" "$host"
          done

          echo "✓ Successfully deployed using Colmena"

      - name: Sync central repo
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Syncing central bare repo on nexus..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if git push central main 2>&1; then
            echo "✓ Central repo synced"
          else
            echo "⚠ Central repo sync failed (cluster nodes may have stale refs)"
          fi

      - name: Sync cluster nodes
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Pulling latest config on all cluster nodes..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          ALL_HOSTS="nexus forge sentry krash3"
          for host in $ALL_HOSTS; do
            echo "Pulling on $host..."
            if ssh "$host" "cd /etc/nixos && git stash 2>/dev/null; git pull --ff-only central main 2>&1"; then
              echo "✓ $host synced"
            else
              echo "⚠ $host pull failed (manual sync may be needed)"
            fi
          done
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "All nodes synced"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Resume mining
        if: always()
        run: |
          sudo systemctl start mining.target
          if ! sudo systemctl is-active mining.target >/dev/null 2>&1; then
            echo "WARNING: mining.target failed to start"
            sudo systemctl status mining.target || true
            exit 1
          fi
          echo "✓ Mining services restarted successfully"

      - name: Health check
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Running health checks..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          TARGET="${{ github.event.inputs.target }}"
          if [ "$TARGET" = "all" ]; then
            HOSTS="zephyr nexus forge sentry krash3"
          else
            HOSTS="$TARGET"
          fi

          for host in $HOSTS; do
            echo "Checking $host..."
            case "$host" in
              zephyr)
                if ssh localhost "uptime" 2>/dev/null; then
                  echo "✓ zephyr: SSH reachable"
                else
                  echo "⚠ zephyr: health check ambiguous"
                fi
                ;;
              nexus|forge|sentry)
                if ssh $host "uptime" 2>/dev/null; then
                  echo "✓ $host: SSH reachable"
                else
                  echo "⚠ $host: SSH unreachable"
                fi
                ;;
              krash3)
                if ssh krash3 "uptime" 2>/dev/null; then
                  echo "✓ krash3: host up"
                  if ssh krash3 "sudo virsh -c qemu:///system domstate krash3-vm" 2>/dev/null; then
                    echo "✓ krash3-vm: running"
                  else
                    echo "⚠ krash3-vm: not running"
                  fi
                else
                  echo "⚠ krash3: SSH unreachable"
                fi
                ;;
            esac
          done
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Health checks complete"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Notify on failure
        if: failure()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "DEPLOYMENT FAILED"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Check the workflow logs for details"
