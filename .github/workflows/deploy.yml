---
name: Deploy

concurrency:
  group: deploy-${{ github.event.inputs.target || 'all' }}-${{ github.ref_name }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target host(s)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - zephyr
          - nexus
          - forge
          - sentry
  push:
    branches: [prod]

permissions:
  contents: read

env:
  FLAKE_DIR: ${{ github.workspace }}

jobs:
  deploy:
    name: Deploy to Cluster
    runs-on: [self-hosted, nixos]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Determine target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "target=all" >> $GITHUB_OUTPUT
          else
            echo "target=${{ github.event.inputs.target }}" >> $GITHUB_OUTPUT
          fi

      - name: Mark runner offline (zephyr deploy only)
        if: steps.target.outputs.target == 'zephyr' || steps.target.outputs.target == 'all'
        run: |
          RUNNER_NAME=$(hostname)-runner
          echo "Runner: $RUNNER_NAME — attempting to de-register via API..."
          # De-register so new jobs route to nexus runner during zephyr reboot
          if command -v gh >/dev/null 2>&1 && [ -n "${{ secrets.GITHUB_TOKEN }}" ]; then
            RUNNER_ID=$(gh api repos/${{ github.repository }}/actions/runners               --jq '.runners[] | select(.name == env.RUNNER_NAME) | .id' 2>/dev/null || echo '')
            if [ -n "$RUNNER_ID" ]; then
              gh api -X DELETE "repos/${{ github.repository }}/actions/runners/$RUNNER_ID" >/dev/null 2>&1 || true
              echo "De-registered runner $RUNNER_NAME (ID: $RUNNER_ID)"
            else
              echo "Runner not found via API — will reconnect after reboot"
            fi
          else
            echo "gh CLI not available — runner will reconnect after reboot"
          fi

      - name: Pre-build validation
        run: |
          cd "$FLAKE_DIR"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Pre-build: verifying configs build before deploying..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          TARGET="${{ steps.target.outputs.target }}"
          if [ "$TARGET" = "all" ]; then
            HOSTS="zephyr nexus forge sentry"
          else
            HOSTS="$TARGET"
          fi

          for host in $HOSTS; do
            echo "Building $host..."
            if ! nixos-rebuild build --flake "$FLAKE_DIR#$host" 2>&1 | tee /tmp/prebuild-$host.log; then
              echo ""
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "ERROR: Build failed for $host -- aborting deploy"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              cat /tmp/prebuild-$host.log
              exit 1
            fi
            echo "✓ $host builds successfully"
          done

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "All targets build successfully. Proceeding with deploy..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Cordon K8s nodes
        run: |
          TARGET="${{ steps.target.outputs.target }}"
          if [ "$TARGET" = "all" ]; then
            NODES="zephyr nexus forge sentry"
          else
            NODES="$TARGET"
          fi

          for node in $NODES; do
            echo "Cordoning K8s node: $node..."
            if command -v kubectl &>/dev/null && kubectl get node "$node" &>/dev/null 2>&1; then
              kubectl cordon "$node" 2>&1 || echo "Warning: could not cordon $node"
            else
              echo "  (kubectl not available or node not in cluster, skipping)"
            fi
          done

      - name: Pause mining
        run: |
          if systemctl is-active --quiet mining.target 2>/dev/null; then
            sudo systemctl stop mining.target
            echo "✓ Mining paused"
          else
            echo "Mining not active, skipping"
          fi

      - name: Deploy to hosts
        run: |
          cd "$FLAKE_DIR"

          signal_gpu_scheduler() {
            local state=$1
            local host=$2
            if [ "$host" = "zephyr" ]; then
              echo "$state" | sudo tee /run/gpu-scheduler/ai-state > /dev/null 2>&1 || true
            else
              ssh -o ConnectTimeout=5 "$host" "echo '$state' | sudo tee /run/gpu-scheduler/ai-state > /dev/null" 2>/dev/null || true
            fi
          }

          TARGET="${{ steps.target.outputs.target }}"
          if [ "$TARGET" != "all" ]; then
            COLMENA_TARGET="--on $TARGET"
          else
            COLMENA_TARGET=""
          fi

          if [ -z "$COLMENA_TARGET" ]; then
            for host in zephyr nexus forge sentry; do
              signal_gpu_scheduler "AI_START" "$host"
            done
          else
            signal_gpu_scheduler "AI_START" "$TARGET"
          fi

          if ! nix run .#apps.x86_64-linux.colmena -- apply $COLMENA_TARGET 2>&1 | tee /tmp/deploy-colmena.log; then
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "ERROR: Colmena deployment failed, attempting rollback..."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            if [ -z "$COLMENA_TARGET" ]; then
              nix run .#apps.x86_64-linux.colmena -- rollback --all 2>&1 | tee -a /tmp/deploy-colmena.log
            else
              nix run .#apps.x86_64-linux.colmena -- rollback --on "$TARGET" 2>&1 | tee -a /tmp/deploy-colmena.log
            fi

            if [ -z "$COLMENA_TARGET" ]; then
              for host in zephyr nexus forge sentry; do
                signal_gpu_scheduler "" "$host"
              done
            else
              signal_gpu_scheduler "" "$TARGET"
            fi

            cat /tmp/deploy-colmena.log
            exit 1
          fi

          if [ -z "$COLMENA_TARGET" ]; then
            for host in zephyr nexus forge sentry; do
              signal_gpu_scheduler "" "$host"
            done
          else
            signal_gpu_scheduler "" "$TARGET"
          fi

          echo "✓ Successfully deployed using Colmena"

      - name: Uncordon K8s nodes
        if: always()
        run: |
          TARGET="${{ steps.target.outputs.target }}"
          if [ "$TARGET" = "all" ]; then
            NODES="zephyr nexus forge sentry"
          else
            NODES="$TARGET"
          fi

          for node in $NODES; do
            echo "Uncordoning K8s node: $node..."
            if command -v kubectl &>/dev/null && kubectl get node "$node" &>/dev/null 2>&1; then
              kubectl uncordon "$node" 2>&1 || echo "Warning: could not uncordon $node"
            else
              echo "  (kubectl not available or node not in cluster, skipping)"
            fi
          done

      - name: Resume mining
        if: always()
        run: |
          if systemctl is-active --quiet mining.target 2>/dev/null; then
            echo "Mining already active, skipping restart"
          else
            sudo systemctl start mining.target
            sleep 2
            if ! sudo systemctl is-active mining.target >/dev/null 2>&1; then
              echo "WARNING: mining.target failed to start"
              sudo systemctl status mining.target || true
              exit 1
            fi
            echo "✓ Mining services restarted successfully"
          fi

      - name: Health check
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Running health checks..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          TARGET="${{ steps.target.outputs.target }}"
          if [ "$TARGET" = "all" ]; then
            HOSTS="zephyr nexus forge sentry"
          else
            HOSTS="$TARGET"
          fi

          PASS=0
          FAIL=0
          for host in $HOSTS; do
            echo "Checking $host..."
            HEALTH_URL="http://127.0.0.1:8080/health"
            if [ "$host" = "zephyr" ]; then
              if curl -sf "$HEALTH_URL" >/dev/null 2>&1; then
                echo "  ✓ $host health check passed"
                PASS=$((PASS + 1))
              else
                echo "  ⚠ $host health check failed"
                FAIL=$((FAIL + 1))
              fi
            else
              if ssh -o ConnectTimeout=10 "$host" "curl -sf http://127.0.0.1:8080/health" >/dev/null 2>&1; then
                echo "  ✓ $host health check passed"
                PASS=$((PASS + 1))
              else
                echo "  ⚠ $host health check failed"
                FAIL=$((FAIL + 1))
              fi
            fi
          done

          echo ""
          echo "Health: $PASS passed, $FAIL failed"
          if [ "$FAIL" -gt 0 ]; then
            echo "Some health checks failed — investigate manually"
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "DEPLOYMENT FAILED"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Target: ${{ steps.target.outputs.target }}"
          echo "SHA: ${{ github.sha }}"
          echo "Check the workflow logs for details"
