---
name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      target:
        description: 'Target host(s)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - zephyr
          - nexus
          - forge
          - sentry

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cluster
    runs-on: [self-hosted, nixos]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pause mining
        run: |
          sudo systemctl stop xmrig@* || true
          sudo systemctl stop lolminer-* || true

      - name: Deploy to hosts
        run: |
          # NFS-based deployment: config is already on hosts via NFS mount
          # Just need to SSH and run nixos-rebuild on each target
          
          rebuild_host() {
            local host=$1
            echo "Deploying to $host..."
            if [ "$host" = "zephyr" ]; then
              # Local deployment
              sudo /etc/nixos/scripts/nixos-rebuild-safe.sh switch --flake /etc/nixos#zephyr
            else
              # Remote deployment (config already mounted via NFS)
              ssh $host "sudo nixos-rebuild switch --flake /etc/nixos#$host"
            fi
          }
          
          if [ "${{ github.event.inputs.target }}" = "zephyr" ]; then
            rebuild_host "zephyr"
          elif [ "${{ github.event.inputs.target }}" = "nexus" ]; then
            rebuild_host "nexus"
          elif [ "${{ github.event.inputs.target }}" = "forge" ]; then
            rebuild_host "forge"
          elif [ "${{ github.event.inputs.target }}" = "sentry" ]; then
            rebuild_host "sentry"
          else
            # Deploy to all hosts
            for host in zephyr nexus forge sentry; do
              rebuild_host "$host"
            done
          fi

      - name: Resume mining
        if: always()
        run: |
          sudo systemctl start xmrig@* || true
          sudo systemctl start lolminer-* || true

      - name: Health check
        run: |
          for host in zephyr nexus forge sentry; do
            echo "Checking $host..."
            if [ "$host" = "zephyr" ]; then
              curl -f http://127.0.0.1:8080/health || true
            else
              ssh $host "curl -f http://127.0.0.1:8080/health" || true
            fi
          done

      - name: Notify on failure
        if: failure()
        run: |
          echo "Deployment failed! Check logs."
