---
name: Create Release

on:
  push:
    branches: [prod]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Tag and Release
    runs-on: [self-hosted, nixos]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Generate version
        id: version
        run: |
          # Version = date-based: YYYY.MM.DD.buildcount
          DATE=$(date -u +%Y.%m.%d)
          # Count commits on prod since last tag to get build number
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          BUILD=$(git rev-list --count "$LAST_TAG..HEAD" 2>/dev/null || echo "1")
          VERSION="v${DATE}.${BUILD}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Generate changelog
        id: changelog
        run: |
          # Generate changelog from commits since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            RANGE="$LAST_TAG..HEAD"
          else
            RANGE="HEAD"
          fi

          echo "## What's Changed" > /tmp/changelog.md
          echo "" >> /tmp/changelog.md
          git log "$RANGE" --oneline --no-decorate --format="* %s (%h)" >> /tmp/changelog.md 2>/dev/null || echo "* Initial release" >> /tmp/changelog.md
          echo "" >> /tmp/changelog.md
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$LAST_TAG...${{ steps.version.outputs.version }}" >> /tmp/changelog.md

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/changelog.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create tag
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "${{ steps.version.outputs.version }}" -m "Release ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --title "Release ${{ steps.version.outputs.version }}" \
            --notes-file /tmp/changelog.md \
            --verify-tag
