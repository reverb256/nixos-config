name: "Merge main to infra - Light Testing"

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # Light testing only (fast feedback)
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Verify Nix installation
        run: |
          echo "Nix version: $(nix --version)"
          echo "Nix path: $(which nix)"
          nix store ping --store https://cache.nixos.org || echo "Cache ping failed (expected on first run)"

      - name: Run deadnix (unused code detection)
        continue-on-error: true
        run: |
          echo "Checking for dead code..."
          nix run nixpkgs#deadnix -- -e . || echo "::warning::deadnix issues found"

      - name: Run statix (Nix linting)
        continue-on-error: true
        run: |
          echo "Linting Nix code..."
          nix run nixpkgs#statix -- check . 2>&1 | head -20 || echo "::warning::statix issues found (may be style warnings)"

      - name: Check alejandra formatting
        continue-on-error: true
        run: |
          echo "Checking formatting..."
          nix run nixpkgs#alejandra -- --check . || echo "::warning::formatting issues found"

      - name: Check flake syntax
        run: |
          echo "Checking flake syntax..."
          nix flake metadata . || echo "Flake metadata check failed"
          nix flake check --no-build --keep-going || echo "Flake check had warnings"

      - name: Evaluate all configurations
        run: |
          echo "Evaluating configurations..."
          for host in zephyr nexus forge sentry; do
            echo "Evaluating $host..."
            nix eval .#nixosConfigurations.$host.config.system.build.toplevel --raw 2>&1 | head -5 || echo "::error::Failed to evaluate $host"
          done

  # Auto-merge to infra on success
  merge-to-infra:
    runs-on: ubuntu-latest
    needs: test
    if: success()
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Merge main to infra
        run: |
          set -x  # Enable verbose output for debugging
          echo "Fetching branches..."
          git fetch origin main:remotes/origin/main infra:remotes/origin/infra || {
            echo "::error::Failed to fetch branches"
            exit 1
          }

          echo "Checking out infra branch..."
          git checkout infra || {
            echo "::error::Failed to checkout infra branch"
            git branch -a
            exit 1
          }

          echo "Merging main into infra..."
          git merge origin/main --no-edit -m "Merge main to infra [skip ci]" || {
            echo "::error::Failed to merge main into infra"
            git status
            exit 1
          }

          echo "Pushing to infra..."
          git push origin infra || {
            echo "::error::Failed to push to infra"
            exit 1
          }

          echo "✅ Successfully merged and pushed to infra"
