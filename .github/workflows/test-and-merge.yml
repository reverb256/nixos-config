name: "Merge main to infra - Light Testing"

on:
  push:
    branches: ["main"]
  workflow_dispatch:  # Manual trigger

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

  jobs:
  # Light testing only (fast feedback)
  test:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Run deadnix (unused code detection)
        run: |
          echo "Checking for dead code..."
          nix run nixpkgs#deadnix -- -e . || echo "::warning::deadnix issues found"

      - name: Run statix (Nix linting)
        run: |
          echo "Linting Nix code..."
          nix run nixpkgs#statix -- check . 2>&1 | head -20 || echo "::warning::statix issues found (may be style warnings)"

      - name: Check alejandra formatting
        run: |
          echo "Checking formatting..."
          nix run nixpkgs#alejandra -- --check .

      - name: Check flake syntax
        run: nix flake check --no-build

      - name: Evaluate all configurations
        run: |
          nix eval .#nixosConfigurations.zephyr.config.system.build.toplevel --raw > /dev/null
          nix eval .#nixosConfigurations.nexus.config.system.build.toplevel --raw > /dev/null
          nix eval .#nixosConfigurations.forge.config.system.build.toplevel --raw > /dev/null
          nix eval .#nixosConfigurations.sentry.config.system.build.toplevel --raw > /dev/null

  # Auto-merge to infra on success
  merge-to-infra:
    runs-on: self-hosted
    needs: test
    if: success()
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure git
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"

    - name: Merge main to infra
      run: |
        git fetch origin
        git checkout infra
        git pull origin infra
        git merge origin/main --no-edit
        git push origin infra
