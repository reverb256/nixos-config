name: Update SRBMiner

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Check and bump SRBMiner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Query latest release tag
        id: latest
        run: |
          JSON=$(curl -sL https://api.github.com/repos/doktor83/SRBMiner-Multi/releases/latest)
          TAG=$(echo "$JSON" | jq -r '.tag_name' | sed 's/^v//')
          echo "tag=$TAG" | tee -a $GITHUB_OUTPUT

      - name: Read current version from module
        id: current
        run: |
          CUR=$(grep -A1 'version = lib.mkOption' modules/services/srbminer.nix | \
                grep default | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$CUR" | tee -a $GITHUB_OUTPUT

      - name: Skip if already at latest
        id: check
        run: |
          if [ "${{ steps.latest.outputs.tag }}" = "${{ steps.current.outputs.version }}" ]; then
            echo "skip=true" | tee -a $GITHUB_OUTPUT
          else
            echo "skip=false" | tee -a $GITHUB_OUTPUT
            echo "Bumping: ${{ steps.current.outputs.version }} → ${{ steps.latest.outputs.tag }}"
          fi

      - name: Prefetch tarball and compute hash
        if: steps.check.outputs.skip == 'false'
        id: fetch
        run: |
          TAG="${{ steps.latest.outputs.tag }}"
          URL="https://github.com/doktor83/SRBMiner-Multi/releases/download/${TAG}/srbminer_custom-${TAG}.tar.gz"
          RESULT=$(nix store prefetch-file "$URL" --name "SRBMiner-Multi-${TAG}")
          echo "hash=$(echo "$RESULT" | jq -r '.hash')" | tee -a $GITHUB_OUTPUT

      - name: Patch version and hash in module
        if: steps.check.outputs.skip == 'false'
        env:
          TAG: ${{ steps.latest.outputs.tag }}
          HASH: ${{ steps.fetch.outputs.hash }}
        run: |
          python3 << 'PYEOF'
import os, re

tag = os.environ['TAG']
hash_val = os.environ['HASH']

with open('modules/services/srbminer.nix') as f:
    content = f.read()

# Replace version default
content = re.sub(
    r'(version = lib\.mkOption \{[^}]*?default\s*=\s*)"[^"]*"',
    r'\1"' + tag + '"',
    content
)

# Replace sha256 default
content = re.sub(
    r'(sha256 = lib\.mkOption \{[^}]*?default\s*=\s*)"[^"]*"',
    r'\1"' + hash_val + '"',
    content
)

with open('modules/services/srbminer.nix', 'w') as f:
    f.write(content)

print(f"Patched: version → {tag}, hash → {hash_val}")
PYEOF

      - name: Verify fetch derivation builds
        if: steps.check.outputs.skip == 'false'
        run: |
          nix build '.#nixosConfigurations.forge.config.system.build.toplevel' \
            --no-link --max-jobs 2 2>&1 | tail -5

      - name: Commit and push
        if: steps.check.outputs.skip == 'false'
        run: |
          TAG="${{ steps.latest.outputs.tag }}"
          git config user.name "Reverb Bot"
          git config user.email "bot@reverb-ops"
          git add modules/services/srbminer.nix
          git commit -m "chore(mining): bump SRBMiner to ${TAG}"
          git push
