name: secretspec-build

on:
  pull_request:
    paths:
      - 'pkgs/secretspec/**'
      - 'secretspec.toml'
      - 'scripts/validate-secretspec-stack.sh'
      - 'modules/system/secretspec-validator.nix'
      - '.github/workflows/secretspec-build.yml'
  push:
    branches: [main]
    paths:
      - 'pkgs/secretspec/**'
      - 'secretspec.toml'
      - 'scripts/validate-secretspec-stack.sh'
      - 'modules/system/secretspec-validator.nix'
      - '.github/workflows/secretspec-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secretspec-structure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-structure:
    name: Structure / parse / schema
    runs-on: [self-hosted, nixos]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Nix parse pkgs/secretspec
        run: |
          for f in pkgs/secretspec/default.nix; do
            echo "==> nix-instantiate --parse $f"
            nix-instantiate --parse "$f" >/dev/null
          done

      - name: TOML parse secretspec.toml
        run: |
          python3 - <<'PYEOF'
          import tomllib
          d = tomllib.load(open('secretspec.toml', 'rb'))
          entry_count = sum(len(v) for v in d.get('profiles', {}).values() if isinstance(v, dict))
          print(f"OK secretspec.toml: {entry_count} profile entries across {len(d.get('profiles', {}))} profiles")
          PYEOF

      - name: secretspec schema invariant
        env:
          SCHEMA_MIN_ENTRIES: "55"
        run: |
          python3 - <<'PYEOF'
          import os, tomllib
          d = tomllib.load(open('secretspec.toml', 'rb'))
          entry_count = sum(len(v) for v in d.get('profiles', {}).values() if isinstance(v, dict))
          default_profile = d.get('profiles', {}).get('default', {})
          route_count = sum(
              1 for value in default_profile.values()
              if isinstance(value, dict)
              and isinstance(value.get('ref'), dict)
              and 'item' in value['ref']
          )
          ps = d.get('phase2_status', {})
          declared_route_count = ps.get('route_count')
          assert entry_count >= int(os.environ['SCHEMA_MIN_ENTRIES']), \
              f"schema shrank: {entry_count} < SCHEMA_MIN_ENTRIES={os.environ['SCHEMA_MIN_ENTRIES']}"
          assert declared_route_count == route_count or declared_route_count is None, \
              f"phase2_status.route_count ({declared_route_count}) drift from explicit ref.item route count ({route_count})"
          print(f"OK schema invariant: {entry_count} entries; {route_count} explicit ref.item routes")
          PYEOF
