name: secretspec-build
on:
  pull_request:
    paths:
      - 'pkgs/secretspec/**'
      - 'secretspec.toml'
      - 'scripts/validate-secretspec-stack.sh'
      - 'modules/system/secretspec-validator.nix'
      - '.github/workflows/secretspec-build.yml'
  push:
    branches: [main]
    paths:
      - 'pkgs/secretspec/**'
      - 'secretspec.toml'
      - 'secretspec-validator.nix'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Stage 1: Structural validation (no Nix build required) ─────────────
  validate-structure:
    name: Structure / parse / schema
    runs-on: self-hosted
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Nix parse pkgs/secretspec
        run: |
          for f in pkgs/secretspec/default.nix; do
            echo "==> nix-instantiate --parse $f"
            nix-instantiate --parse "$f" >/dev/null
          done

      - name: TOML parse secretspec.toml
        run: |
          python3 - <<'PYEOF'
          import tomllib
          d = tomllib.load(open('secretspec.toml', 'rb'))
          n = sum(len(v) for v in d.get('profiles', {}).values() if isinstance(v, dict))
          print(f"OK secretspec.toml: {n} profile entries across {len(d.get('profiles', {}))} profiles")
          PYEOF

      - name: secretspec schema invariant
        env:
          SCHEMA_MIN_ENTRIES: "55"
        run: |
          python3 - <<'PYEOF'
          import tomllib, sys
          d = tomllib.load(open('secretspec.toml', 'rb'))
          n = sum(len(v) for v in d.get('profiles', {}).values() if isinstance(v, dict))
          ps = d.get('phase2_status', {})
          rc = ps.get('route_count')
          assert n >= int(__import__('os').environ['SCHEMA_MIN_ENTRIES']), \
              f"schema shrank: {n} < SCHEMA_MIN_ENTRIES={__import__('os').environ['SCHEMA_MIN_ENTRIES']}"
          assert rc == n or rc is None, \
              f"phase2_status.route_count ({rc}) drift from actual schema count ({n})"
          print(f"OK schema invariant: {n} entries match expected")
          PYEOF

  # ── Stage 2: End-to-end (ephemeral age keypair — no real secrets) ──────
  validate-e2e:
    name: End-to-end secretspec check (ephemeral age)
    runs-on: self-hosted
    timeout-minutes: 15
    needs: validate-structure
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate stack (env + schema)
        run: ./scripts/validate-secretspec-stack.sh --env --schema

      - name: Run just secretspec-validate-local
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: just secretspec-validate-local

  # ── Stage 3: Nix build (best-effort, off self-hosted) ──────────────────
  build-nix:
    name: Nix build pkgs.secretspec (upstream 0.18.0)
    runs-on: self-hosted
    timeout-minutes: 60
    needs: validate-e2e
    continue-on-error: true  # Build may fail if crate not present on CI runner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build secretspec
        run: |
          nix build --no-link --print-out-paths \
            .#secretspec

      - name: Push to cachix (best-effort)
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          CACHIX_CACHE: nixos-cluster-mcp
        run: |
          OUT_PATHS=$(nix build --no-link --print-out-paths .#secretspec 2>/dev/null || true)
          if [ -n "$OUT_PATHS" ]; then
            cachix push "$CACHIX_CACHE" $OUT_PATHS || echo "cachix push failed (cache best-effort)"
          else
            echo "no out-paths produced; skipping cachix push"
          fi
