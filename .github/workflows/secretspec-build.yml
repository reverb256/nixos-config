name: secretspec-build
on:
  pull_request:
    paths:
      - 'pkgs/secretspec/**'
      - 'pkgs/secretspec-provider-sops/**'
      - 'secretspec.toml'
      - 'secretspec-bridge.toml'
      - 'scripts/validate-secretspec-stack.sh'
      - 'scripts/secretspec-fork-bootstrap.sh'
      - 'modules/system/secretspec-validator.nix'
      - '.github/workflows/secretspec-build.yml'
  push:
    branches: [main]
    paths:
      - 'pkgs/secretspec/**'
      - 'pkgs/secretspec-provider-sops/**'
      - 'secretspec.toml'
      - 'secretspec-validator.nix'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Stage 1: Structural validation (no Nix build required) ─────────────
  validate-structure:
    name: Structure / parse / schema
    runs-on: self-hosted
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Nix parse pkgs/secretspec + pkgs/secretspec-provider-sops
        run: |
          for f in pkgs/secretspec/default.nix pkgs/secretspec-provider-sops/default.nix; do
            echo "==> nix-instantiate --parse $f"
            nix-instantiate --parse "$f" >/dev/null
          done

      - name: TOML parse secretspec.toml + secretspec-bridge.toml
        run: |
          python3 - <<'PYEOF'
          import tomllib
          for f in ('secretspec.toml', 'secretspec-bridge.toml'):
              d = tomllib.load(open(f, 'rb'))
              n = sum(len(v) for v in d.get('profiles', {}).values() if isinstance(v, dict))
              print(f"OK {f}: {n} profile entries across {len(d.get('profiles', {}))} profiles")
          PYEOF

      - name: secretspec schema invariant — route_count must match entry count
        env:
          SCHEMA_MIN_ENTRIES: "55"
        run: |
          python3 - <<'PYEOF'
          import tomllib, sys, re
          d = tomllib.load(open('secretspec.toml', 'rb'))
          # route_count tracks entries with an explicit sops `ref` (per the
          # comment in secretspec.toml: grep -c 'ref = { item').
          raw = open('secretspec.toml').read()
          n = len(re.findall(r'ref\s*=\s*\{\s*item', raw))
          ps = d.get('phase2_status', {})
          rc = ps.get('route_count')
          assert rc == n, \
              f"phase2_status.route_count ({rc}) drift from sops-routed ref count ({n})"
          print(f"OK schema invariant: {n} sops-routed entries match route_count")
          PYEOF

  # ── Stage 2: End-to-end (ephemeral age keypair — no real secrets) ──────
  validate-e2e:
    name: End-to-end secretspec check (ephemeral age)
    runs-on: self-hosted
    timeout-minutes: 15
    needs: validate-structure
    steps:
      - uses: actions/checkout@v4

      - name: Validate stack (env + binary + schema)
        run: ./scripts/validate-secretspec-stack.sh --env --binary --schema

      - name: Run just secretspec-validate-local
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: just secretspec-validate-local

  # ── Stage 3: Nix build (best-effort, off self-hosted) ──────────────────
  build-nix:
    name: Nix build pkgs.secretspec + pkgs.secretspec-provider-sops
    runs-on: self-hosted
    timeout-minutes: 60
    needs: validate-e2e
    continue-on-error: true  # Build may fail if local forks not present on CI runner
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build secretspec + secretspec-provider-sops
        run: |
          nix build --no-link --print-out-paths \
            .#secretspec .#secretspec-provider-sops

      - name: Push to cachix (best-effort)
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          CACHIX_CACHE: nixos-cluster-mcp
        run: |
          OUT_PATHS=$(nix build --no-link --print-out-paths .#secretspec .#secretspec-provider-sops 2>/dev/null || true)
          if [ -n "$OUT_PATHS" ]; then
            cachix push "$CACHIX_CACHE" $OUT_PATHS || echo "cachix push failed (cache best-effort)"
          else
            echo "no out-paths produced; skipping cachix push"
          fi
