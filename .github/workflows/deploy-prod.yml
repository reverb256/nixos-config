name: "Deploy Cluster - Production"

on:
  push:
    branches: ["infra"]
  workflow_dispatch:  # Manual deployment trigger
    inputs:
      target_branch:
        description: 'Branch to deploy (default: infra)'
        required: false
        default: 'infra'
        type: string

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Validate colmena configuration before deployment
  validate-colmena:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v4

      - name: Validate colmena configuration
        run: |
          echo "Validating colmena configuration..."
          nix eval .#colmena --raw || echo "::error::Colmena configuration invalid"

      - name: Dry-run colmena deployment
        run: |
          echo "Dry-running colmena deployment (no actual changes)..."
          nix run github:zhaofengli/colmena -- --dry-run || echo "::error::Colmena dry-run failed"

  # Build all configurations
  build:
    runs-on: self-hosted
    needs: validate-colmena
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.target_branch || 'infra' }}

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main

    - name: Magic Nix Cache
      uses: DeterminateSystems/magic-nix-cache-action@main

    - name: Build all configurations
      run: |
        nix build .#nixosConfigurations.zephyr.config.system.build.toplevel
        nix build .#nixosConfigurations.nexus.config.system.build.toplevel
        nix build .#nixosConfigurations.forge.config.system.build.toplevel
        nix build .#nixosConfigurations.sentry.config.system.build.toplevel

  # Deploy to all nodes via colmena
  deploy:
    runs-on: self-hosted
    needs: build
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.target_branch || 'infra' }}

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main

    - name: Magic Nix Cache
      uses: DeterminateSystems/magic-nix-cache-action@main

    - name: Deploy using Colmena
      run: |
        nix run github:zhaofengli/colmena -- deploy --activate --build-on-target ---j$(nproc)

     - name: Verify deployment
       run: |
         # Check that all nodes are running expected configuration
         for host in zephyr nexus forge sentry; do
           echo "Checking $host..."
           ssh $host "nixos-version"

          # Verify Tailscale connectivity before proceeding
          echo "Verifying Tailscale VPN connectivity..."
          TAILSCALE_STATUS=$(ssh zephyr "tailscale status --json" || echo "Failed to get Tailscale status")
          echo "$TAILSCALE_STATUS" | grep -q '"healthy":true' || echo "Tailscale connectivity issue detected"

          # Check that all Tailscale IPs are reachable
          echo "Pinging cluster nodes via Tailscale VPN..."
          for node in "100.81.182.5:zephyr" "100.86.158.18:nexus" "100.95.222.45:forge" "100.82.210.39:sentry"; do
            IFS=':' read -ra ADDR _ <<< "$node"
            timeout 10 ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no $ADDR "hostname" || echo "Failed to reach $ADDR at $IP"
          done

          echo "✅ All nodes are reachable via Tailscale"

          # Verify Tailscale connectivity before proceeding
          echo "Verifying Tailscale VPN connectivity..."
          TAILSCALE_STATUS=$(ssh zephyr "tailscale status --json" || echo "Failed to get Tailscale status")
          echo "$TAILSCALE_STATUS" | grep -q '"healthy":true' || echo "Tailscale connectivity issue detected"

          # Check that all Tailscale IPs are reachable
          # Ping cluster nodes via Tailscale VPN (health check)
          echo "Pinging cluster nodes via Tailscale VPN..."
          for node in "100.81.182.5:zephyr" "100.86.158.18:nexus" "100.95.222.45:forge" "100.82.210.39:sentry"; do
            IFS=':' read -ra ADDR _ <<< "$node"
            timeout10 ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no $ADDR "hostname" || echo "Failed to connect to $ADDR at $IP"
          done

          echo "✅ All nodes are reachable via Tailscale"
