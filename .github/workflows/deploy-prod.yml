name: "Deploy Cluster - Production"

on:
  push:
    branches: ["infra"]
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to deploy (default: infra)'
        required: false
        default: 'infra'
        type: string

  concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-colmena:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v4

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Validate colmena configuration
        run: |
          echo "Validating colmena configuration..."
          nix eval .#colmena --raw || echo "::error::Colmena configuration invalid"

      - name: Dry-run colmena deployment
        run: |
          echo "Dry-running colmena deployment (no actual changes)..."
          nix run github:zhaofengli/colmena -- --dry-run || echo "::error::Colmena dry-run failed"

  validate-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate required secrets are set
        run: |
          if [ -z "${{ secrets.CLUSTER_DEPLOY_KEY }}" ]; then
            echo "::error::CLUSTER_DEPLOY_KEY secret not set"
            exit 1
          fi
          if [ -z "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" ]; then
            echo "::error::DEPLOY_SSH_PRIVATE_KEY not set"
            exit 1
          fi
          echo "✅ All required secrets are set"

  system-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check mining services on all nodes
        run: |
          echo "Checking mining services health..."
          for host in zephyr nexus; do
            ssh $host "systemctl is-active lolminer.service" || \
                echo "::warning::Mining service not running on $host"
            ssh $host "systemctl is-active xmrig.service" || \
                echo "::warning::Mining service not running on $host"
            ssh $host "systemctl is-active prometheus-blackbox-exporter.service" || \
                echo "::warning::Prometheus Blackbox not running on nexus"
            ssh nexus "systemctl is-active grafana.service" || \
                echo "::warning::Grafana not running on nexus"
            echo "✅ System health checks complete"

      - name: Check monitoring on nexus
        run: |
          echo "Checking monitoring services..."
          ssh nexus "systemctl is-active prometheus-blackbox-exporter.service" || \
                echo "::warning::Prometheus Blackbox Exporter not running on nexus"
          ssh nexus "systemctl is-active grafana.service" || \
                echo "::warning::Grafana not running on nexus"
          echo "✅ Monitoring checks complete"

  build:
    runs-on: self-hosted
    needs: [validate-colmena, validate-secrets]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build all configurations
        run: |
          nix build .#nixosConfigurations.zephyr.config.system.build.toplevel
          nix build .#nixosConfigurations.nexus.config.system.build.toplevel
          nix build .#nixosConfigurations.forge.config.system.build.toplevel
          nix build .#nixosConfigurations.sentry.config.system.build.toplevel

  deploy:
    runs-on: self-hosted
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch || 'infra' }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Canary deployment to zephyr
        run: |
          echo "🚨 Starting canary deployment to zephyr..."
          nix run github:zhaofengli/colmena -- deploy zephyr --activate --on-change build --reboot
          echo "✅ Canary deployment to zephyr completed"

      - name: Verify zephyr canary health
        run: |
          echo "🔍 Verifying zephyr canary health..."
          ssh zephyr "nixos-version"
          ssh zephyr "systemctl is-active lolminer.service" || \
              echo "::warning::Mining not active on zephyr after canary"
          ssh zephyr "systemctl is-active xmrig.service" || \
              echo "::warning::Mining not active on zephyr after canary"
          ssh zephyr "tailscale status --json" || echo "Failed to get Tailscale status"
          echo "✅ Zephyr canary verified"

      - name: Deploy to remaining nodes if canary passes
        if: success()
          run: |
            echo "🚀 Deploying to remaining nodes (nexus, forge, sentry)..."
            nix run github:zhaofengli/colmena -- deploy nexus forge sentry --activate --on-change build --reboot
            echo "✅ Full cluster deployment completed"

      - name: Rollback zephyr if canary fails
        if: failure()
          run: |
            echo "❌ Canary deployment failed, rolling back zephyr..."
            nix run github:zhaofengli/colmena -- deploy zephyr --revert

      - name: Verify Tailscale connectivity
        run: |
          echo "Verifying Tailscale VPN connectivity..."
          TAILSCALE_STATUS=$(ssh zephyr "tailscale status --json" || echo "Failed to get Tailscale status")
          echo "$TAILSCALE_STATUS" | grep -q '"healthy":true' || echo "Tailscale connectivity issue detected"

      - name: Verify cluster connectivity
        run: |
          echo "Checking cluster connectivity..."
          SUCCESS=0
          for node in zephyr nexus; do
            ssh -o ConnectTimeout=5 $node "echo OK" || SUCCESS=1
            done
          if [ "$SUCCESS" -eq 0 ]; then
            echo "::warning::Cluster connectivity issue detected"
          fi
          echo "✅ Cluster connectivity verified"

  metrics:
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()
      steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile deployment metrics
        run: |
          echo "# Deployment Metrics"
          echo "Deployment ID: ${{ github.run_id }}"
          echo "Branch: ${{ github.ref }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Triggered by: ${{ github.event_name }}"
          echo "Actor: ${{ github.actor }}"
          echo "Status: ${{ job.status }}"
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Report metrics to GitHub
        run: |
          echo "deployment_time=$SECONDS seconds" >> $GITHUB_STEP_SUMMARY
          echo "deployment_success=${{ job.status }}" >> $GITHUB_STEP_SUMMARY
