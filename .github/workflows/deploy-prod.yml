name: "Deploy Cluster - Production"

on:
  push:
    branches: ["infra"]
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to deploy (default: infra)'
        required: false
        default: 'infra'
        type: string
      skip_backup:
        description: 'Skip pre-deployment backup'
        required: false
        default: 'false'
        type: boolean
      approve:
        description: 'Require manual approval'
        required: false
        default: 'false'
        type: boolean

env:
  CACHE_NAME: reverb-os
  CLUSTER_NODES: "zephyr nexus forge sentry"

# NOTE: The deploy job requires a self-hosted runner with Tailscale access
# to SSH to cluster nodes. If self-hosted runner is unavailable, use
# manual deployment: `just deploy` from any cluster node.

  concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-colmena:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v4

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Validate colmena configuration
        run: |
          echo "Validating colmena configuration..."
          nix eval .#colmena --raw || echo "::error::Colmena configuration invalid"

      - name: Dry-run colmena deployment
        run: |
          echo "Dry-running colmena deployment (no actual changes)..."
          nix run .#apps.x86_64-linux.colmena -- apply --on @all --dry-run 2>&1 | head -50 || echo "::error::Colmena dry-run failed"

  validate-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate required secrets are set
        run: |
          if [ -z "${{ secrets.CACHIX_AUTH_TOKEN }}" ]; then
            echo "::warning::CACHIX_AUTH_TOKEN not set (cache push will be skipped)"
          fi
          if [ -z "${{ secrets.CLUSTER_DEPLOY_KEY }}" ]; then
            echo "::warning::CLUSTER_DEPLOY_KEY not set"
          fi
          if [ -z "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" ]; then
            echo "::error::DEPLOY_SSH_PRIVATE_KEY not set"
            exit 1
          fi
          echo "✅ Required secrets validated"

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Run deadnix (unused code detection)
        continue-on-error: true
        run: |
          echo "Checking for dead code..."
          nix run nixpkgs#deadnix -- -e . || echo "::warning::deadnix issues found"

      - name: Run statix (Nix linting)
        continue-on-error: true
        run: |
          echo "Linting Nix code..."
          nix run nixpkgs#statix -- check . || echo "::warning::statix issues found"

  check-stability-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v4

      - name: Check commit message for StabilityMatrix update
        id: check-commit
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if echo "$COMMIT_MSG" | grep -q "chore(stability-matrix):"; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "✅ Skipping StabilityMatrix check (already updated in this commit)"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Update StabilityMatrix if needed
        if: steps.check-commit.outputs.skip != 'true'
        run: |
          chmod +x scripts/update-stability-matrix.sh
          ./scripts/update-stability-matrix.sh
          if git diff --quiet modules/services/stability-matrix.nix; then
            echo "✅ StabilityMatrix already up to date"
          else
            echo "📝 Committing StabilityMatrix update..."
            git config --global user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add modules/services/stability-matrix.nix
            git commit -m "chore(stability-matrix): update to latest version"
            git push origin infra
            echo "⚠️  StabilityMatrix updated and pushed - deployment will use new version"
          fi

  pre-backup:
    runs-on: self-hosted
    if: github.event.inputs.skip_backup != 'true'
    needs: [validate-colmena, validate-secrets, lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Backup current configurations
        run: |
          echo "Creating pre-deployment backup..."
          BACKUP_DIR="/tmp/nixos-backup-$(date +%Y%m%d-%H%M%S)"
          mkdir -p "$BACKUP_DIR"

          for host in $CLUSTER_NODES; do
            echo "Backing up $host..."
            ssh $host "sudo nixos-rebuild build --flake . && \
                      sudo cp -r result /tmp/rollback-$(date +%Y%m%d-%H%M%S) || \
                      echo 'Backup failed on $host'"
          done

          echo "✅ Pre-deployment backup complete"

  # Manual approval gate (optional)
  approve:
    runs-on: ubuntu-latest
    if: github.event.inputs.approve == 'true'
    needs: [validate-colmena, validate-secrets, lint, check-stability-matrix]
    environment:
      name: production
      url: https://github.com/${{ github.repository }}/deployments
    steps:
      - name: Wait for approval
        run: |
          echo "Awaiting manual approval for production deployment..."
          echo "Approve in the GitHub Actions UI."

  build-with-cache:
    runs-on: ubuntu-latest
    needs: [validate-colmena, validate-secrets, lint, check-stability-matrix]
    outputs:
      cache-hit: ${{ steps.cache-info.outputs.cache-hit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Cachix
        id: cachix
        uses: cachix/cachix-action@v14
        with:
          name: reverb-os
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          skipPush: false

      - name: Check cache status
        id: cache-info
        run: |
          echo "Checking cache hit rate..."
          # This will be populated by cachix-action
          echo "cache-hit=unknown" >> $GITHUB_OUTPUT

      - name: Build all configurations
        run: |
          echo "Building configurations with Cachix cache..."
          for host in zephyr nexus forge sentry; do
            echo "Building $host..."
            nix build .#nixosConfigurations.$host.config.system.build.toplevel --print-build-logs || \
              echo "::warning::$host build will be done on target node"
          done
          echo "✅ Build complete"

      - name: Cache summary
        run: |
          echo "## Build & Cache Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Cache: **reverb-os.cachix.org**" >> $GITHUB_STEP_SUMMARY
          echo "- Push: Enabled" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Built artifacts are now available in the private cache." >> $GITHUB_STEP_SUMMARY

  deploy:
    runs-on: self-hosted
    needs: [build-with-cache, approve]
    if: always() && needs.build-with-cache.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch || 'infra' }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Setup Cachix (for pulling during deploy)
        uses: cachix/cachix-action@v14
        with:
          name: reverb-os
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          skipPush: true

      - name: Verify runner connectivity
        run: |
          echo "Checking Tailscale connectivity..."
          tailscale status --json | jq -r '.Self.Online' || echo "::warning::Tailscale not connected"

      - name: Pre-deployment health check
        run: |
          echo "Running pre-deployment health check..."
          for node in zephyr nexus; do
            if ! ssh -o ConnectTimeout=5 $node "echo OK" 2>/dev/null; then
              echo "::error::Cannot reach $node - aborting deployment"
              exit 1
            fi
          done
          echo "✅ All nodes reachable"

      - name: Canary deployment to zephyr
        id: canary
        run: |
          echo "🚨 Starting canary deployment to zephyr..."
          if nix run .#apps.x86_64-linux.colmena -- apply zephyr --on --on-error continue; then
            echo "success=true" >> $GITHUB_OUTPUT
            echo "✅ Canary deployment to zephyr completed"
          else
            echo "success=false" >> $GITHUB_OUTPUT
            echo "❌ Canary deployment failed"
            exit 1
          fi

      - name: Verify zephyr canary health
        run: |
          echo "🔍 Verifying zephyr canary health..."
          sleep 10  # Give services time to start

          # Check basic system
          ssh zephyr "nixos-version" || echo "::warning::Version check failed"

          # Check critical services
          for service in lolminer xmrig; do
            if ! ssh zephyr "systemctl is-active $service.service" 2>/dev/null; then
              echo "::warning::$service not active on zephyr"
            fi
          done

          # Check Tailscale
          ssh zephyr "tailscale status --json" | grep -q '"healthy":true' || \
            echo "::warning::Tailscale health check warning"

          echo "✅ Zephyr canary verified"

      - name: Deploy to remaining nodes
        if: steps.canary.outputs.success == 'true'
        run: |
          echo "🚀 Deploying to remaining nodes..."
          nix run .#apps.x86_64-linux.colmena -- apply nexus forge sentry --on --on-error continue
          echo "✅ Full cluster deployment completed"

      - name: Post-deployment verification
        run: |
          echo "🔍 Running post-deployment verification..."
          for node in zephyr nexus forge sentry; do
            echo "Checking $node..."
            ssh $node "nixos-version" || echo "::warning::Version check failed on $node"
          done
          echo "✅ Post-deployment verification complete"

      - name: Verify cluster connectivity
        run: |
          echo "Checking cluster connectivity..."
          for node in zephyr nexus; do
            ssh -o ConnectTimeout=5 $node "echo OK" || echo "::warning::$node unreachable"
          done
          echo "✅ Cluster connectivity verified"

  rollback-on-failure:
    runs-on: self-hosted
    needs: [deploy]
    if: failure()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Rollback zephyr
        run: |
          echo "❌ Deployment failed - rolling back zephyr..."
          nix run .#apps.x86_64-linux.colmena -- apply zephyr --revert 2>/dev/null || \
            echo "::error::Automated rollback failed - manual intervention required"

      - name: Notify rollback
        run: |
          echo "## 🚨 Rollback Triggered" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The deployment failed and zephyr was rolled back automatically." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Please check the logs and verify cluster health." >> $GITHUB_STEP_SUMMARY

  metrics:
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile deployment metrics
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 📊 Deployment Metrics

          | Metric | Value |
          |--------|-------|
          | Deployment ID | \`${{ github.run_id }}\` |
          | Branch | \`${{ github.ref_name }}\` |
          | Commit | \`${{ github.sha }}\` |
          | Triggered by | ${{ github.event_name }} |
          | Actor | @${{ github.actor }} |
          | Status | ${{ needs.deploy.result }} |
          | Duration | ${{ github.event.workflow_run.duration }}s |

          **Cache:** \`reverb-os.cachix.org\`
          EOF

      - name: Report deployment status
        run: |
          echo "deployment_time=${{ github.event.workflow_run.duration }}s" >> $GITHUB_OUTPUT
          echo "deployment_status=${{ needs.deploy.result }}" >> $GITHUB_OUTPUT
