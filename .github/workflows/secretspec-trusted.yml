name: secretspec-trusted

on:
  push:
    branches: [main]
    paths:
      - 'pkgs/secretspec/**'
      - 'secretspec.toml'
      - 'scripts/validate-secretspec-stack.sh'
      - 'modules/system/secretspec-validator.nix'
      - '.github/workflows/secretspec-trusted.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secretspec-trusted-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-e2e:
    name: End-to-end secretspec check
    runs-on: ${{ fromJSON('["self-hosted", "nixos", "nexus", "builder"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate stack (env + schema)
        run: ./scripts/validate-secretspec-stack.sh --env --schema

      - name: Run just secretspec-validate-local
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: just secretspec-validate-local

  build-nix:
    name: Nix build pkgs.secretspec
    runs-on: ${{ fromJSON('["self-hosted", "nixos", "nexus", "builder"]') }}
    timeout-minutes: 60
    needs: validate-e2e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build secretspec
        run: nix build --no-link --print-out-paths .#secretspec

      - name: Push to cachix (best-effort)
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          CACHIX_CACHE: reverb-os
        run: |
          OUT_PATHS=$(nix build --no-link --print-out-paths .#secretspec 2>/dev/null || true)
          if [ -n "$OUT_PATHS" ]; then
            cachix push "$CACHIX_CACHE" $OUT_PATHS || echo "cachix push failed (cache best-effort)"
          else
            echo "no out-paths produced; skipping cachix push"
          fi
