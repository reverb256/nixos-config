---
name: Update PeakMiner

on:
  schedule:
    # Check for new peakminer releases daily at 6am UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Specific version to pin (e.g. 1.0.12). Leave empty for latest.'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-update:
    name: Check for new PeakMiner release
    runs-on: [self-hosted, nixos]
    steps:
      - name: Checkout
        # pin:actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install Nix
        # pin:cachix/install-nix-action@v31
        uses: cachix/install-nix-action@b97f05dcb019ddea06450a50ef6203d2fdc19fee
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Cachix
        # pin:cachix/cachix-action@v17
        uses: cachix/cachix-action@02b16339eddcf6ea27a830e7f1992855cae13
        with:
          name: reverb-os
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Detect current and latest versions
        id: versions
        run: |
          # Extract current pinned version from the Nix package
          CURRENT=$(grep 'version ?=' packages/peakminer.nix | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Current version: $CURRENT"

          if [ -n "${{ github.event.inputs.version }}" ]; then
            LATEST="${{ github.event.inputs.version }}"
          else
            # Query GitHub API for latest release tag
            LATEST_TAG=$(curl -sf https://api.github.com/repos/peakminer/peakminer/releases/latest | jq -r '.tag_name')
            LATEST="${LATEST_TAG#v}"
          fi

          echo "Latest version: $LATEST"

          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "latest=$LATEST" >> $GITHUB_OUTPUT

          if [ "$CURRENT" = "$LATEST" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Already on latest ($CURRENT)"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "New version available: $CURRENT → $LATEST"
          fi

      - name: Update version pin
        if: steps.versions.outputs.changed == 'true'
        run: |
          sed -i 's/version ?= ".*"/version ?= "${{ steps.versions.outputs.latest }}"/' packages/peakminer.nix

      - name: Update hash
        if: steps.versions.outputs.changed == 'true'
        run: |
          # Use nix to fetch and compute the correct hash
          nix build .#peakminer --no-link 2>&1 | grep 'got:' || true
          # The build will fail with the correct hash — extract and apply it
          NEW_HASH=$(nix build .#peakminer --no-link 2>&1 | grep 'got:' | sed 's/.*got: *//' | head -1)

          if [ -z "$NEW_HASH" ]; then
            echo "ERROR: Could not compute new hash"
            exit 1
          fi

          echo "New hash: $NEW_HASH"
          sed -i "s|hash = \".*\";|hash = \"$NEW_HASH\";|" packages/peakminer.nix

      - name: Verify build
        if: steps.versions.outputs.changed == 'true'
        run: nix build .#peakminer --no-link

      - name: Verify binary runs
        if: steps.versions.outputs.changed == 'true'
        run: |
          PEAKMINER=$(nix build .#peakminer --no-link --print-out-paths)
          $PEAKMINER/bin/peakminer --version

      - name: Create PR
        if: steps.versions.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@c5a7806640adbe173f04e3e038b0ccdcd758773c
        with:
          title: "feat(peakminer): update to v${{ steps.versions.outputs.latest }}"
          body: |
            Automated PeakMiner version bump.

            Updated: `${{ steps.versions.outputs.current }}` → `${{ steps.versions.outputs.latest }}`

            ## Verification checklist
            - [ ] Binary builds successfully
            - [ ] `--version` reports correct version
            - [ ] Test on one GPU before deploying to all
            - [ ] Verify shares flow on Kryptex PRL pool
            - [ ] Check `--legacy-auth` is still NOT in use (share-killer)

            ## Known issues
            - `--legacy-auth` blocks share submission on Kryptex (all versions)
            - Kryptex dashboard groups all workers under "worker" (pool-side bug)
            - See `devops/peakminer-configuration` skill for full details
          branch: update/peakminer-${{ steps.versions.outputs.latest }}
          commit-message: "feat(peakminer): update to v${{ steps.versions.outputs.latest }}"
          delete-branch: true
          labels: dependencies,mining
