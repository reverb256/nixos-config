# Stale issue and PR management
name: "Stale management"
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  issues: write
  pull-requests: write
jobs:
  stale:
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: >
            This issue has been inactive for 60 days. It will be closed in 7 days
            unless there is new activity.
          close-issue-message: >
            Closed due to inactivity. Reopen if still relevant.
          days-before-issue-stale: 60
          days-before-issue-close: 7
          stale-issue-label: "stale"
          exempt-issue-labels: "p1,security,bug,blocked,never-stale"
          stale-pr-message: >
            This PR has been inactive for 30 days. It will be closed in 7 days
            unless there is new activity.
          close-pr-message: >
            Closed due to inactivity. Please reopen with updated changes.
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-pr-label: "stale"
          exempt-pr-labels: "p1,security,blocked,never-stale,dependencies"
