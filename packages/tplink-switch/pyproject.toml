[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "tplink-switch"
version = "0.1.0"
description = "Python library for managing TP-Link Easy Smart Switches via HTTP"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "requests>=2.31.0",
  "urllib3>=2.0.0",
]

[tool.setuptools]
packages = ["tplink_switch"]
