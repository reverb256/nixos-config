# ── OPENCODE GO (Daily Reset 7PM UTC) ─────────────────────────────────
[models.opencode-deepseek-v4-flash]
name = "deepseek-ai/deepseek-v4-flash"
description = "DeepSeek V4 Flash — OpenCode Go (Daily reset)"
context_length = 1048576
capabilities = ["chat", "completion", "coding", "long_context"]
backends = ["opencode-go"]

# ── EXTERNAL BACKUPS (Only if all above fail/exhausted) ───────────────
[models.external-gemma-2b]
name = "Gemma-2B"
description = "Google Gemma 2B for fast, small tasks"
context_length = 8192
capabilities = ["chat", "completion", "fast"]
backends = ["google"]

[backends]
# ── NIM Backend (Primary - Unlimited) ────────────────────────────────
[backends.nvidia-nim]
type = "nvidia-nim"
url = "https://integrate.api.nvidia.com/v1"
host = "external"
priority = 1
models = [
  "nvidia/nemotron-3-super-120b-a12b",
  "nvidia/nemotron-3-nano-30b-a3b", 
  "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning"
]

# ── Google Backend (Via AI Gateway - Fast/Privacy) ───────────────────
[backends.google]
type = "openai-compatible"
url = "http://ai-inference-gateway.ai-inference.svc.cluster.local:8080/v1"
host = "cluster"
priority = 2
models = [
  "google/gemma-4-31b-it",
  "google/gemma-4-26b-a4b-it",
  "google/gemma-3-12b-it",
  "google/gemma-3-4b-it",
  "google/gemma-2b"
]

# ── Local Backends (Private/Baseline) ────────────────────────────────
[backends.llama-vllm-3060ti]
type = "vllm"
url = "http://10.1.1.120:8040/v1"
host = "nexus"
priority = 3
gpu = "RTX 3060 Ti 8GB"
models = [
  "qwen3.5-2b-awq"
]

[backends.llama-sentry]
type = "llama-cpp"
url = "http://10.1.1.140:1235/v1"
host = "sentry"
priority = 3
gpu = "Radeon RX 5600 XT 6GB (Vulkan)"
models = [
  "Qwen3.5-4B-Q4_K_M.gguf"
]

[backends.llama-zephyr-3090]
type = "llama-cpp"
url = "http://10.1.1.110:1237/v1"
host = "zephyr"
priority = 3
gpu = "RTX 3090 24GB"
models = [
  "qwen3.5-27b-q4-k-m.gguf",
  "Carnice-Qwen3.6-MoE-35B-A3B.IQ4_XS.gguf"
]

# ── ZAI Backend (Subscription - Quota Limited) ───────────────────────
[backends.zai]
type = "zai"
url = "http://ai-inference-gateway.ai-inference.svc.cluster.local:8080/v1"
host = "cluster"
priority = 4
models = [
  "glm-5-turbo",
  "glm-5.1",
  "glm-4.7",
  "glm-4.7-flash",
  "glm-4.5-air"
]

# ── OpenCode Go Backend (Daily Reset) ────────────────────────────────
[backends.opencode-go]
type = "openai-compatible"
url = "https://api.opencode.go/v1"
host = "external"
priority = 5
models = [
  "deepseek-ai/deepseek-v4-flash"
]

# Disable specific models at the gateway level (handled by AI Gateway config)
[disabled_models]
# These are blocked regardless of backend - handled by AI Gateway policies
# List maintained for reference/audit purposes