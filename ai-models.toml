backends = ["zai"]

[models.zai-glm-4-7]
name = "glm-4.7"
description = "GLM-4.7 358B MoE — Coding (Z.AI)"
context_length = 128000
capabilities = ["chat", "completion", "coding"]
backends = ["zai"]

[models.zai-glm-4-7-flash]
