# AI Model Registry - Single Source of Truth
# Last Updated: 2026-05-21
# Strategy: NIM (Primary, Unlimited) -> Google Gemma (Fast, Privacy) -> Local Models (Private/Baseline) 
#           -> ZAI (Subscription, Quota-limited) -> OpenCode Go (Daily reset 7PM)
# Disabled models are explicitly blocked at the gateway level

[defaults]
# Primary default model for all backends when no specific model requested
primary = "nemotron-3-nano"
# Fallback model for secondary backends when primary unavailable
fallback = "gemma-2b"

[models]
# ── NVIDIA NIM (Unlimited / Primary) ──────────────────────────────────
[models.nemotron-3-super]
name = "nvidia/nemotron-3-super-120b-a12b"
description = "Nemotron 3 Super — Primary High-IQ Reasoning"
context_length = 262144
capabilities = ["chat", "completion", "reasoning", "tool_calling", "agentic"]
backends = ["nvidia-nim"]

[models.nemotron-3-nano]
name = "nvidia/nemotron-3-nano-30b-a3b"
description = "Nemotron 3 Nano — Fast High-IQ (Default)"
context_length = 262144
capabilities = ["chat", "completion"]
backends = ["nvidia-nim"]

[models.nemotron-3-nano-reasoning]
name = "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning"
description = "Nemotron 3 Nano Omni — Vision/Audio/Reasoning"
context_length = 256000
capabilities = ["chat", "completion", "vision", "audio", "reasoning"]
backends = ["nvidia-nim"]

# ── GOOGLE GEMMA (Fast / Privacy-Conscious) ──────────────────────────
[models.gemma-4-31b]
name = "google/gemma-4-31b-it"
description = "Gemma 4 31B — Fast, high-quality"
context_length = 131072
capabilities = ["chat", "completion", "coding"]
backends = ["google"]

[models.gemma-4-26b]
name = "google/gemma-4-26b-a4b-it"
description = "Gemma 4 26B — Efficient high-quality"
context_length = 131072
capabilities = ["chat", "completion", "coding"]
backends = ["google"]

[models.gemma-3-12b]
name = "google/gemma-3-12b-it"
description = "Gemma 3 12B — Fast and lightweight"
context_length = 131072
capabilities = ["chat", "completion"]
backends = ["google"]

[models.gemma-3-4b]
name = "google/gemma-3-4b-it"
description = "Gemma 3 4B — Ultra-fast"
context_length = 131072
capabilities = ["chat", "completion"]
backends = ["google"]

[models.gemma-2b]
name = "google/gemma-2b"
description = "Gemma 2B — Baseline fast"
context_length = 131072
capabilities = ["chat", "completion"]
backends = ["google"]

# ── LOCAL MODELS (Private / Baseline) ────────────────────────────────
[models.local-qwen-2b]
name = "qwen3.5-2b-awq"
description = "Local Qwen 3.5 2B AWQ-quantized (vLLM on Nexus)"
context_length = 200000
capabilities = ["chat", "completion", "vision", "fast"]
backends = ["llama-vllm-3060ti"]

[models.local-qwen-4b]
name = "Qwen3.5-4B-Q4_K_M.gguf"
