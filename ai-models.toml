# AI Model Registry - Single Source of Truth
# Last Updated: 2026-05-19

[defaults]
# Primary default model for all backends
primary = "qwen3.5-2b-awq"
# Fallback model for secondary backends (NVIDIA NIM Nemotron)
fallback = "nvidia/nemotron-3-super-120b-a12b"

[models]
# Model registry with aliases and metadata

[models.qwen3.5-2b-awq]
name = "Qwen3.5-2B-AWQ"
description = "Fast 2B AWQ-quantized model for agentic work"
context_length = 200000
capabilities = ["chat", "completion", "vision", "fast"]
backends = ["llama-vllm-3060ti", "llama-zephyr-3090", "llama-sentry"]

[models.qwen3.6-35b-iq3-s]
name = "Qwen3.6-35B-A3B-UD-IQ3_S.gguf"
