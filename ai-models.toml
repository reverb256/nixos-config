# ── ZAI (Subscription / Quota Exhausted - Last Resort) ──────────────────
[models.zai-glm-5-turbo]
name = "glm-5-turbo"
description = "GLM-5 Turbo — Fast Agentic (Z.AI)"
context_length = 128000
capabilities = ["chat", "completion", "fast"]
