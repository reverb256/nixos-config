# Cloudflare Tunnel credentials - generated from Cloudflare Dashboard
# This file is encrypted by SOPS/Agenix and mounted at /run/secrets/cloudflared-token
apiVersion: v1
kind: Secret
metadata:
  name: cloudflared-token
type: OPAQUE
stringData:
  # Account ID from Cloudflare dashboard
  AccountID: "placeholder-account-id"
  # Tunnel ID from Cloudflare dashboard
  TunnelID: "placeholder-tunnel-id" 
  # Tunnel Secret from Cloudflare dashboard
  TunnelSecret: "placeholder-tunnel-secret"
