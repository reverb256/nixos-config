# pre-commit.ci configuration
# The Nix-specific hooks (statix, deadnix, parse) use language: system
# and run on the self-hosted CI runner only. For pre-commit.ci, only
# portable text-formatting hooks are enabled.
# Install the GitHub app: https://github.com/apps/pre-commit-ci

ci:
  autofix_prs: false
  autoupdate_schedule: weekly
  submodules: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: [--maxkb=1000]
