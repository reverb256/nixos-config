models = ["nvidia/nemotron-3-super-120b-a12b", "nvidia/nemotron-3-nano-30b-a3b", "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning"]

# ── Google Backend (via AI Gateway) ──────────────────────────────────
[backends.google]
type = "openai-compatible"
url = "http://ai-inference-gateway.ai-inference.svc.cluster.local:8080/v1"
host = "cluster"
models = ["google/gemma-4-31b-it", "google/gemma-4-26b-a4b-it", "google/gemma-3-12b-it", "google/gemma-3-4b-it", "google/gemma-2b"]

