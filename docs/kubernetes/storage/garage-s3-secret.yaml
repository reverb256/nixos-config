---
# Kubernetes Secret for Garage S3 Access
# Stores S3 credentials for Kubernetes applications
#
# SECURITY: Do NOT paste credentials here. The Garage S3 access key ID and
# secret key live in the private `nixos-secrets` flake
# (github:reverb256/nixos-secrets, git+ssh) as:
#   secrets/storage/garage-s3-access-key-id.yaml
#   secrets/storage/garage-s3-secret-key.yaml
# They are materialized at runtime to /run/secrets/garage-s3-access-key-id
# and /run/secrets/garage-s3-secret-key by the secretspec wiring. Consume
# them from there — never inline them in a manifest or doc.
#
# Usage (runtime-materialized secret, NOT this file):
#   kubectl create secret generic garage-s3-credentials \
#     --namespace kube-system \
#     --from-file=accessKeyID=/run/secrets/garage-s3-access-key-id \
#     --from-file=secretAccessKey=/run/secrets/garage-s3-secret-key

---
# S3 credentials secret (REFERENCE ONLY — no inline values)
apiVersion: v1
kind: Secret
metadata:
  name: garage-s3-credentials
  namespace: kube-system
type: Opaque
stringData:
  # Garage S3 endpoint configuration
  endpoint: http://10.1.1.110:3900
  region: garage
  # accessKeyID / secretAccessKey: injected at runtime from nixos-secrets.
  # See header for the kubectl create command.

---
# Alternative: Environment variable format for pods (REFERENCE ONLY)
apiVersion: v1
kind: Secret
metadata:
  name: garage-s3-env
  namespace: default
type: Opaque
stringData:
  # AWS CLI environment variables
  AWS_ENDPOINT_URL: "http://10.1.1.110:3900"
  AWS_DEFAULT_REGION: "garage"
  AWS_S3_ADDRESSING_STYLE: "path"
  # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY: injected at runtime from
  # nixos-secrets (secrets/storage/garage-s3-*.yaml).
