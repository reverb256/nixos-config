---
# Kubernetes Secret for Garage S3 Access
# Stores S3 credentials for Kubernetes applications
#
# SECURITY: This is a base64-encoded secret. For production, use:
# - External Secrets Operator with agenix
# - Or use SealedSecrets
#
# Usage: kubectl apply -f docs/kubernetes/storage/garage-s3-secret.yaml

---
# S3 credentials secret
apiVersion: v1
kind: Secret
metadata:
  name: garage-s3-credentials
  namespace: kube-system
type: Opaque
stringData:
  # Garage S3 endpoint configuration
  endpoint: http://10.1.1.110:3900
  region: garage

  # S3 Access credentials
  # TODO: Replace with actual values from agenix
  accessKeyID: "GKac91d924fc76a30b9bcf6c3e"
  secretAccessKey: "TODO-REPLACE-FROM-AGENIX"

  # AWS CLI compatible config
  # Can be mounted as ~/.aws/config and ~/.aws/credentials
  config: |
    [default]
    region = garage

  credentials: |
    [default]
    aws_access_key_id = GKac91d924fc76a30b9bcf6c3e
    aws_secret_access_key = TODO-REPLACE-FROM-AGENIX

---
# Alternative: Environment variable format for pods
apiVersion: v1
kind: Secret
metadata:
  name: garage-s3-env
  namespace: default
type: Opaque
stringData:
  # AWS CLI environment variables
  AWS_ENDPOINT_URL: "http://10.1.1.110:3900"
  AWS_DEFAULT_REGION: "garage"
  AWS_ACCESS_KEY_ID: "GKac91d924fc76a30b9bcf6c3e"
  AWS_SECRET_ACCESS_KEY: "TODO-REPLACE-FROM-AGENIX"
  # Addressing style for Garage (path style, not virtual host style)
  AWS_S3_ADDRESSING_STYLE: "path"
