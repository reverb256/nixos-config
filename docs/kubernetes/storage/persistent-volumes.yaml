---
# Kubernetes PersistentVolumes for Cluster Storage
# Pre-provisioned PVs that map to existing cluster storage
#
# Usage: kubectl apply -f docs/kubernetes/storage/persistent-volumes.yaml

---
# Fast local SSD (Zephyr) - For databases
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-zephyr-ssd-databases
  labels:
    storage: fast-ssd
    purpose: databases
spec:
  capacity:
    storage: 100Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: fast-local-ssd
  local:
    path: /data/kubernetes/databases
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - zephyr
---
# Fast local SSD (Zephyr) - For ML models
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-zephyr-ssd-ml-models
  labels:
    storage: fast-ssd
    purpose: ml-models
spec:
  capacity:
    storage: 200Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: fast-local-ssd
  local:
    path: /data/kubernetes/ml-models
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - zephyr
---
# NFS Shared Storage (from Nexus) - For shared data
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-nfs-shared-data
  labels:
    storage: nfs-shared
    purpose: shared-data
spec:
  capacity:
    storage: 1Ti
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-shared-storage
  nfs:
    server: 10.1.1.120
    path: /data/shared/kubernetes
---
# NFS Media Storage (from Nexus) - For media files
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-nfs-media
  labels:
    storage: nfs-shared
    purpose: media
spec:
  capacity:
    storage: 2Ti
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-shared-storage
  nfs:
    server: 10.1.1.120
    path: /data/media/kubernetes
---
# NFS Backup Storage (from Nexus) - For backups
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-nfs-backups
  labels:
    storage: nfs-shared
    purpose: backups
spec:
  capacity:
    storage: 500Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-shared-storage
  nfs:
    server: 10.1.1.120
    path: /data/backups/kubernetes
---
