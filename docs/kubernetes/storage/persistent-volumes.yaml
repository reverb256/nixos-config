---
# Garage S3 Bucket (via CSI) - For S3-compatible storage
# TODO: Requires CSI-S3 driver installation
# See: docs/kubernetes/storage/garage-csi-plan.md
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-garage-s3-backups
  labels:
    storage: s3
    purpose: backups
spec:
  capacity:
    storage: 500Gi  # Logical size, S3 is unlimited
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: garage-s3
  csi:
    driver: csi.s3.csi.driver.garage
    volumeHandle: garage-backups-pv
    volumeAttributes:
      bucketName: backups
      mounter: geesefs
    nodeStageSecretRef:
      name: garage-s3-credentials
      namespace: kube-system
