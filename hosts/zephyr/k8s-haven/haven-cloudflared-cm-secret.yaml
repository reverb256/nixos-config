apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: haven
  labels:
    app: cloudflared-tunnel
data:
  config.yml: |
    tunnel: haven-tunnel
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:54162
    no-remote-ipv6: true
    quic: true
    originRequest:
      connectTimeout: 30s
      tlsTimeout: 10s
      tcpKeepAlive: 30s
      keepAliveConnections: 100
      keepAliveTimeout: 90s
    ingress:
      - hostname: haven.reverb256.ca
        service: http://haven:3000
      - service: http_status:404
---
apiVersion: v1
kind: Secret
metadata:
  name: cloudflared-secrets
  namespace: haven
type: OPAQUE
stringData:
  credentials.json: |
    {
      "AccountID": "PLACEHOLDER_ACCOUNT_ID",
      "TunnelID": "PLACEHOLDER_TUNNEL_ID",
      "TunnelSecret": "PLACEHOLDER_TUNNEL_SECRET"
    }
  tunnel-id: "PLACEHOLDER_TUNNEL_ID"
