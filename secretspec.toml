# NixOS cluster secrets — Phase 1 of the sops-nix -> SecretSpec migration.
#
# This file declares every secret required by the homelab stack. Phase 1
# storage resolution is via the dotenv + env providers; entries that already
# have an age-encrypted backing file in `secrets/<cat>/<slug>.yaml` keep
# resolving through sops-nix at runtime (the cluster's actual current
# resolver). This `secretspec.toml` is a SHADOW declaration — it does NOT
# move any data; it gives a single audit-friendly view of "every secret the
# cluster expects to resolve" so `secretspec check` can fail-loud before
# any dependent service comes up.
#
# IMPORTANT on the `pattern` field:
#   `pattern` in SecretSpec v0.16 is a REGEX over the *resolved value*, not
#   a URI router. Phase 1 (this file) deliberately omits `pattern = "..."`
#   on every entry, because the resolved value of any sops-nix-backed
#   secret does NOT match a `sops://...` literal. Setting `pattern` to a
#   sops URI causes `secretspec check` to fail every annotated entry,
#   even though the underlying secret is fine.
#
# Phase 2 (when cachix/secretspec#98 lands OR pkgs/secretspec-provider-sops
# becomes a flake input that `lib.loadWith` pulls in) will add per-secret
# `providers = ["sops", "dotenv", "env"]` chains. The cluster's sops-nix
# registry (modules/system/sops-secrets-registry.nix) remains the live
# source-of-truth which backing-file covers which secret.
#
# See ../secretspec-project/sops-provider-design.md for the upstream crate.
# See ../secretspec-project/migration-matrix.md for per-secret routing.

# ─── PHASE 2 MIGRATION STATUS ────────────────────────────────────────────────
# Machine-readable mirror of the migration state. The validator reads this
# with `secretspec schema --json` and humans consult the comment inventory
# below. Update `state` and `route_count` whenever cachix/secretspec#98
# lands or a route moves from `# phase2_sops_route:` to `providers = ["sops"]`.
[phase2_status]
state            = "ready_via_local_fork"
blocker          = "none"
# Empty string (not TOML `null`) for cross-implementation compatibility —
# some TOML parsers (Python tomllib, BURN's burn-config) reject bare
# `null`; use `""` to convey "no blocker URL" portably.
blocker_url      = ""
intended_provider = "sops"
intended_uri      = "sops:///etc/nixos/secrets/"
route_count       = 24
cachix_fork_path = "/home/j_kro/Projects/secretspec-core"
provider_fork_path = "/home/j_kro/Projects/secretspec"
dispatch_protocol = "ndjson-stdio-v1"
# Both forks tracked in Nix via .pre-commit-config.yaml + secretspec-build CI.
# `just secretspec-fork-status` shows ahead/behind; `just secretspec-core-sync`
# rebases cachix fork upstream; `just secretspec-provider-sync` rebases the
# provider-rust fork; `just secretspec-rebuild` rebuilds the closure;
# `just secretspec-validate-local` runs the ephemeral-age-keypair end-to-end.
# The cachix fork lives on branch `feature/sops-provider-subprocess-dispatch`
# with `secretspec-fork-patches/0001-add-sops-provider.patch` as the patch
# series that adds secretspec/src/provider/sops.rs + registers it.
last_updated      = "2026-07-25"
# Manual bridge demo still available via `just secretspec-bridge-demo` for
# workflows that can't use the full subprocess dispatch path.

[project]
name = "nixos-cluster-secrets"
revision = "1.0"

# Providers — Phase 1 (env/dotenv) + Phase 2 (sops) wired together.
# Phase 2 is now ACTIVE: clusters/secretspec-fork-patches/0001-add-sops-provider.patch
# landed on the cachix fork, pkgs/secretspec builds with the `sops` Cargo
# feature, and the SopsProvider spawns secretspec-provider-sops-protocol
# over stdio per cachix/secretspec#98. dotenv reads /etc/nixos/.env.secrets
# (.env.secrets.example template ships in repo for fresh hosts); sops reads
# /etc/nixos/secrets/**/*.yaml — same files sops-nix already decrypts, so the
# chain is symmetric with the existing runtime resolver. Provided `sops://`
# routes use the SOPS_AGE_KEY_FILE the operator already loaded via sops-nix.
[providers]
env    = "env://"
dotenv = "dotenv:///etc/nixos/.env.secrets"
sops   = "sops:///etc/nixos/secrets/"

[profiles.default.defaults]
providers = ["sops", "dotenv", "env"]

[profiles.production.defaults]
providers = ["sops", "dotenv", "env"]

[profiles.development.defaults]
providers = ["dotenv", "env"]

# ----------------------------------------------------------------------------
