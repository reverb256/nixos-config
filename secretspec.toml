[project]
name = "nixos"
revision = "1.0"

[providers.sops]
# SecretSpec SOPS provider backend (pkgs.secretspec-provider-sops).
# Resolves secrets from sops-nix encrypted files via `sops --decrypt`.
# The age key is read from SOPS_AGE_KEY_FILE in the build/runtime env
# (cluster key at /etc/nixos/.age/key.txt). Mirrors the sops-nix
# source-of-truth used by sops-secrets-registry.nix.
uri = "sops:///etc/nixos/secrets/ci/github-token.yaml"

[profiles.default]
SAMSUNG_TV_TOKEN = { description = "Samsung TV WebSocket auth token", required = true }
# GitHub fine-grained PAT for flake-input fetching (avoids API rate limiting).
# Single source of truth: secrets/ci/github-token.yaml (sops-nix, rotated 2026-07-24).
# Consumed by nix-access-token.service -> /etc/nix/nix.conf access-tokens.
GITHUB_TOKEN = { description = "GitHub PAT for nix flake-input fetching", required = true, providers = ["sops"] }
