# ----------------------------------------------------------------------------
# Default profile — every secret required across all environments.
# Each entry's `phase2_sops_route` comment records the sops-nix slug that
# would become its primary provider in Phase 2.
# `pattern` is intentionally absent — see top-of-file note on its semantics.
# ----------------------------------------------------------------------------
[profiles.default]

# === AI services ============================================================
# phase2_sops_route: secrets/ai/nvidia-api-key.yaml#nvidia_api_key
NVIDIA_API_KEY            = { description = "NVIDIA NGC API key", required = true, type = "password", ref = { item = "data" }, providers = ["sops_ai_nvidia_api_key"] }
# phase2_sops_route: (none — env/dotenv fallback)
OPENAI_API_KEY            = { description = "OpenAI API key (chat, research, embeddings)", required = true, type = "password" }
# phase2_sops_route: (none — env/dotenv fallback)
ANTHROPIC_API_KEY         = { description = "Anthropic Claude API key", required = true, type = "password" }
# phase2_sops_route: (none — env/dotenv fallback)
OPENAI_ORG_ID             = { description = "OpenAI organization ID (org-scoped access)", required = true }
# phase2_sops_route: secrets/ai/huggingface-token.yaml#huggingface_token
HUGGINGFACE_TOKEN         = { description = "HuggingFace Hub API token", required = true, type = "password", ref = { item = "data" }, providers = ["sops_ai_huggingface_token"] }
# phase2_sops_route: (none — env/dotenv fallback)
STABILITY_API_KEY         = { description = "Stability AI API key", required = true, type = "password" }
# phase2_sops_route: (none — env/dotenv fallback)
REPLICATE_API_TOKEN       = { description = "Replicate API token", required = true, type = "password" }
# phase2_sops_route: secrets/ai/opencode-api-key.yaml#opencode_zen_api_key
# Alias mapping at runtime: hermes-cli's OPENCODE_API_KEY env var is filled
# from this route via the secretspecEnvVarMappings in hosts/zephyr/services.nix
# (env-var→route table). The underlying OpenCode Zen provider uses this key.
OPENCODE_ZEN_API_KEY      = { description = "OpenCode Zen API key (consumed as OPENCODE_API_KEY env var by Hermes CLI)", required = true, type = "password", ref = { item = "data" }, providers = ["sops_ai_opencode_api_key"] }
# phase2_sops_route: secrets/ai/opencode-go-api-key.yaml#opencode_go_api_key
OPENCODE_GO_API_KEY       = { description = "OpenCode Go API key (consumed as OPENCODE_GO_API_KEY env var by Hermes CLI)", required = true, type = "password", ref = { item = "data" }, providers = ["sops_ai_opencode_go_api_key"] }

# === CI ======================================================================
# phase2_sops_route: secrets/ci/github-token.yaml#github_token
GITHUB_TOKEN              = { description = "GitHub PAT for nix flake-input fetching", required = true, ref = { item = "data" }, providers = ["sops_ci_github_token"] }
# phase2_sops_route: secrets/ci/github-runner-pat.yaml#github_runner_pat
GITHUB_RUNNER_PAT         = { description = "Self-hosted GitHub Actions runner PAT", required = true, ref = { item = "data" }, providers = ["sops_ci_github_runner_pat"] }
# phase2_sops_route: secrets/ai/cachix-token.yaml#cachix_token
NIX_PACKAGES_CACHE_TOKEN  = { description = "Cachix nix-package cache auth token", required = true, type = "password", ref = { item = "data" }, providers = ["sops_ai_cachix_token"] }

# === Cloud ===================================================================
# phase2_sops_route: secrets/cloud/cloudflared-token.yaml#cloudflared_token
CLOUDFLARE_TUNNEL_TOKEN   = { description = "cloudflared tunnel credential JSON", required = true, type = "password", ref = { item = "data" }, providers = ["sops_cloud_cloudflared_token"] }
# phase2_sops_route: secrets/cloud/cloudflare-global-api-key.yaml (overlaps with cloudflare-api-key)
CLOUDFLARE_API_KEY        = { description = "Cloudflare API key (DNS edit permissions)", required = true, type = "password", ref = { item = "data" }, providers = ["sops_cloud_cloudflare_global_api_key"] }
CLOUDFLARE_EMAIL          = { description = "Cloudflare account email (DNS edit auth)", required = true }
CLOUDFLARE_ZONE_ID        = { description = "Cloudflare zone ID for primary domain", required = true }
# phase2_sops_route: secrets/cloud/tailscale-oauth.yaml#tailscale_oauth
TAILSCALE_AUTH_KEY        = { description = "Tailscale preauth key for new nodes", required = true, ref = { item = "data" }, providers = ["sops_cloud_tailscale_oauth"] }
HOMELAB_DUCKDNS_TOKEN     = { description = "DuckDNS update token for homelab subdomain", required = true, type = "password" }
ACME_ACCOUNT_KEY          = { description = "Let's Encrypt ACME account key (EAB)", required = true, type = "password" }

# === Storage ================================================================
# BACKUP_ENCRYPTION_KEY deliberately excluded from keyring:// per
# sops-provider-design.md "Wallet key blocklist" — master age encryption
# keys belong in sops:// or onepassword:// only, never OS keyring
# (exfiltratable by local malware).
# phase2_sops_route: secrets/storage/garage-s3-access-key-id.yaml
GARAGE_ACCESS_KEY         = { description = "Garage S3 access key", required = true, ref = { item = "data" }, providers = ["sops_storage_garage_s3_access_key_id"] }
# phase2_sops_route: secrets/storage/garage-s3-secret-key.yaml
GARAGE_SECRET_KEY         = { description = "Garage S3 secret key", required = true, type = "password", ref = { item = "data" }, providers = ["sops_storage_garage_s3_secret_key"] }
RESTIC_REPO_PASSWORD      = { description = "Restic repository password", required = true, type = "password" }
RCLONE_CONFIG_PASS        = { description = "rclone config-file obfuscation passphrase", required = true, type = "password" }
BACKUP_ENCRYPTION_KEY     = { description = "Restic/rclone age encryption key (blocklisted from keyring://)", required = true, type = "password" }

# === Kubernetes =============================================================
# base64 in env for Phase 1; later we'll revisit with as_path for raw file writes.
K3S_CLUSTER_TOKEN         = { description = "K3s cluster bootstrap token", required = true, type = "password", ref = { item = "data" }, providers = ["sops_k8s_k3s_cluster_token"] }
# phase2_sops_route: secrets/kubeconfig (admin kubeconfig, base64-in-env for Phase 1)
KUBECONFIG_ADMIN          = { description = "Base64-encoded admin kubeconfig (Phase 1)", required = true }
KUBEADMIN_PASSWORD        = { description = "Kubernetes dashboard admin password", required = true, type = "password" }
K3S_KUBELET_TOKEN         = { description = "K3s kubelet bootstrap token", required = true, type = "password" }

# === Mining =================================================================
# Wallet keys (ETH/XMR) deliberately excluded from keyring:// per
# sops-provider-design.md "Wallet key blocklist". Wallet ADDRESSES are
# PUBLIC and not secret — they're mirrored here for sops:// route parity
# (Phase 2 YAML-key and Phase 3 provider assignments align row-for-row).
ETHEREUM_WALLET_KEY       = { description = "ETH wallet private key for mining pool (blocklisted from keyring://)", required = true, type = "password" }
MONERO_WALLET_KEY         = { description = "XMR wallet private key for mining pool (blocklisted from keyring://)", required = true, type = "password" }
ETHEREUM_WALLET_ADDRESS   = { description = "ETH wallet public address (PUBLIC — mirrored for sops:// route parity, not a secret)", required = true }
MONERO_WALLET_ADDRESS     = { description = "XMR wallet public address (PUBLIC — mirrored for sops:// route parity, not a secret)", required = true }
MINING_POOL_USER          = { description = "Mining pool username", required = true }
MINING_POOL_PASS          = { description = "Mining pool password", required = true, type = "password" }

# === Monitoring =============================================================
# phase2_sops_route: secrets/monitoring/grafana-admin-password.yaml#grafana_admin_password
GRAFANA_ADMIN_PASSWORD    = { description = "Initial Grafana admin password", required = true, type = "password", ref = { item = "data" }, providers = ["sops_monitoring_grafana_admin_password"] }
PROMETHEUS_REMOTE_WRITE_TOKEN = { description = "Prometheus remote-write bearer token", required = true }
LOKI_INGEST_TOKEN         = { description = "Loki log ingestion bearer token", required = true, type = "password" }
UPTIME_ROBOT_API_KEY      = { description = "UptimeRobot API key", required = true, type = "password" }
# phase2_sops_route: secrets/monitoring/grafana-oidc-client-secret.yaml
GRAFANA_OAUTH_CLIENT_SECRET = { description = "Grafana OAuth client secret", required = true, type = "password", ref = { item = "data" }, providers = ["sops_monitoring_grafana_oidc_client_secret"] }

# === Automation =============================================================
ANSIBLE_VAULT_PASSWORD    = { description = "Ansible Vault password", required = true, type = "password" }
# phase2_sops_route: secrets/ci/gitea-runner-token.yaml (cross-cutting)
HOMELAB_RUNNER_REG_TOKEN  = { description = "act_runner registration token", required = true, type = "password", ref = { item = "data" }, providers = ["sops_ci_gitea_runner_token"] }

