# NixOS cluster secrets — upstream secretspec 0.18.0 with native sops provider.
#
# Uses upstream cachix/secretspec 0.18.0 with native sops provider (merged
# PR #58, 2026-07-27). Each sops-backed secret has a per-file sops:// provider
# alias and a ref = { item = "key" } pointing to the decrypted YAML key.
#
# IMPORTANT on the `pattern` field:
#   `pattern` in SecretSpec v0.16 is a REGEX over the *resolved value*, not
#   a URI router. Phase 1 (this file) deliberately omits `pattern = "..."`
#   on every entry, because the resolved value of any sops-nix-backed
#   secret does NOT match a `sops://...` literal. Setting `pattern` to a
#   sops URI causes `secretspec check` to fail every annotated entry,
#   even though the underlying secret is fine.
#
# Phase 2 (upstream native sops provider, live since 0.17 PR#58) can add
# per-secret `providers = ["dotenv", "env"]` chains on top of the sops aliases.
# The cluster's sops-nix
# registry (modules/system/sops-secrets-registry.nix) remains the live
# source-of-truth which backing-file covers which secret.
#
# See ../secretspec-project/sops-provider-design.md for the upstream crate.
# See ../secretspec-project/migration-matrix.md for per-secret routing.

# ─── PHASE 2 MIGRATION STATUS ────────────────────────────────────────────────
# Machine-readable mirror of the migration state. The validator reads this
# with `secretspec schema --json` and humans consult the comment inventory
# below. Update `state` and `route_count` whenever cachix/secretspec#98
# lands or a route moves from `# phase2_sops_route:` to `providers = ["sops"]`.
[phase2_status]
state            = "upstream_cutover"
blocker          = "none"
# 2026-08-07: Fork fully removed. The cluster builds upstream cachix/secretspec
# 0.18.0 (native sops provider, integrated upstream in 0.17 PR#58). The
# reverb256 fork (0.16.0-fork.1) + secretspec-provider-sops flake inputs and
# protocol dispatcher (SECRETSPEC_SOPS_PROVIDER_BIN) were deleted.
# 48 per-file sops:// provider aliases remain; refs point at the decrypted
# YAML key. Requires: upstream secretspec 0.18.0 + SOPS_AGE_KEY_FILE env var.
# Empty string (not TOML `null`) for cross-implementation compatibility —
# some TOML parsers (Python tomllib, BURN's burn-config) reject bare
# `null`; use `""` to convey "no blocker URL" portably.
blocker_url      = ""
intended_provider = "sops"
intended_uri      = "per-file sops:// aliases (upstream 0.18.0)"
# route_count is the count of [profiles.default] entries with an explicit
# ref = { item = ... } declaration. Recount after every change via:
#   grep -c 'ref = { item' secretspec.toml
route_count       = 48  # upstream cutover: 48 per-file sops aliases after n8n retirement
provider_fork_path = "(removed — using upstream 0.18.0)"
# Both forks tracked in Nix via .pre-commit-config.yaml + secretspec-build CI.
# `just secretspec-fork-status` shows ahead/behind; `just secretspec-core-sync`
# rebases cachix fork upstream; `just secretspec-provider-sync` rebases the
# provider-rust fork; `just secretspec-rebuild` rebuilds the closure;
# `just secretspec-validate-local` runs the ephemeral-age-keypair end-to-end.
# The reverb256 fork (branches feature/sops-provider-* +
# secretspec-fork-patches/0001-add-sops-provider.patch) was deleted 2026-08-07;
# upstream cachix/secretspec 0.18.0 ships the native sops provider.
last_updated      = "2026-08-07"
# Manual bridge demo still available via `just secretspec-bridge-demo` for
# workflows that can't use the full subprocess dispatch path.

[project]
name = "nixos-cluster-secrets"
revision = "1.0"

# Providers — upstream secretspec 0.18.0 with native sops provider.
# Each sops-backed secret has a dedicated sops://<file> alias.
# dotenv reads /etc/nixos/.env.secrets; env reads process environment.
# sops aliases read individual sops-encrypted YAML files under /etc/nixos/secrets/.
[providers]
env    = "env://"
dotenv = "dotenv:///etc/nixos/.env.secrets"
sops_ai_cachix_token = "sops:///etc/nixos/secrets/ai/cachix-token.yaml"
