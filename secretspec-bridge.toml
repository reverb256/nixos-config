# secretspec-bridge.toml — Single-secret Phase-2 bridge demo.
#
# Proves end-to-end that the local secretspec-provider-sops crate
# (`pkgs/secretspec-provider-sops/default.nix`) can decrypt a real sops
# .age file via the standalone-CLI invocation model. The justfile
# recipe `secretspec-bridge-demo` invokes:
#
#   1. secretspec-provider-sops get <file> <key> --format dotenv \
#       > /tmp/.env.bridge
#   2. secretspec check -f secretspec-bridge.toml
#
# This is NOT merged into the production secretspec.toml because the
# upstream cachix/secretspec Provider-trait exposure is not merged.
# When it lands, the same secret routes natively with
# `providers = ["sops"]` and this manifest can be retired.
#
# Usage:
#   just secretspec-bridge-demo
#
[project]
name = "nixos-cluster-secrets-bridge"
revision = "0.1.0"

[providers]
env    = "env://"
dotenv = "dotenv:///tmp/.env.bridge"

[profiles.demo.defaults]
providers = ["dotenv"]

# Single-secret Phase-2 demo: routes secrets/ci/github-token.yaml
# with YAML key github_token via the local secretspec-provider-sops
# CLI. See justfile's `secretspec-bridge-demo` recipe for invocation.
[profiles.demo.GITHUB_TOKEN]
description = "GitHub PAT — Phase-2 sops bridge demo"
required = true
type = "password"
