# SOPS recipients — last rotated 2026-07-25 after a data-loss incident.
# See /etc/nixos/SECURITY-INCIDENT-2026-07-25.md for context.
#
# Four recipients. Any one can decrypt (SOPS OR-semantics).
#   cluster_age      — original cluster key (private key at /etc/nixos/.age/key.txt)
#   zephyr_age_v2    — supplementary key generated on zephyr (private key at ~/.config/sops/age/keys.txt)
#   yubikey_nano     — YubiKey 5 NFC (PIV slot, must be plugged in to decrypt)
#   yubikey_nfc      — YubiKey 5 NFC (alternate slot)
#
# RESILIENCE CAVEAT: cluster_age and zephyr_age_v2 are both plaintext files
# on zephyr, so a host-level compromise yields both. The two YubiKey entries
# are the ONLY recipients that survive a host compromise. Don't treat the
# 4-of-4 recipient count as 4 independent attack vectors.
keys:
  - &cluster_age age1567g6raae4adh97lrfhalc9wwhmtsulh89k9pkx24m5ezfh8a4xqndrt6l
  - &zephyr_age_v2 age12k7ch5r9sczu42zc6eutxtl6leudn47uv5fvsjrlq5ms0f0hz9nshm3t7q
  - &yubikey_nano age1yubikey1qtrfqkheehc6dlyux9stwq67dq3kcledlwzzrckx0wk639mh0wqh54auh7v
  - &yubikey_nfc age1yubikey1qvh5yeguawe89kr9muzn6xvfwjkcja7rf0j6afxgyula6p9vql4kkjh52h2
creation_rules:
  - key_groups:
      - age:
          - *cluster_age
          - *zephyr_age_v2
          - *yubikey_nano
          - *yubikey_nfc
