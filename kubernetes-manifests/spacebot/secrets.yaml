apiVersion: v1
kind: Secret
metadata:
  name: spacebot-secrets
  namespace: spacebot
type: Opaque
stringData:
  # Telegram bot token (placeholder - will be updated by agenix)
  telegram-token: "PLACEHOLDER_FROM_AGENIX"

  # Provider API keys (optional - for non-gateway LLM access)
  zai-coding-plan-key: ""
  kilo-api-key: ""
---
# Note: The actual secret values should be managed via agenix
# Update the secret with: kubectl create secret generic spacebot-secrets \
#   --from-literal=telegram-token=$(cat /run/agenix/spacebot-telegram-token) \
#   --namespace=spacebot --dry-run=client -o yaml | kubectl apply -f -
