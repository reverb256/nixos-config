# Pre-provisioned PV for Spacebot on Nexus (NFS mounted)
# Uses Nexus NFS mount at /mnt/nixos-share/spacebot-data
apiVersion: v1
kind: PersistentVolume
metadata:
  name: spacebot-data-nexus-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: fast-local-ssd
  local:
    path: /mnt/nixos-share/spacebot-data
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - nexus
