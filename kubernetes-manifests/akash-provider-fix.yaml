# Akash Provider Helm Values - CRITICAL FIXES APPLIED
# Last Updated: 2026-03-24 23:58 UTC
#
# PROBLEM: Provider was running v0.11.0 with broken configuration
# SOLUTION: Rollback to v0.10.7 and apply all fixes via Helm upgrade

clusterPublicHostname: provider.reverb256.ca
domain: provider.reverb256.ca
providerAddress: akash1c6h804ky08tdpnxrv72vum783xuey09qgzt2p6
from: provider-wallet
email: admin@reverb256.ca
website: https://reverb256.ca

# CRITICAL: Rollback to v0.10.7 (v0.11.0 has BME migration regression)
image:
  repository: ghcr.io/akash-network/provider
  tag: 0.10.7  # ROLLED BACK from 0.11.0
  pullPolicy: IfNotPresent

# CRITICAL: Disable ingress (we use Cloudflare tunnel)
ingress:
  enabled: false

# Use ClusterIP (exposed via Cloudflare tunnel)
service:
  type: ClusterIP

# CRITICAL: DISABLED Let's Encrypt to fix provider crash loop
# Root cause: Gateway REST server requires Let's Encrypt cert, but ACME HTTP-01 fails
# because port 80 not exposed to provider HTTP-01 listener (port 5002)
# Provider will use its own mTLS certificate instead (from provider key pair)
letsEncrypt:
  enabled: false  # DISABLED
  acme:
    email: "admin@reverb256.ca"
    caDirUrl: "https://acme-v02.api.letsencrypt.org/directory"
  providers:
    cloudflare:
      enabled: true

# RPC node configuration (using fast, synced node)
node: https://akash-rpc.polkachu.com:443

# Resource limits (must comply with namespace LimitRange of 2Gi)
resources:
  limits:
    cpu: "2"
    memory: 2Gi
  requests:
    cpu: "1"
    memory: 1Gi

# CRITICAL: Extra environment variables for provider container
extraEnvs:
  # CRITICAL: Manually disable CertIssuer (letsEncrypt.enabled=false doesn't work)
  # Helm chart bug: AP_CERT_ISSUER_ENABLED stays true regardless of letsEncrypt.enabled
  - name: AP_CERT_ISSUER_ENABLED
    value: "false"

  # CRITICAL: Fix "client is not running" error by disabling withdrawal period
  # Root cause: AKASH_WITHDRAWAL_PERIOD: 1h causes provider crash loop
  # Solution: Set to empty string to disable periodic withdrawals
  - name: AKASH_WITHDRAWAL_PERIOD
    value: ""

  - name: CF_DNS_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-dns-token
        key: CF_DNS_API_TOKEN

# CRITICAL: Removed workstation tolerations to prevent scheduling on zephyr
# Zephyr has constant OOM exhaustion (31GB RAM for control plane + AI + gaming)
# Provider MUST run on nexus (46GB RAM) to avoid resource conflicts
tolerations: []

# Node affinity to prefer GPU nodes
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: accelerator
          operator: In
          values:
          - nvidia-gpu
          - amd-gpu

# Inventory operator configuration with tolerations for hardware-discovery pods
inventory:
  tolerations:
  - key: interactive
    operator: Equal
    value: "true"
    effect: NoExecute
  - key: workstation
    operator: Equal
    value: "true"
    effect: NoSchedule
