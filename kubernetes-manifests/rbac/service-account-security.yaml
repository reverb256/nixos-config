# Service Account Security
# Disable automountServiceAccountToken for pods that don't need it
---
apiVersion: v1
kind: Namespace
metadata:
  name: secure-workloads
---
# Example pod with service account token disabled
apiVersion: v1
kind: Pod
metadata:
  name: secure-pod-example
  namespace: secure-workloads
spec:
  automountServiceAccountToken: false
  containers:
  - name: nginx
    image: nginx:alpine
    command: ["/bin/sh", "-c"]
    args: ["echo 'Service account token mount disabled'; sleep 3600"]
