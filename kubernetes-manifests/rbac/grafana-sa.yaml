# Service Account and RBAC for Grafana
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-sa
  namespace: ai-inference
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grafana-role
  namespace: ai-inference
rules:
  # Grafana needs to access config for dashboards, datasources
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana-rolebinding
  namespace: ai-inference
subjects:
  - kind: ServiceAccount
    name: grafana-sa
roleRef:
  kind: Role
  name: grafana-role
  apiGroup: rbac.authorization.k8s.io
