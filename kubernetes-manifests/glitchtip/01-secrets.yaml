---
# Secrets for GlitchTip
# These will be populated from the existing agenix secrets
apiVersion: v1
kind: Secret
metadata:
  name: glitchtip-secrets
  namespace: glitchtip
type: Opaque
stringData:
  # Database password - from /run/agenix/glitchtip-db-password
  postgres-password: "CHANGE_ME_FROM_AGENIX"
  # Secret key - from /run/agenix/glitchtip-secret-key
  secret-key: "CHANGE_ME_FROM_AGENIX"
  # Full database URL - will be constructed from password
  database-url: "postgres://glitchtip:CHANGE_ME_FROM_AGENIX@postgres:5432/glitchtip"
