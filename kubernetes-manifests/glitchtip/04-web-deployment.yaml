---
# GlitchTip Web Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: glitchtip
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: glitchtip/glitchtip:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: glitchtip-secrets
              key: database-url
        - name: REDIS_URL
          value: "redis://redis:6379/0"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: glitchtip-secrets
              key: secret-key
        - name: PORT
          value: "8000"
        - name: DEFAULT_FROM_EMAIL
          value: "glitchtip@localhost"
        - name: ACCOUNT_SIGNUP_ENABLED
          value: "true"
        - name: GLITCHTID_DOMAIN
          value: "http://127.0.0.1:8000"
        - name: SERVER_ROLE
          value: "web"
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: glitchtip
  labels:
    app: web
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8000
    targetPort: http
    protocol: TCP
  selector:
    app: web
