# Health check patch for Redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: ai-inference
spec:
  template:
    spec:
      containers:
      - name: redis
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 30
          periodSeconds: 20
        readinessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 5
          periodSeconds: 10
