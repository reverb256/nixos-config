# Health check patch for n8n
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: ai-inference
spec:
  template:
    spec:
      containers:
      - name: n8n
        livenessProbe:
          httpGet:
            path: /healthz
            port: 5678
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 5678
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
