# Health check patch for Grafana
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: ai-inference
spec:
  template:
    spec:
      containers:
      - name: grafana
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
