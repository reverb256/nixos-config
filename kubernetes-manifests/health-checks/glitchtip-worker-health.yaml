# Health check patch for Glitchtip worker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: glitchtip
spec:
  template:
    spec:
      containers:
      - name: glitchtip-worker
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
