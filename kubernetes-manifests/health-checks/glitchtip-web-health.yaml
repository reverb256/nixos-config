# Health check patch for Glitchtip web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: glitchtip
spec:
  template:
    spec:
      containers:
      - name: glitchtip-web
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
