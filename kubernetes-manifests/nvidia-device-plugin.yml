# NVIDIA Device Plugin for Kubernetes
# Enables Kubernetes to schedule GPU workloads on NVIDIA GPUs
# Source: https://github.com/NVIDIA/k8s-device-plugin
# Updated for CRI-O on NixOS with direct device passthrough
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin-daemonset
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: nvidia-device-plugin-ds
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: nvidia-device-plugin-ds
      annotations:
        nvidia.com/gpu.cdi.enabled: "true"
    spec:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      # Mark this pod as a critical add-on for rescheduling
      priorityClassName: system-node-critical
      hostNetwork: false
      hostPID: false
      containers:
        - image: nvcr.io/nvidia/k8s-device-plugin:v0.18.2
          name: nvidia-device-plugin-ctr
          env:
            - name: FAIL_ON_INIT_ERROR
              value: "false"
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: PATH
              value: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/nvidia-driver/bin"
            - name: LD_LIBRARY_PATH
              value: "/nvidia-driver/lib:/nvidia-driver/lib64"
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "test -S /var/lib/kubelet/device-plugins/nvidia-gpu.sock"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            privileged: true
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: nvidia-driver
              mountPath: /run/opengl-driver
              readOnly: true
            - name: dev
              mountPath: /dev
            - name: sys
              mountPath: /sys
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: nvidia-driver
          hostPath:
            path: /run/opengl-driver
        - name: dev
          hostPath:
            path: /dev
        - name: sys
          hostPath:
            path: /sys
      nodeSelector:
        # Only schedule on nodes with NVIDIA GPUs
        accelerator: nvidia-gpu
