# nix-csi Driver - x86_64-only deployment using published images
# Phase 0: Deploy CSI driver for read-only /nix/store access
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nix-csi
  namespace: kube-system
  labels:
    app.kubernetes.io/name: csi
    app.kubernetes.io/part-of: nix-csi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nix-csi
  labels:
    app.kubernetes.io/part-of: nix-csi
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csidrivers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    verbs: ["get", "list", "watch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nix-csi
  labels:
    app.kubernetes.io/part-of: nix-csi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nix-csi
subjects:
  - kind: ServiceAccount
    name: nix-csi
    namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nix-csi
  namespace: kube-system
  labels:
    app.kubernetes.io/part-of: nix-csi
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "watch", "list", "delete", "update", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nix-csi
  namespace: kube-system
  labels:
    app.kubernetes.io/part-of: nix-csi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nix-csi
subjects:
  - kind: ServiceAccount
    name: nix-csi
    namespace: kube-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nix-node
  namespace: kube-system
  labels:
    app.kubernetes.io/part-of: nix-csi
data:
  nix.conf: |
    max-jobs = 4
    cores = 4
    sandbox = false
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nix-node
  namespace: kube-system
  labels:
    app.kubernetes.io/name: csi
    app.kubernetes.io/part-of: nix-csi
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: csi
      app.kubernetes.io/part-of: nix-csi
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: csi
        app.kubernetes.io/part-of: nix-csi
      annotations:
        kubectl.kubernetes.io/default-container: nix-node
    spec:
      serviceAccountName: nix-csi
      priorityClassName: system-node-critical
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: CriticalAddonsOnly
          operator: Exists
      initContainers:
        - name: initcopy
          image: alpine:3.19
          imagePullPolicy: Always
          securityContext:
            privileged: true
          command: ["/bin/sh", "-c"]
          args:
            - |
              apk add --no-cache coreutils 2>/dev/null || true
              mkdir -p /nix-volume/.links
              chmod 1777 /nix-volume/.links
              mkdir -p /nix-volume/var/nix/profiles
              mkdir -p /nix-volume/var/nix/gcroots
              ls -la /nix-volume
          volumeMounts:
            - name: nix-store
              mountPath: /nix-volume
            - name: nix-config
              mountPath: /etc/nix
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
      containers:
        - name: nix-node
          image: ghcr.io/lillecarl/nix-csi/scratch:1.0.1
          command: ["dinit", "--log-file", "/var/log/dinit.log", "--quiet", "csi"]
          securityContext:
            privileged: true
          env:
            - name: BUILDERS_ENABLED
              value: "false"
            - name: CACHE_ENABLED
              value: "false"
            - name: CSI_ENDPOINT
              value: unix:///csi/csi.sock
            - name: HOME
              value: /nix/var/nix-csi/root
            - name: KUBE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: KUBE_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: KUBE_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KUBE_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: NIX_BUILD_TIMEOUT
              value: "300"
            - name: RSYNC_CONCURRENCY
              value: "1"
            - name: USER
              value: root
          volumeMounts:
            - name: csi-socket
              mountPath: /csi
            - name: nix-config
              mountPath: /etc/nix
            - name: registration
              mountPath: /registration
            - name: kubelet
              mountPath: /var/lib/kubelet
              mountPropagation: Bidirectional
            - name: nix-store
              mountPath: /nix
              mountPropagation: Bidirectional
              subPath: nix
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
        - name: csi-node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.15.0
          args:
            - --v=5
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path=/var/lib/kubelet/plugins/nix.csi.store/csi.sock
          env:
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: csi-socket
              mountPath: /csi
            - name: kubelet
              mountPath: /var/lib/kubelet
            - name: registration
              mountPath: /registration
          resources:
            requests:
              memory: "10Mi"
              cpu: "10m"
        - name: livenessprobe
          image: registry.k8s.io/sig-storage/livenessprobe:v2.17.0
          args:
            - --csi-address=/csi/csi.sock
          volumeMounts:
            - name: csi-socket
              mountPath: /csi
            - name: registration
              mountPath: /registration
          resources:
            requests:
              memory: "10Mi"
              cpu: "10m"
      volumes:
        - name: nix-config
          configMap:
            name: nix-node
        - name: registration
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: DirectoryOrCreate
        - name: nix-store
          hostPath:
            path: /var/lib/nix-csi
            type: DirectoryOrCreate
        - name: csi-socket
          hostPath:
            path: /var/lib/kubelet/plugins/nix.csi.store/
            type: DirectoryOrCreate
        - name: kubelet
          hostPath:
            path: /var/lib/kubelet
            type: Directory
---
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: nix.csi.store
  labels:
    app.kubernetes.io/part-of: nix-csi
spec:
  attachRequired: false
  podInfoOnMount: false
  volumeLifecycleModes:
    - Persistent
    - Ephemeral
