# Test Pod for Storage Classes
# Verifies fast-local-ssd, slow-hdd, and large-nfs-storage work correctly

---
# Test Pod for fast-local-ssd (Zephyr NVMe)
apiVersion: v1
kind: Pod
metadata:
  name: test-fast-local-ssd
  namespace: default
spec:
  restartPolicy: Never
  containers:
  - name: test-storage
    image: busybox:latest
    command: ["/bin/sh", "-c"]
    args: 
      - |
        echo "Testing fast-local-ssd storage..."
        df -h /data
        echo "Writing test file..."
        dd if=/dev/zero of=/data/test-file bs=1M count=10
        ls -lh /data/test-file
        echo "Test completed successfully"
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: test-fast-local-ssd
  nodeSelector:
    kubernetes.io/hostname: zephyr

---
# Test Pod for slow-hdd (Sentry HDD)
apiVersion: v1
kind: Pod
metadata:
  name: test-slow-hdd
  namespace: default
spec:
  restartPolicy: Never
  containers:
  - name: test-storage
    image: busybox:latest
