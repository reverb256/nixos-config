# Test pod to verify nix-csi driver functionality
# This pod mounts /nix/store via CSI ephemeral volume without privileged containers
---
apiVersion: v1
kind: Pod
metadata:
  name: nix-csi-test
  namespace: default
  labels:
    app: nix-csi-test
    purpose: testing
  annotations:
    description: "Test pod for nix-csi driver - verifies read-only /nix/store mount"
spec:
  serviceAccountName: default
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: test
    image: alpine:3.19
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
    resources:
      limits:
        cpu: "100m"
        memory: "128Mi"
      requests:
        cpu: "50m"
        memory: "64Mi"
    command: ["/bin/sh", "-c"]
    args:
    - |
      echo "=== nix-csi Driver Test ==="
      echo "Testing /nix/store mount..."
      ls -la /nix/store | head -20
      echo ""
      echo "Testing read-only access..."
      if touch /nix/store/test 2>&1 | grep -q "Read-only"; then
        echo "Read-only mount verified"
      else
        echo "Read-only mount FAILED"
        exit 1
      fi
      echo ""
      echo "Testing /nix/store existence..."
      if [ -d /nix/store ]; then
        echo "/nix/store exists"
        echo "Store paths: $(ls /nix/store | wc -l)"
      else
        echo "/nix/store NOT found"
        exit 1
      fi
      echo ""
      echo "=== All tests passed ==="
    volumeMounts:
    - mountPath: /nix/store
      name: nix-store
      readOnly: true
  volumes:
  - name: nix-store
    ephemeral:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadOnlyMany"]
          resources:
            requests:
              storage: 1Gi
          storageClassName: nix-store
  restartPolicy: Never
