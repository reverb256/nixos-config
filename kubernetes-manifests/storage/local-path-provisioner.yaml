# Local Path Provisioner
# Rancher's local-path-provisioner for simple local storage provisioning
# https://github.com/rancher/local-path-provisioner

---
apiVersion: v1
kind: Namespace
metadata:
  name: local-path-storage

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: local-path-provisioner-service-account
  namespace: local-path-storage

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: local-path-provisioner-role
rules:
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumeclaims", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["endpoints", "persistentvolumes", "pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "update", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: local-path-provisioner-bind
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: local-path-provisioner-role
subjects:
  - kind: ServiceAccount
    name: local-path-provisioner-service-account
    namespace: local-path-storage

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-path-provisioner
  namespace: local-path-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: local-path-provisioner
  template:
    metadata:
      labels:
        app: local-path-provisioner
    spec:
      serviceAccountName: local-path-provisioner-service-account
      priorityClassName: system-cluster-critical
      containers:
      - name: local-path-provisioner
        image: rancher/local-path-provisioner:v0.0.26
        imagePullPolicy: IfNotPresent
        command:
          - local-path-provisioner
          - --debug
          - start
          - --config
          - /etc/config/config.json
        # Health probes - storage provisioner is critical
        livenessProbe:
          tcpSocket:
            port: 9387  # Default local-path-provisioner metrics port
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "pgrep -x local-path-provisioner || exit 1"
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        volumeMounts:
          - name: config-volume
            mountPath: /etc/config/
          - name: host-data
            mountPath: /var/local-path-provisioner
        env:
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
      volumes:
        - name: config-volume
          configMap:
            name: local-path-config
        - name: host-data
          hostPath:
            path: /var/local-path-provisioner
            type: DirectoryOrCreate

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: local-path-config
  namespace: local-path-storage
data:
  config.json: |
    {
      "nodePathMap": [
        {
          "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
          "paths": ["/var/local-path-provisioner"]
        },
        {
          "node": "zephyr",
          "paths": ["/data/k8s-local", "/var/local-path-provisioner"]
        },
        {
          "node": "nexus",
          "paths": ["/data/containers/k8s-local", "/var/local-path-provisioner"]
        },
        {
          "node": "sentry",
          "paths": ["/storage/k8s-local", "/var/local-path-provisioner"]
        },
        {
          "node": "forge",
          "paths": ["/var/local-path-provisioner"]
        }
      ]
    }
  helperPod.yaml: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      containers:
      - name: helper-pod
        image: ubuntu:latest
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "-c"]
        args: ["apt-get update -qq && apt-get install -y tar && sleep 1000000"]
  setup: |
    #!/bin/sh
    while getopts "m:s:p:" opt
    do
        case $opt in
            m)
                mode=$OPTARG
                ;;
            s)
                source=$OPTARG
                ;;
            p)
                path=$OPTARG
                ;;
            *)
                echo "Invalid option"
                exit 1
                ;;
        esac
    done
    mkdir -m "$mode" -p "$path"
    if [ -f "$source" ]; then
        tar xzf "$source" -C "$path"
    fi
  teardown: |
    #!/bin/sh
    while getopts "p:" opt
    do
        case $opt in
            p)
                path=$OPTARG
                ;;
            *)
                echo "Invalid option"
                exit 1
                ;;
        esac
    done
    find "$path" -mindepth 1 -maxdepth 1 -not -path "$path/lost+found" -not -path "$path/.snapshot" -exec rm -rf {} +
    rmdir "$path" 2>/dev/null || true

---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: fast-local-ssd
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: rancher.io/local-path
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true
allowedTopologies:
  - matchLabelExpressions:
      - key: kubernetes.io/hostname
        values:
          - zephyr

---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: slow-hdd
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: rancher.io/local-path
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true
allowedTopologies:
  - matchLabelExpressions:
      - key: kubernetes.io/hostname
        values:
          - sentry
