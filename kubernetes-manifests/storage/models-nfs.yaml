# NFS Storage for AI Models
# Static PersistentVolume pointing to Zephyr NFS export

---
# StorageClass for NFS storage (using pre-provisioned PVs)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: large-nfs-storage
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: Immediate
reclaimPolicy: Retain
allowVolumeExpansion: true

---
# PV: AI Models from Zephyr (/data/models)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-models-pv
spec:
  capacity:
    storage: 2Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: large-nfs-storage
  nfs:
    server: 10.1.1.110
    path: /data/models

---
# PVC for AI Models
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-models-pvc
  namespace: ai-inference
spec:
  storageClassName: large-nfs-storage
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 2Ti
