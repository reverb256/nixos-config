# Pod Disruption Budgets for critical services
# Ensures minimum availability during node maintenance

---
# CoreDNS PDB
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: coredns
  namespace: kube-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      k8s-app: kube-dns
---
# Caddy Ingress PDB
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: caddy-ingress
  namespace: ingress-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: caddy-ingress

