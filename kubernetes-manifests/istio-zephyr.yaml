# Istio Deployment with Node Affinity for Zephyr
# This ensures Istio control plane runs on Zephyr where networking is stable
---
apiVersion: v1
kind: Namespace
metadata:
  name: istio-system
  labels:
    istio-injection: disabled
---
apiVersion: v1
kind: Service
metadata:
  name: istiod
  namespace: istio-system
  labels:
    app: istiod
    istio: pilot
spec:
  ports:
  - port: 15010
    name: grpc-xds # plaintext
    protocol: TCP
  - port: 15012
    name: https-dns # mTLS with k8s signed cert
    protocol: TCP
  - port: 15014
    name: https-webhook # validation webhook
    protocol: TCP
  - port: 443
    name: https-webhook-2 # validation webhook
    protocol: TCP
  selector:
    app: istiod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: istiod
  namespace: istio-system
  labels:
    app: istiod
    istio: pilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: istiod
  template:
    metadata:
      labels:
        app: istiod
        istio: pilot
    spec:
      # Node affinity to schedule on Zephyr (control plane with stable networking)
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - zephyr
      # Use hostNetwork to bypass CNI issues
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: istiod
      containers:
      - name: discovery
        image: docker.io/istio/pilot:1.29.1
        env:
        - name: PILOT_CERT_PROVIDER
          value: "istiod"
        - name: PILOT_ENABLE_ANALYSIS
          value: "false"
        - name: PILOT_TRACE_SAMPLING
          value: "100"
        - name: PILOT_ENABLE_CROSS_CLUSTER_WORKLOAD_ENTRY
          value: "false"
        - name: QUOTA_PROVISIONING
          value: "false"
        - name: ENABLE_WEBHOOK_NAME_NAMESPACE_OVERRIDES
          value: "false"
        - name: ENABLE_LEGACY_SERVICE_DISCOVERY
          value: "false"
        - name: ENABLE_CA_SERVER
          value: "true"
        - name: CA_ADDR
          value: ""
        - name: PILOT_ENABLE_IP_AUTOALLOCATE
          value: "true"
        - name: PILOT_ENABLE_STATUS
          value: "false"
        - name: PILOT_ENABLE_HEADLESS_SERVICE_STATUS
          value: "false"
        - name: PILOT_STATUS_BUCKET
          value: "3"
        - name: PILOT_ENABLE_QUOTA_LIST_BYPASS
          value: "true"
        - name: ENABLE_SERVICE_ENTRY_STATUS
          value: "false"
        - name: ENABLE_WASM_PLUGIN_ROLLOUT_NAME_OVERRIDES
          value: "true"
        - name: PILOT_XDS_SEND_DELAY
          value: "0s"
        - name: VALIDATION_WEBHOOK_CONFIG_NAME
          value: "istiod-1-29"
        args:
        - "discovery"
        - "--monitoringAddr=:15014"
        - "--log_output_level=default:info"
        - "--domain"
        - "$(POD_NAMESPACE).svc.cluster.local"
        - "--secureGrpcAddr"
        - ":15012"
        - "--tlsCertFile=/etc/certs/cert.pem"
        - "--tlsKeyFile=/etc/certs/key.pem"
        - "--caCertFile=/etc/certs/ca-cert.pem"
        ports:
        - containerPort: 8080
          protocol: TCP
        - containerPort: 15010
          protocol: TCP
        - containerPort: 15012
          protocol: TCP
        - containerPort: 15014
          protocol: TCP
        - containerPort: 443
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /live
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        volumeMounts:
        - name: certs
          mountPath: /etc/certs
          readOnly: true
      volumes:
      - name: certs
        secret:
          secretName: istiod-tls
          optional: true
---
# Service Account for Istiod
apiVersion: v1
kind: ServiceAccount
metadata:
  name: istiod
  namespace: istio-system
---
# ClusterRole for Istiod
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: istiod
rules:
- apiGroups: ["config.istio.io", "security.istio.io", "networking.istio.io", "telemetry.istio.io", "extensions.istio.io"]
  resources: ["*"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["config.istio.io"]
  resources: ["*"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: istiod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: istiod
subjects:
- kind: ServiceAccount
  name: istiod
  namespace: istio-system
---
# Istio ConfigMap for mesh configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: istio
  namespace: istio-system
data:
  mesh: |-
    enableAutoMtls: true
    trustDomain: "cluster.local"
    rootNamespace: "istio-system"
---
# Istiod TLS Secret
apiVersion: v1
kind: Secret
metadata:
  name: istiod-tls
  namespace: istio-system
type: istio.io/ca-root
data: {}
---
# ValidatingWebhookConfiguration for Istio
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: istiod-1-29
webhooks:
- name: validation.istio.io
  rules:
  - operations: ["CREATE", "UPDATE"]
    apiGroups: ["config.istio.io", "security.istio.io", "networking.istio.io", "telemetry.istio.io", "extensions.istio.io"]
    apiVersions: ["*"]
    resources: ["*"]
  failurePolicy: Fail
  sideEffects: None
  admissionReviewVersions: ["v1", "v1beta1"]
  clientConfig:
    service:
      name: istiod
      namespace: istio-system
      path: /validate
      port: 443
---
# MutatingWebhookConfiguration for Istio sidecar injection
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: istio-sidecar-injector
webhooks:
- name: sidecar-injector.istio.io
  rules:
  - operations: ["CREATE"]
    apiGroups: [""]
    apiVersions: ["v1"]
    resources: ["pods"]
  failurePolicy: Fail
  sideEffects: None
  admissionReviewVersions: ["v1", "v1beta1"]
  clientConfig:
    service:
      name: istiod
      namespace: istio-system
      path: /inject
      port: 443
  namespaceSelector: {}
  objectSelector: {}
---
