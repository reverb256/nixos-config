# GPU Test Pod - Phase 1 Testing (with RuntimeClass)
# Tests Kubernetes GPU workload detection in compute-workload-monitor
#
# This pod requests an NVIDIA GPU using RuntimeClass for proper allocation
# The compute-workload-monitor should:
# 1. Detect this pod using kubectl
# 2. Switch to "kubernetes-gpu" profile
# 3. Pause GPU mining (lolminer-nvidia)
# 4. Reduce CPU mining to 50%
#
# Usage:
#   kubectl apply -f gpu-test-phase1-runtimeclass.yaml
#   sudo journalctl -u compute-workload-monitor -f  # Watch logs
#   kubectl delete pod gpu-test-phase1  # Cleanup when done
#
# Alternative: Test without RuntimeClass (may fail with CRI-O)
#   kubectl apply -f gpu-test-phase1.yaml

apiVersion: v1
kind: Pod
metadata:
  name: gpu-test-phase1
  labels:
    app: gpu-test
    phase: "1"  # Phase 1: Kubernetes GPU detection testing
spec:
  # CRITICAL: Use nvidia RuntimeClass for proper GPU allocation
  runtimeClassName: nvidia
  # Use default namespace (visible to compute-workload-monitor)
  # Do NOT use kube-system (compute-workload-monitor checks all namespaces)
  containers:
  - name: gpu-test
    image: nvidia/cuda:12.1.0-base-ubuntu22.04
    command: ["sleep"]
    args: ["3600"]  # Run for 1 hour
    resources:
      limits:
        nvidia.com/gpu: 1  # Request 1 GPU
    env:
    - name: NVIDIA_VISIBLE_DEVICES
      value: "all"
  restartPolicy: Never  # Don't restart if it fails

---
# Verification commands:
#
# Check if pod is running:
#   kubectl get pod gpu-test-phase1
#
# Check if GPU was allocated:
#   kubectl describe pod gpu-test-phase1 | grep -A 10 "nvidia.com/gpu"
#
# Check inside the pod for GPU access:
#   kubectl exec gpu-test-phase1 -- nvidia-smi
#
# Monitor compute-workload-monitor detection:
#   sudo journalctl -u compute-workload-monitor -f | grep -i "kubernetes\|gpu"
