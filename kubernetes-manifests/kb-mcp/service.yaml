# KB MCP Service - ClusterIP for internal access
---
apiVersion: v1
kind: Service
metadata:
  name: kb-mcp
  namespace: ai-inference
  labels:
    app: kb-mcp
    component: rag
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    name: http
    protocol: TCP
  selector:
    app: kb-mcp
