# Core Kubernetes Services - High Priority PDBs
# These services are critical for cluster operation
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: coredns-pdb
  namespace: kube-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      k8s-app: kube-dns
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: metrics-server-pdb
  namespace: kube-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      k8s-app: metrics-server
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ingress-nginx-pdb
  namespace: ingress-nginx
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ingress-nginx
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nvidia-device-plugin-pdb
  namespace: kube-system
spec:
  minAvailable: 2
  selector:
    matchLabels:
      name: nvidia-device-plugin-ds
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: amdgpu-device-plugin-pdb
  namespace: kube-system
spec:
  minAvailable: 2
  selector:
    matchLabels:
      name: amdgpu-device-plugin-daemonset
