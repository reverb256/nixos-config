# Glitchtip Error Tracking - Medium Priority PDBs
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: glitchtip-web-pdb
  namespace: glitchtip
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: web
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: glitchtip-postgres-pdb
  namespace: glitchtip
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: postgres
---
