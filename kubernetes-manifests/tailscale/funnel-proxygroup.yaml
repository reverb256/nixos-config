# Tailscale Funnel ProxyGroup — HA funnel proxies for MapleSpike
# Managed through /etc/nixos/ as source of truth
# ProxyClass ha-funnel is defined in funnel-proxyclass.yaml
---
apiVersion: tailscale.com/v1alpha1
kind: ProxyGroup
metadata:
  name: funnel-proxies
  namespace: tailscale
spec:
  type: ingress
  replicas: 2
  proxyClass: ha-funnel
