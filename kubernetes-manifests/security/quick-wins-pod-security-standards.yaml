# Pod Security Standards - Quick Win Hardening
# Adds PSS labels to namespaces that don't have them yet
# Applied: 2026-03-21

---
# AI Coding Namespace - Baseline (development workloads)
apiVersion: v1
kind: Namespace
metadata:
  name: ai-coding
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

