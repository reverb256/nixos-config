# Pod Disruption Budgets for Critical Services
# Ensures high availability during voluntary disruptions (node maintenance, upgrades)

---
# AI Inference Gateway PDB
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ai-inference-gateway-pdb
  namespace: ai-inference
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ai-inference-gateway

---
# SearXNG PDB
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: searxng-pdb
  namespace: search
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: searxng

