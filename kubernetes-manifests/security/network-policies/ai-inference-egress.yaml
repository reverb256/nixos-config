---
# Allow ai-inference namespace to reach SearXNG in search namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: ai-inference
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: search
      ports:
        - protocol: TCP
          port: 8080
