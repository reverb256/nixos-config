# Falco Runtime Security Deployment for Akash Provider
# Provides real-time threat detection and response

apiVersion: v1
kind: ServiceAccount
metadata:
  name: falco
  namespace: falco
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: falco
rules:
  # Falco needs read access to many resources
- apiGroups: [""]
  resources: ["pods", "pods/log", "services", "deployments", "replicasets", "statefulsets", "daemonsets", "cronjobs", "jobs"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["cronjobs", "jobs"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: falco
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: falco
subjects:
- kind: ServiceAccount
  name: falco
  namespace: falco
---
# Removed custom config - using Falco defaults
---
# Falco DaemonSet (runs on all nodes)
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: falco
  namespace: falco
  labels:
    app: falco
spec:
  selector:
    matchLabels:
      app: falco
  template:
    metadata:
      labels:
        app: falco
      annotations:
        # Exempt from baseline PodSecurity (Falco needs privileged mode)
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged
    spec:
      serviceAccountName: falco
      hostNetwork: false
      hostPID: true  # Required for Falco
      containers:
      - name: falco
        image: falcosecurity/falco:0.38.2
        args:
        - /usr/bin/falco
        securityContext:
          privileged: true  # Required for Falco
          readOnlyRootFilesystem: false
        volumeMounts:
        - name: proc
          mountPath: /host/proc
          readOnly: true
        - name: rootfs
          mountPath: /host/root
          readOnly: true
        - name: varrun
          mountPath: /var/run
        - name: dev
          mountPath: /host/dev
        - name: falco-logs
          mountPath: /var/log/falco
        env:
        - name: HOST_PROC
          value: /host/proc
        - name: HOST_ROOT
          value: /host/root
        - name: FALCO_BPF_PROBE
          value: ""
        resources:
          requests:
            cpu: "100m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "2048Mi"
      volumes:
      - name: proc
        hostPath:
          path: /proc
          type: Directory
      - name: rootfs
        hostPath:
          path: /
          type: Directory
      - name: varrun
        hostPath:
          path: /var/run
      - name: dev
        hostPath:
          path: /dev
          type: Directory
      - name: falco-logs
        hostPath:
          path: /var/log/falco
          type: DirectoryOrCreate
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
      - key: node-role.kubernetes.io/master
        operator: Exists
