---
# mining namespace - high limits (GPU workloads need more)
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: mining
spec:
  limits:
  - default:
      cpu: "2000m"
      memory: "2Gi"
    defaultRequest:
      cpu: "200m"
      memory: "256Mi"
    max:
      cpu: "8000m"
      memory: "8Gi"
    min:
      cpu: "100m"
      memory: "128Mi"
    type: Container

---
