---
# LimitRanges to enforce default resource requests/limits
# This prevents pods from consuming unlimited resources

# ai-inference namespace - strict limits
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: ai-inference
spec:
  limits:
  - default:
      cpu: "1000m"
      memory: "1Gi"
    defaultRequest:
      cpu: "100m"
      memory: "128Mi"
    max:
      cpu: "4000m"
      memory: "4Gi"
    min:
      cpu: "50m"
      memory: "64Mi"
    type: Container

---
# akash-services namespace - moderate limits
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: akash-services
spec:
  limits:
  - default:
      cpu: "500m"
      memory: "512Mi"
    defaultRequest:
      cpu: "100m"
      memory: "128Mi"
    max:
      cpu: "2000m"
      memory: "2Gi"
    min:
      cpu: "50m"
      memory: "64Mi"
    type: Container

---
