---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-code
  namespace: ai-coding
  labels:
    app: claude-code
    component: ai-coding-tool
spec:
  replicas: 1  # Start with 1, scale based on demand
  selector:
    matchLabels:
      app: claude-code
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: claude-code
        component: ai-coding-tool
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      hostNetwork: false
      dnsPolicy: ClusterFirst

      # Lower priority than mining (use default priority class)

      # Lock to zephyr for shared PVC access
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - zephyr

      volumes:
      # Mount shared PVC for configs
      - name: home-dir
        persistentVolumeClaim:
          claimName: ai-coding-configs

      containers:
      - name: claude-code
        image: docker.io/reverb256/claude-code:nixos
        imagePullPolicy: Always  # Pull latest from Docker Hub
        command:
        - /bin/bash
        - -c
        - |
          echo "Claude Code container ready"
          echo "Config: $CLAUDE_CONFIG_DIR"
          echo ""
          echo "To run Claude Code:"
          echo "  kubectl exec -it $POD_NAME -- /bin/claude"
          echo ""
          # Keep container running for interactive sessions
          tail -f /dev/null

        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: HOME
          value: /home/j_kro
        - name: USER
          value: j_kro
        - name: CLAUDE_CONFIG_DIR
          value: /home/j_kro/.claude
        - name: PATH
          value: /bin:/usr/bin:/home/j_kro/.nix-profile/bin

        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"

        volumeMounts:
        - name: home-dir
          mountPath: /home/j_kro

        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - test -d /home/j_kro/.claude
          initialDelaySeconds: 10
          periodSeconds: 30

        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - test -d /home/j_kro/.claude
          initialDelaySeconds: 5
          periodSeconds: 10

      # Metrics sidecar
      - name: metrics
        image: python:3.11-slim
        command:
        - /bin/sh
        - -c
        - |
          mkdir -p /app
          pip install prometheus_client psutil -q
          cat <<'EOF' > /app/metrics.py
          from prometheus_client import start_http_server, Gauge
          import psutil
          import time

          ACTIVE_SESSIONS = Gauge('claude_active_sessions', 'Number of active Claude sessions')
          HISTORY_SIZE = Gauge('claude_history_size_mb', 'History file size in MB')
          CPU_USAGE = Gauge('claude_cpu_usage_percent', 'CPU usage percent')

          def get_history_size():
              try:
                  size = 0
                  with open('/home/j_kro/.claude/history.jsonl', 'rb') as f:
                      f.seek(0, 2)
                      size = f.tell()
                  return size / (1024*1024)
              except:
                  return 0

          if __name__ == '__main__':
              start_http_server(9090)
              while True:
                  ACTIVE_SESSIONS.set(0)
                  HISTORY_SIZE.set(get_history_size())
                  CPU_USAGE.set(psutil.cpu_percent(interval=1))
                  time.sleep(10)
          EOF

          python3 /app/metrics.py

        env:
        - name: HOME
          value: /home/j_kro

        ports:
        - name: metrics
          containerPort: 9090

        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"

        volumeMounts:
        - name: home-dir
          mountPath: /home/j_kro
          readOnly: true

      terminationGracePeriodSeconds: 30
      restartPolicy: Always

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: claude-code-hpa
  namespace: ai-coding
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: claude-code
  minReplicas: 1
  maxReplicas: 4  # One per node max
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 1
        periodSeconds: 30
      selectPolicy: Max
