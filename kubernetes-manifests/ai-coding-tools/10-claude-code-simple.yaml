apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-code
  namespace: ai-inference
  labels:
    app: claude-code
    component: ai-coding-tool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claude-code
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: claude-code
        component: ai-coding-tool
    spec:
      hostNetwork: false  # Don't use host network
      dnsPolicy: ClusterFirst

      volumes:
      # Mount user's home directory
      - name: home-dir
        hostPath:
          path: /home/j_kro
          type: Directory

      # Mount NixOS system paths
      - name: nix-store
        hostPath:
          path: /nix
          type: Directory

      - name: nix-profile
        hostPath:
          path: /nix/var/nix/profiles/default
          type: Directory

      - name: current-system
        hostPath:
          path: /run/current-system
          type: Directory

      containers:
      - name: claude-code-wrapper
        image: busybox:1.36
        command:
        - /bin/sh
        - -c
        - |
          echo "Claude Code pod ready for exec access"
          echo "Home: /home/j_kro"
          echo "Nix store: /nix"
          echo "System: /run/current-system"
          echo ""
          echo "Use: kubectl exec -it $POD_NAME -- /nix/var/nix/profiles/default/bin/claude-code"
          echo ""
          # Keep pod alive
          sleep infinity
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: HOME
          value: /home/j_kro
        - name: USER
          value: j_kro
        - name: PATH
          value: /nix/var/nix/profiles/default/bin:/run/current-system/sw/bin:/usr/bin:/bin

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

        volumeMounts:
        - name: home-dir
          mountPath: /home/j_kro
        - name: nix-store
          mountPath: /nix
          readOnly: true
        - name: nix-profile
          mountPath: /nix/var/nix/profiles/default
          readOnly: true
        - name: current-system
          mountPath: /run/current-system
          readOnly: true

        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - test -f /home/j_kro/.claude.json
          initialDelaySeconds: 10
          periodSeconds: 30

        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - test -f /home/j_kro/.claude.json && test -d /home/j_kro/.claude
          initialDelaySeconds: 5
          periodSeconds: 10

      # Metrics sidecar
      - name: metrics
        image: python:3.11-slim
        command:
        - /bin/sh
        - -c
        - |
          pip install prometheus_client psutil -q
          cat <<'EOF' > /app/metrics.py
          from prometheus_client import start_http_server, Gauge
          import psutil
          import time

          ACTIVE_SESSIONS = Gauge('claude_active_sessions', 'Number of active Claude sessions')
          HISTORY_SIZE = Gauge('claude_history_size_mb', 'History file size in MB')
          CPU_USAGE = Gauge('claude_cpu_usage_percent', 'CPU usage percent')

          def get_history_size():
              try:
                  size = 0
                  with open('/home/j_kro/.claude/history.jsonl', 'rb') as f:
                      f.seek(0, 2)
                      size = f.tell()
                  return size / (1024*1024)
              except:
                  return 0

          if __name__ == '__main__':
              start_http_server(9090)
              while True:
                  ACTIVE_SESSIONS.set(0)  # Placeholder - sessions tracked by wrapper
                  HISTORY_SIZE.set(get_history_size())
                  CPU_USAGE.set(psutil.cpu_percent(interval=1))
                  time.sleep(10)
          EOF

          python3 /app/metrics.py

        env:
        - name: HOME
          value: /home/j_kro

        ports:
        - name: metrics
          containerPort: 9090

        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"

        volumeMounts:
        - name: home-dir
          mountPath: /home/j_kro
          readOnly: true

      terminationGracePeriodSeconds: 30
      restartPolicy: Always
