---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-coding-configs
  namespace: ai-coding
spec:
  accessModes:
    - ReadWriteOnce  # Single node (zephyr)
  storageClassName: fast-local-ssd  # Fast SSD with expansion
  resources:
    requests:
      storage: 10Gi  # Enough for history, projects, etc.
