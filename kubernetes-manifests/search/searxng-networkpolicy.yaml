---
# NetworkPolicy to allow ingress to SearXNG from ai-inference gateway
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-searxng-ingress
  namespace: search
spec:
  podSelector:
    matchLabels:
      app: searxng
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ai-inference
      podSelector:
        matchLabels:
          app: ai-inference-gateway
    ports:
    - protocol: TCP
      port: 8080
