---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: searxng-ingress
  namespace: search
  annotations:
    # NO address annotation - let Caddy auto-discover the correct node IPs
spec:
  rules:
  - host: search.cluster.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: searxng
            port:
              number: 8080
