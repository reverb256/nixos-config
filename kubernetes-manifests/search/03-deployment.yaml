# SearXNG Deployment - single replica on nexus
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: search
  labels:
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
  template:
    metadata:
      labels:
    spec:
      nodeName: nexus
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
        ports:
        - name: http
          containerPort: 8080
        env:
          value: "https://search.cluster.local/"
        - name: INSTANCE_NAME
        - name: PORT
          value: "8080"
        volumeMounts:
        - name: settings
          subPath: settings.yml
          readOnly: true
        - name: data
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "1"
            memory: "512Mi"
      volumes:
      - name: settings
        configMap:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  namespace: search
  labels:
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  selector:
