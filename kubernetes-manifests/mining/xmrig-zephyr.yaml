# XMRig CPU Miner Deployment for Zephyr (32 cores)
# FIXED: Removed readOnlyRootFilesystem, added health probes, fixed YAML structure
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xmrig-zephyr
  namespace: mining
  labels:
    app: xmrig
    host: zephyr
    workload: crypto-mining
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: xmrig
      host: zephyr
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: xmrig
        host: zephyr
        workload: crypto-mining
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/1/summary"
    spec:
      nodeName: zephyr
      serviceAccountName: gpu-miner-sa
      automountServiceAccountToken: false
      priorityClassName: mining-low
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: "workstation"
          operator: "Equal"
          value: "true"
          effect: NoSchedule
        - key: "interactive"
          operator: "Equal"
          value: "true"
          effect: NoExecute
        - key: "ram-constrained"
          operator: "Equal"
          value: "true"
          effect: NoSchedule
      terminationGracePeriodSeconds: 30
      containers:
      - name: xmrig
        image: docker.io/library/xmrig-nixos:latest
        imagePullPolicy: Never
        args:
          - "-o"
          - "xmrig-proxy.mining.svc.cluster.local:3333"  # Using Kubernetes service DNS instead of host IP
          - "-u"
          - "zephyr-cpu"
          - "--tls=false"
          - "--randomx-1gb-pages"
          - "--threads=8"
          - "--donate-level=1"
          - "--api-worker-id=zephyr-cpu"
          - "--http-enabled"
          - "--http-host=0.0.0.0"
          - "--http-port=8081"
        ports:
        - containerPort: 8081
          name: api
          protocol: TCP
        resources:
          requests:
            memory: "1Gi"
            cpu: "4"
          limits:
            memory: "3Gi"
            cpu: "8"
        env:
        - name: XMRIG_NO_TLS
          value: "1"
        livenessProbe:
          httpGet:
            path: /1/summary
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /1/summary
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        securityContext:
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false  # FIXED: xmrig needs write access
          capabilities:
            drop:
            - ALL
            add:
            - IPC_LOCK
        volumeMounts:
        - name: hugepages
          mountPath: /dev/hugepages
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: hugepages
        hostPath:
          path: /dev/hugepages
          type: Directory
      - name: tmp
        emptyDir: {}
