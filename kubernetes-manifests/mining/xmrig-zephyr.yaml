# XMRig CPU Miner Deployment for Zephyr (Ryzen 9 5950X, 16C/32T)
# - privileged for MSR register access (10-30% hashrate improvement)
# - 2MB hugepages for RandomX dataset (1GB pages unavailable in containers)
# - 8 threads, reserves headroom for gaming/interactive workloads
# - GameMode scales gpu-miner-zephyr 0↔1 (RTX 3090 released for gaming)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xmrig-zephyr
  namespace: mining
  labels:
    app: xmrig-zephyr
    host: zephyr
    workload: crypto-mining
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: xmrig-zephyr
      host: zephyr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: xmrig-zephyr
        host: zephyr
        workload: crypto-mining
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: "/1/summary"
    spec:
      nodeName: zephyr
      serviceAccountName: gpu-miner-sa
      automountServiceAccountToken: false
      priorityClassName: mining-low
      hostNetwork: true
      hostIPC: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: "workstation"
          operator: "Equal"
          value: "true"
          effect: NoSchedule
        - key: "interactive"
          operator: "Equal"
          value: "true"
          effect: NoExecute
        - key: "ram-constrained"
          operator: "Equal"
          value: "true"
          effect: NoSchedule
      terminationGracePeriodSeconds: 30
      containers:
      - name: xmrig
        image: xmrig-alpine:6.25.0
        imagePullPolicy: Never
        command:
          - "/bin/sh"
          - "-c"
          - |
            exec /bin/xmrig \
              -o 10.1.1.120:3333 \
              -u zephyr-cpu \
              --threads=8 \
              --donate-level=1 \
              --api-worker-id=zephyr-cpu \
              --http-enabled \
              --http-host=0.0.0.0 \
              --http-port=8082
        ports:
        - containerPort: 8082
          name: api
          protocol: TCP
        resources:
          requests:
            memory: "1Gi"
            cpu: "4"
          limits:
            memory: "4Gi"
            cpu: "8"
        env:
        - name: XMRIG_NO_TLS
          value: "1"
        securityContext:
          privileged: true
        volumeMounts:
        - name: msr
          mountPath: /dev/cpu
          mountPropagation: HostToContainer
        - name: hugepages
          mountPath: /dev/hugepages
          mountPropagation: HostToContainer
        - name: sys-module-msr
          mountPath: /sys/module/msr
          mountPropagation: HostToContainer
        - name: tmp
          mountPath: /tmp
        livenessProbe:
          httpGet:
            path: /1/summary
            port: 8082
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /1/summary
            port: 8082
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: msr
        hostPath:
          path: /dev/cpu
          type: Directory
      - name: hugepages
        hostPath:
          path: /dev/hugepages
          type: Directory
      - name: sys-module-msr
        hostPath:
          path: /sys/module/msr
          type: Directory
      - name: tmp
        emptyDir: {}
