# 4 GPUs: 2x AMD RX 5700 XT (devices 0,1) + 2x NVIDIA RTX 4060 (devices 2,3)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-miner-forge-gpu0
  namespace: mining
  labels:
    app: gpu-miner-forge
    gpu-type: amd
    gpu-id: "0"
    host: forge
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: gpu-miner-forge-gpu0
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: gpu-miner-forge-gpu0
        gpu-type: amd
        gpu-id: "0"
        host: forge
    spec:
      nodeName: forge
      hostNetwork: true
      priorityClassName: mining-low
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        imagePullPolicy: IfNotPresent
        command:
        args:
          - "--algo=CR29"
          - "--pool=xtm-c29-us.kryptex.network:8040"
          - "--user=krxXVNVMM7.forge-a0"
          - "--pass=x"
          - "--tls=1"
          - "--pool=xtm-c29-eu.kryptex.network:8040"
          - "--user=krxXVNVMM7.forge-a0"
          - "--pass=x"
          - "--tls=1"
          - "--devices=0"
          - "--apiport=4070"
        env:
          - name: LD_LIBRARY_PATH
            value: "/run/opengl-driver/lib"
          - name: OCL_ICD_VENDORS
            value: "/etc/OpenCL/vendors"
        ports:
        - containerPort: 4070
          name: api
          protocol: TCP
        securityContext:
          privileged: true
        volumeMounts:
        - name: dri
          mountPath: /dev/dri
        - name: opengl
          mountPath: /run/opengl-driver/lib
          readOnly: true
        - name: nix-store
          mountPath: /nix/store
          readOnly: true
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
            amd.com/gpu: "1"
          limits:
            memory: "4Gi"
            cpu: "2"
            amd.com/gpu: "1"
      volumes:
      - name: dri
        hostPath:
          path: /dev/dri
      - name: opengl
        hostPath:
          path: /run/opengl-driver/lib
      - name: nix-store
        hostPath:
          path: /nix/store
