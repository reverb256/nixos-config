apiVersion: v1
kind: Pod
metadata:
  name: test2
  namespace: mining
spec:
  nodeName: forge
  containers:
  - name: test
    image: docker.io/library/lolminer-amd:1.98a-nixos
    imagePullPolicy: Never
    command: ["/bin/sh"]
    args: ["-c", "ls -la /lib/ | head -30; echo '---'; ls -la /nix/store/ | head -30; sleep 3600"]
    resources:
      requests:
        cpu: "100m"
        memory: "100Mi"
  restartPolicy: Never
