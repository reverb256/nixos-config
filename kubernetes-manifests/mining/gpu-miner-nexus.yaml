# GPU Miner Deployment for Nexus (RTX 3060 Ti)
# Using Volcano scheduler (migrated from YuniKorn)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-miner-nexus
  namespace: mining
  labels:
    app: gpu-miner
    host: nexus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gpu-miner
      host: nexus
  template:
    metadata:
      labels:
        app: gpu-miner
        host: nexus
    spec:
      schedulerName: volcano
      nodeName: nexus
      serviceAccountName: gpu-miner-sa
      hostNetwork: true
      priorityClassName: mining-low
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - nexus
      tolerations:
      - key: "scheduler.yunikorn.io/preemptible"
        operator: "Exists"
      containers:
      - name: lolminer-nvidia
        image: docker.io/swamp7/lolminer:latest
        imagePullPolicy: IfNotPresent
        args:
          - "--algo=CR29"
          - "--pool=xtm-c29-us.kryptex.network:8040"
          - "--user=krxXVNVMM7.nexus-gpu"
          - "--pass=x"
          - "--tls=1"
          - "--pool=xtm-c29-eu.kryptex.network:8040"
          - "--user=krxXVNVMM7.nexus-gpu"
          - "--pass=x"
          - "--tls=1"
          - "--devices=0"
          - "--apiport=4068"
          - "--mode=b"
        env:
        - name: LD_LIBRARY_PATH
          value: "/run/opengl-driver/lib:/nix/store"
        ports:
        - containerPort: 4068
          name: api
          protocol: TCP
        securityContext:
          privileged: true
        volumeMounts:
        - name: nvidia
          mountPath: /run/opengl-driver/lib
          readOnly: true
        - name: dev
          mountPath: /dev
        - name: nix-store
          mountPath: /nix/store
          readOnly: true
        resources:
          requests:
            memory: "4Gi"
            cpu: "2"
            nvidia.com/gpu: "1"
          limits:
            memory: "8Gi"
            cpu: "4"
            nvidia.com/gpu: "1"
      volumes:
      - name: nvidia
        hostPath:
          path: /run/opengl-driver/lib
      - name: dev
        hostPath:
          path: /dev
      - name: nix-store
        hostPath:
          path: /nix/store
