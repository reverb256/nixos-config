# GPU Miner Deployment for Nexus (RTX 3060 Ti)
# - Host NVIDIA driver libs via /nix/store + /run/opengl-driver/lib mounts
# - LD_LIBRARY_PATH includes host driver path for CUDA compatibility
# - Power limit 120W, core 1605 MHz, mem offset +1200
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-miner-nexus
  namespace: mining
  labels:
    app: gpu-miner-nexus
    host: nexus
    workload: crypto-mining
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: gpu-miner-nexus
      host: nexus
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: gpu-miner-nexus
        host: nexus
        workload: crypto-mining
    spec:
      nodeName: nexus
      serviceAccountName: gpu-miner-sa
      automountServiceAccountToken: false
      hostNetwork: true
      priorityClassName: mining-low
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        imagePullPolicy: IfNotPresent
        args:
          - "--algo=CR29"
          - "--pool=xtm-c29-us.kryptex.network:8040"
          - "--user=krxXVNVMM7.nexus-gpu"
          - "--pass=x"
          - "--tls=1"
          - "--pool=xtm-c29-eu.kryptex.network:8040"
          - "--user=krxXVNVMM7.nexus-gpu"
          - "--pass=x"
          - "--tls=1"
          - "--devices=0"
          - "--cclk=1605"
          - "--moff=1200"
          - "--pl=120"
          - "--apiport=4068"
        ports:
        - containerPort: 4068
          name: api
          protocol: TCP
        securityContext:
          privileged: true
        env:
        - name: LD_LIBRARY_PATH
          value: "/run/opengl-driver/lib:/usr/local/cuda-12.1/compat"
        volumeMounts:
        - name: dev
          mountPath: /dev
        - name: nvidia-libs
          mountPath: /run/opengl-driver/lib
          readOnly: true
        - name: nix-store
          mountPath: /nix/store
          readOnly: true
        resources:
          requests:
            memory: "4Gi"
            cpu: "100m"
          limits:
            memory: "8Gi"
            cpu: "1000m"
      volumes:
      - name: dev
        hostPath:
          path: /dev
      - name: nvidia-libs
        hostPath:
          path: /run/opengl-driver/lib
      - name: nix-store
        hostPath:
          path: /nix/store
