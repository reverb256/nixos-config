# XMRig CPU Miner Deployment for Nexus (24 cores)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xmrig-nexus
  namespace: mining
  labels:
    app: xmrig
    host: nexus
    workload: crypto-mining
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: xmrig
      host: nexus
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: xmrig
        host: nexus
        workload: crypto-mining
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/1/summary"
    spec:
      nodeName: nexus
      serviceAccountName: gpu-miner-sa
      automountServiceAccountToken: false
      hostNetwork: true
      priorityClassName: mining-low
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - nexus
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: xmrig
        image: docker.io/library/xmrig-nixos:latest
        imagePullPolicy: Never
        args:
          - "-o"
          - "10.1.1.110:3333"
          - "-u"
          - "nexus-cpu"
          - "--tls=false"
          - "--randomx-1gb-pages"
          - "--threads=6"
          - "--donate-level=1"
          - "--http-enabled"
          - "--http-port=8081"
        ports:
        - containerPort: 8081
          name: api
          protocol: TCP
        resources:
          requests:
            memory: "1Gi"
            cpu: "3"
          limits:
            memory: "3Gi"
            cpu: "6"
        env:
        - name: XMRIG_NO_TLS
          value: "1"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
            add:
              - SYS_NICE  # For CPU affinity
              - IPC_LOCK  # For large pages
        volumeMounts:
        - name: hugepages
          mountPath: /dev/hugepages
      volumes:
      - name: hugepages
        hostPath:
          path: /dev/hugepages
          type: Directory
