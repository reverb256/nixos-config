# XMRig CPU Miner Deployment for Sentry (16 cores)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xmrig-sentry
  namespace: mining
  labels:
    app: xmrig
    host: sentry
    workload: crypto-mining
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: xmrig
      host: sentry
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: xmrig
        host: sentry
        workload: crypto-mining
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/1/summary"
    spec:
      nodeName: sentry
      serviceAccountName: gpu-miner-sa
      automountServiceAccountToken: false
      priorityClassName: mining-low
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - sentry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: xmrig
        image: docker.io/library/xmrig-nixos:latest
        imagePullPolicy: Never
        args:
          - "-o"
          - "xmrig-proxy.mining.svc.cluster.local:3333"  # Using Kubernetes service DNS instead of host IP
          - "-u"
          - "sentry-cpu"
          - "--tls=false"
          - "--randomx-1gb-pages"
          - "--threads=4"
          - "--donate-level=1"
          - "--http-enabled"
          - "--http-host=0.0.0.0"
          - "--http-port=8081"
        ports:
        - containerPort: 8081
          name: api
          protocol: TCP
        resources:
          requests:
            memory: "512Mi"
            cpu: "1"
          limits:
            memory: "4Gi"
            cpu: "2"
        env:
        - name: XMRIG_NO_TLS
          value: "1"
        livenessProbe:
          httpGet:
            path: /1/summary
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /1/summary
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false  # FIXED: xmrig needs write access
          capabilities:
            drop:
              - ALL
            add:
              - SYS_NICE
              - IPC_LOCK
        volumeMounts:
        - name: hugepages
          mountPath: /dev/hugepages
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: hugepages
        hostPath:
          path: /dev/hugepages
          type: Directory
      - name: tmp
        emptyDir: {}
