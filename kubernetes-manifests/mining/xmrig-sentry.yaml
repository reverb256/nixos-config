# XMRig CPU Miner Deployment for Sentry (16 cores)
# - privileged for MSR register access
# - 4 threads (conservative — sentry runs monitoring/logging)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xmrig-sentry
  namespace: mining
  labels:
    app: xmrig-sentry
    host: sentry
    workload: crypto-mining
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: xmrig-sentry
      host: sentry
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: xmrig-sentry
        host: sentry
        workload: crypto-mining
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/1/summary"
    spec:
      nodeName: sentry
      serviceAccountName: gpu-miner-sa
      automountServiceAccountToken: false
      priorityClassName: mining-low
      hostNetwork: true
      hostIPC: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
      - name: xmrig
        image: docker.io/library/xmrig-nixos:latest
        imagePullPolicy: Never
        args:
          - "-o"
          - "10.1.1.120:3333"
          - "-u"
          - "sentry-cpu"
          - "--tls=false"
          - "--threads=4"
          - "--donate-level=1"
          - "--http-enabled"
          - "--http-host=0.0.0.0"
          - "--http-port=8081"
        ports:
        - containerPort: 8081
          name: api
          protocol: TCP
        resources:
          requests:
            memory: "512Mi"
            cpu: "1"
          limits:
            memory: "4Gi"
            cpu: "4"
        env:
        - name: XMRIG_NO_TLS
          value: "1"
        securityContext:
          privileged: true
        volumeMounts:
        - name: msr
          mountPath: /dev/cpu
          mountPropagation: HostToContainer
        - name: hugepages
          mountPath: /dev/hugepages
          mountPropagation: HostToContainer
        - name: sys-module-msr
          mountPath: /sys/module/msr
          mountPropagation: HostToContainer
        - name: tmp
          mountPath: /tmp
        livenessProbe:
          httpGet:
            path: /1/summary
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /1/summary
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: msr
        hostPath:
          path: /dev/cpu
          type: Directory
      - name: hugepages
        hostPath:
          path: /dev/hugepages
          type: Directory
      - name: sys-module-msr
        hostPath:
          path: /sys/module/msr
          type: Directory
      - name: tmp
        emptyDir: {}
