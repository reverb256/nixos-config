# XMRig CPU Miner Deployment for Sentry (16 cores)
# Using Volcano scheduler for consistency with GPU miners
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xmrig-sentry
  namespace: mining
  labels:
    app: xmrig
    host: sentry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xmrig
      host: sentry
  template:
    metadata:
      labels:
        app: xmrig
        host: sentry
    spec:
      schedulerName: volcano
      nodeName: sentry
      serviceAccountName: gpu-miner-sa
      hostNetwork: true
      priorityClassName: preemptible-mining
      containers:
      - name: xmrig
        image: docker.io/swamp7/xmrig:latest
        imagePullPolicy: IfNotPresent
        args:
          - "-o"
          - "10.1.1.110:3333"
          - "-u"
          - "sentry-cpu"
          - "--tls=false"
          - "--randomx-1gb-pages"
          - "--threads=2"
          - "--donate-level=1"
        ports:
        - containerPort: 8081
          name: api
          protocol: TCP
        resources:
          requests:
            memory: "512Mi"
            cpu: "1"
          limits:
            memory: "2Gi"
            cpu: "2"
        env:
        - name: XMRIG_NO_TLS
          value: "1"
