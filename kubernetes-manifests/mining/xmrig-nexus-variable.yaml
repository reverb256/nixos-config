# XMRig Variable CPU Miner - Nexus (6 additional threads, scales to 0 during builds)
# Combined with xmrig-nexus (6 threads) = 12/24 threads (50%)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xmrig-nexus-variable
  namespace: mining
  labels:
    app: xmrig-nexus-variable
    host: nexus
    workload: crypto-mining
    type: variable
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: xmrig-nexus-variable
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: xmrig-nexus-variable
        host: nexus
        workload: crypto-mining
        type: variable
    spec:
      nodeName: nexus
      serviceAccountName: gpu-miner-sa
      automountServiceAccountToken: false
      priorityClassName: preemptible-mining
      hostNetwork: true
      hostIPC: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
      - name: xmrig
        image: docker.io/library/xmrig-alpine:6.25.0
        imagePullPolicy: Never
        args:
          - "-o"
          - "10.1.1.120:3333"
          - "-u"
          - "nexus-cpu-var"
          - "--tls=false"
          - "--threads=6"
          - "--donate-level=1"
          - "--http-enabled"
          - "--http-host=0.0.0.0"
          - "--http-port=8083"
        resources:
          requests:
            memory: "2Gi"
            cpu: "3"
          limits:
            memory: "3Gi"
            cpu: "6"
        securityContext:
          privileged: true
        volumeMounts:
        - name: msr
          mountPath: /dev/cpu
          mountPropagation: HostToContainer
        - name: hugepages
          mountPath: /dev/hugepages
          mountPropagation: HostToContainer
        - name: sys-module-msr
          mountPath: /sys/module/msr
          mountPropagation: HostToContainer
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: msr
        hostPath:
          path: /dev/cpu
          type: Directory
      - name: hugepages
        hostPath:
          path: /dev/hugepages
          type: Directory
      - name: sys-module-msr
        hostPath:
          path: /sys/module/msr
          type: Directory
      - name: tmp
        emptyDir: {}
