# GPU Miner for Forge - NVIDIA GPU 0 (RTX 4060)
# Single pod per GPU for maximum scheduling flexibility
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-miner-forge-nvidia-0
  namespace: mining
  labels:
    app: gpu-miner-forge
    gpu-type: nvidia
    gpu-id: "1"
    host: forge
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: gpu-miner-forge
      gpu-type: nvidia
      gpu-id: "1"
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: gpu-miner-forge
        gpu-type: nvidia
        gpu-id: "1"
        host: forge
        # PSA exemption for privileged GPU mining containers
        pod-security.kubernetes.io/enforce: privileged
    spec:
      nodeName: forge
      serviceAccountName: gpu-miner-sa
      hostNetwork: true
      priorityClassName: mining-low
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - forge
      tolerations:
      containers:
      - name: lolminer
        image: docker.io/swamp7/lolminer:latest
        imagePullPolicy: IfNotPresent
        args:
        - "--algo=CR29"
        - "--pool=xtm-c29-us.kryptex.network:8040"
        - "--user=krxXVNVMM7.forge-n1"
        - "--pass=x"
        - "--tls=1"
        - "--pool=xtm-c29-eu.kryptex.network:8040"
        - "--user=krxXVNVMM7.forge-n1"
        - "--pass=x"
        - "--tls=1"
        - "--devices=1"
        - "--apiport=4069"
        - "--mode=b"
        env:
        - name: LD_LIBRARY_PATH
          value: "/run/opengl-driver/lib:/nix/store"
        ports:
        - containerPort: 4068
          name: api
          protocol: TCP
        securityContext:
          privileged: true
        volumeMounts:
        - name: nvidia
          mountPath: /run/opengl-driver/lib
          readOnly: true
        - name: dev
          mountPath: /dev
        - name: nix-store
          mountPath: /nix/store
          readOnly: true
        resources:
          requests:
            memory: "4Gi"
            cpu: "2"
            nvidia.com/gpu: "1"
            amd.com/gpu: "0"
          limits:
            memory: "8Gi"
            cpu: "4"
            nvidia.com/gpu: "1"
            amd.com/gpu: "0"
      volumes:
      - name: nvidia
        hostPath:
          path: /run/opengl-driver/lib
      - name: dev
        hostPath:
          path: /dev
      - name: nix-store
        hostPath:
          path: /nix/store
