# GPU Miner for Forge - AMD GPU 0 (RX 5700 XT)
# Uses Ubuntu 24.04 (glibc 2.39) + host NixOS mounts for OpenCL/ROCm libraries
# See AMD_OPENCL_DEBUG_REPORT.md for the full debugging story
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-miner-forge-amd-0
  namespace: mining
  labels:
    app: gpu-miner-forge
    gpu-type: amd
    gpu-id: "0"
    host: forge
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: gpu-miner-forge
      gpu-type: amd
      gpu-id: "0"
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: gpu-miner-forge
        gpu-type: amd
        gpu-id: "0"
        host: forge
    spec:
      nodeName: forge
      hostNetwork: true
      serviceAccountName: gpu-miner-sa
      priorityClassName: mining-low
      containers:
      - name: lolminer
        image: docker.io/library/ubuntu:24.04
        command:
        - /nix/store/mpkgc1sk57hmb62qj3dahvmnjag1l3mc-lolminer-1.98a/bin/lolMiner
        args:
        - "--algo=CR29"
        - "--pool=xtm-c29-us.kryptex.network:8040"
        - "--user=krxXVNVMM7.forge-a0"
        - "--pass=x"
        - "--tls=1"
        - "--pool=xtm-c29-eu.kryptex.network:8040"
        - "--user=krxXVNVMM7.forge-a0"
        - "--pass=x"
        - "--tls=1"
        - "--devices=0"
        - "--apiport=4070"
        env:
        - name: LD_LIBRARY_PATH
          value: "/run/opengl-driver/lib"
        # CRITICAL: trailing slash required! lolMiner has a path concatenation bug
        # Without trailing slash: /etc/OpenCL/vendors + amdocl64.icd = /etc/OpenCL/vendorsamdocl64.icd (ENOENT)
        - name: OCL_ICD_VENDORS
          value: "/etc/OpenCL/vendors/"
        ports:
        - containerPort: 4070
          name: api
          protocol: TCP
        livenessProbe:
          exec:
            command: ["/bin/sh", "-c", "pgrep -f lolMiner"]
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command: ["/bin/sh", "-c", "pgrep -f lolMiner"]
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        securityContext:
          privileged: true
        volumeMounts:
        - name: dri
          mountPath: /dev/dri
        - name: kfd
          mountPath: /dev/kfd
        - name: nix-store
          mountPath: /nix/store
          readOnly: true
        - name: opengl-driver
          mountPath: /run/opengl-driver/lib
          readOnly: true
        # CRITICAL: Mount ICD from nix store, NOT from host's /etc/OpenCL/vendors/
        # Host path contains dangling symlinks through /etc/static (NixOS-specific)
        - name: opencl-icd
          mountPath: /etc/OpenCL/vendors
          readOnly: true
        # No memory limits - lolMiner is statically linked (~250MB RSS)
        # but /nix/store mount causes cgroup page accounting to OOM
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            cpu: "2"
      volumes:
      - name: dri
        hostPath:
          path: /dev/dri
      - name: kfd
        hostPath:
          path: /dev/kfd
      - name: nix-store
        hostPath:
          path: /nix/store
      - name: opengl-driver
        hostPath:
          path: /run/opengl-driver/lib
      - name: opencl-icd
        hostPath:
          path: /nix/store/6yvx83sa6iwhr6xnjjlfjg56jnki5mdn-clr-7.2.0-icd/etc/OpenCL/vendors
          type: Directory
