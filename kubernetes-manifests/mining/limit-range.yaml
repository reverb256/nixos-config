# Resource limits for mining namespace
# Note: GPU resources are explicitly set per-pod, not via defaults
apiVersion: v1
kind: LimitRange
metadata:
  name: mining-limits
  namespace: mining
  labels:
    app: gpu-scheduler
spec:
  limits:
  - default:
      cpu: "4"
      memory: 8Gi
    defaultRequest:
      cpu: "2"
      memory: 4Gi
    max:
      cpu: "8"
      memory: 16Gi
      nvidia.com/gpu: "2"
      amd.com/gpu: "2"
    type: Container
