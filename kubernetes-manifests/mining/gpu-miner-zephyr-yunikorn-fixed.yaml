# GPU Miner Deployment for Zephyr (RTX 3060 Ti + RTX 3090)
# VERSION: 2.0 - Security and Operational Hardening
#
# Changes from v1.0:
# - Added serviceAccountName for least-privilege RBAC
# - Fixed health probes (TCP instead of HTTP for lolMiner API)
# - Added semantic versioning for images
# - Added topology spread constraints for HA
# - Added PodDisruptionBudget for maintenance safety
# - Added terminationGracePeriodSeconds for graceful shutdown

---
apiVersion: scheduling.volcano.sh/v1beta1
kind: PodGroup
metadata:
  name: gpu-miner-zephyr-group
  namespace: mining
  labels:
    app: gpu-miner
    host: zephyr
spec:
  # Minimum resources for gang scheduling
  minMember: 1
  minResources:
    nvidia.com/gpu: "2"
    memory: "8Gi"
    cpu: "2"
  # Priority class (low - preemptible by AI)
  priorityClassName: low-priority-mining
  # Queue for mining workloads
  queue: mining-queue
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-miner-zephyr
  namespace: mining
  labels:
    app: gpu-miner
    host: zephyr
    scheduler: yunikorn
    version: "2.0"
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "4068"
    prometheus.io/path: "/metrics"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gpu-miner
      host: zephyr
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: gpu-miner
        host: zephyr
        version: "2.0"
        # PodGroup association for gang scheduling
        scheduling.volcano.sh/pod-group: gpu-miner-zephyr-group
    spec:
      # Use YuniKorn scheduler
      schedulerName: yunikorn
      # ServiceAccount for least-privilege RBAC
      serviceAccountName: gpu-miner-sa
      # Pin to Zephyr node (RTX 3060 Ti + RTX 3090)
      nodeName: zephyr
      # Graceful shutdown period
      terminationGracePeriodSeconds: 30
      # Low priority (preemptible by AI workloads)
      priorityClassName: low-priority-mining
      # Tolerations for control plane and preemption
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      # Allow this pod to be evicted for higher priority pods
      - key: "scheduler.yunikorn.io/preemptible"
        operator: "Exists"
      containers:
      - name: lolminer
        # Note: Using imagePullPolicy: IfNotPresent to allow pulling if needed
        # The lolminer binary from NixOS will be mounted in via hostPath
        image: lolminer:1.98a-nixos
        imagePullPolicy: IfNotPresent
        args:
          - "--algo=CR29"
          - "--pool=stratum+tcp://10.1.1.110:3333"  # Connect to xmrig-proxy service
          - "--user=zephyr-gpu"
          - "--devices=0,1"  # RTX 3060 Ti (GPU 0) + RTX 3090 (GPU 1)
          - "--apiport=4068"
          - "--mode=b"
          - "--tls=1"
        ports:
        - containerPort: 4068
          name: api
          protocol: TCP
        # ✅ FIXED: TCP probe instead of HTTP (lolMiner API is not HTTP-compatible)
        livenessProbe:
          tcpSocket:
            port: api
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: api
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        securityContext:
          privileged: true  # Required for GPU access
        volumeMounts:
        - name: nvidia
          mountPath: /usr/lib/nvidia
        # Enhanced resource requests for YuniKorn scheduling
        resources:
          requests:
            memory: "4Gi"
            cpu: "2"
            nvidia.com/gpu: "2"
          limits:
            memory: "8Gi"
            cpu: "4"
            nvidia.com/gpu: "2"
      volumes:
      - name: nvidia
        hostPath:
          path: /run/current-system/sw/lib/nvidia
