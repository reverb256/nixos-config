# GPU Miner Deployment for Zephyr (RTX 3060 Ti + RTX 3090)
# Mining on RTX 3090 (GPU 1) only - AI on RTX 3060 Ti (GPU 0)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-miner-zephyr
  namespace: mining
  labels:
    app: gpu-miner
    host: zephyr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gpu-miner
      host: zephyr
  template:
    metadata:
      labels:
        app: gpu-miner
        host: zephyr
    spec:
      nodeName: zephyr  # Pin to Zephyr node
      serviceAccountName: gpu-miner-sa
      hostNetwork: true  # Use host network for stratum connection
      priorityClassName: preemptible-mining  # Preemptable by AI workloads
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: lolminer
        image: docker.io/swamp7/lolminer:latest
        imagePullPolicy: IfNotPresent
        args:
          - "--algo=CR29"
          - "--pool=stratum+tcp://10.1.1.110:3333"  # Connect to xmrig-proxy service
          - "--user=zephyr-gpu"
          - "--devices=1"  # RTX 3090 (GPU 1) only - AI on GPU 0
          - "--apiport=4068"
          - "--mode=b"
          - "--tls=1"
        env:
        - name: LD_LIBRARY_PATH
          value: "/run/opengl-driver/lib:/nix/store"
        ports:
        - containerPort: 4068
          name: api
          protocol: TCP
        securityContext:
          privileged: true  # Required for GPU access
        volumeMounts:
        - name: nvidia
          mountPath: /run/opengl-driver/lib
          readOnly: true
        - name: dev
          mountPath: /dev
        - name: nix-store
          mountPath: /nix/store
          readOnly: true
        resources:
          requests:
            memory: "4Gi"
            cpu: "2"
            nvidia.com/gpu: "1"
          limits:
            memory: "8Gi"
            cpu: "4"
            nvidia.com/gpu: "1"
      volumes:
      - name: nvidia
        hostPath:
          path: /run/opengl-driver/lib
      - name: dev
        hostPath:
          path: /dev
      - name: nix-store
        hostPath:
          path: /nix/store
