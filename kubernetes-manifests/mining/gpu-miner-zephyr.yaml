# GPU Miner Deployment for Zephyr (RTX 3070)
# - Disabled: Zephyr is OOM-constrained (31GB RAM running control plane + AI + gaming)
# - When enabled: swamp7/lolminer with host NVIDIA driver mounts
# - Power limit 160W, core 1755 MHz, mem offset +1300
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-miner-zephyr
  namespace: mining
  labels:
    app: gpu-miner-zephyr
    host: zephyr
    workload: crypto-mining
spec:
  replicas: 0
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: gpu-miner-zephyr
      host: zephyr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: gpu-miner-zephyr
        host: zephyr
        workload: crypto-mining
    spec:
      nodeName: zephyr
      serviceAccountName: gpu-miner-sa
      automountServiceAccountToken: false
      hostNetwork: true
      priorityClassName: mining-low
      tolerations:
        - key: workstation
          operator: Exists
      containers:
      - name: lolminer
        image: docker.io/swamp7/lolminer:latest
        imagePullPolicy: IfNotPresent
        args:
          - "--algo=CR29"
          - "--pool=xtm-c29-us.kryptex.network:8040"
          - "--user=krxXVNVMM7.zephyr-gpu"
          - "--pass=x"
          - "--tls=1"
          - "--pool=xtm-c29-eu.kryptex.network:8040"
          - "--user=krxXVNVMM7.zephyr-gpu"
          - "--pass=x"
          - "--tls=1"
          - "--devices=0"
          - "--cclk=1755"
          - "--moff=1300"
          - "--pl=160"
          - "--apiport=4068"
        ports:
        - containerPort: 4068
          name: api
          protocol: TCP
        securityContext:
          privileged: true
        env:
        - name: LD_LIBRARY_PATH
          value: "/run/opengl-driver/lib:/usr/local/cuda-12.1/compat"
        volumeMounts:
        - name: dev
          mountPath: /dev
        - name: nvidia-libs
          mountPath: /run/opengl-driver/lib
          readOnly: true
        - name: nix-store
          mountPath: /nix/store
          readOnly: true
        resources:
          requests:
            memory: "4Gi"
            cpu: "100m"
          limits:
            memory: "8Gi"
            cpu: "1000m"
      volumes:
      - name: dev
        hostPath:
          path: /dev
      - name: nvidia-libs
        hostPath:
          path: /run/opengl-driver/lib
      - name: nix-store
        hostPath:
          path: /nix/store
