# GPU Miner Deployment for Zephyr (RTX 3090 GPU 1)
# - Mines on RTX 3090 only (GPU 1) — RTX 3060 Ti (GPU 0) reserved for AI/gaming
# - Power limit 250W, mem offset +1300 (3090 mining sweet spot)
# - GameMode scales replicas 0↔1 via gaming.nix gamemode hooks
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-miner-zephyr
  namespace: mining
  labels:
    app: gpu-miner-zephyr
    host: zephyr
    workload: crypto-mining
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: gpu-miner-zephyr
      host: zephyr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: gpu-miner-zephyr
        host: zephyr
        workload: crypto-mining
    spec:
      nodeName: zephyr
      serviceAccountName: gpu-miner-sa
      automountServiceAccountToken: false
      hostNetwork: true
      priorityClassName: mining-low
      tolerations:
        - key: workstation
          operator: Exists
        - key: interactive
          operator: Exists
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        imagePullPolicy: IfNotPresent
        args:
          - "--algo=CR29"
          - "--pool=xtm-c29-us.kryptex.network:8040"
          - "--user=krxXVNVMM7.zephyr-gpu"
          - "--pass=x"
          - "--tls=1"
          - "--pool=xtm-c29-eu.kryptex.network:8040"
          - "--user=krxXVNVMM7.zephyr-gpu"
          - "--pass=x"
          - "--tls=1"
          - "--devices=1"
          - "--pl=250"
          - "--moff=1300"
          - "--apiport=4068"
        securityContext:
          privileged: true
        env:
        - name: LD_LIBRARY_PATH
          value: "/run/opengl-driver/lib:/usr/local/cuda-12.1/compat"
        volumeMounts:
        - name: dev
          mountPath: /dev
        - name: nvidia-libs
          mountPath: /run/opengl-driver/lib
          readOnly: true
        - name: nix-store
          mountPath: /nix/store
          readOnly: true
        resources:
          requests:
            memory: "4Gi"
            cpu: "100m"
          limits:
            memory: "8Gi"
            cpu: "1000m"
      volumes:
      - name: dev
        hostPath:
          path: /dev
      - name: nvidia-libs
        hostPath:
          path: /run/opengl-driver/lib
      - name: nix-store
        hostPath:
          path: /nix/store
