apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-miner-forge-nvidia-0
  namespace: mining
  labels:
    app: gpu-miner-forge
    gpu-type: nvidia
    gpu-id: "0"
    host: forge
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: gpu-miner-forge
      gpu-type: nvidia
      gpu-id: "0"
      host: forge
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: gpu-miner-forge
        gpu-type: nvidia
        gpu-id: "0"
        host: forge
        pod-security.kubernetes.io/enforce: privileged
    spec:
      nodeName: forge
      hostNetwork: true
      priorityClassName: mining-low
      containers:
      - name: lolminer
        image: docker.io/swamp7/lolminer:latest
        imagePullPolicy: IfNotPresent
        args:
          - "--algo=CR29"
          - "--pool=xtm-c29-us.kryptex.network:8040"
          - "--user=krxXVNVMM7.forge-n0"
          - "--pass=x"
          - "--tls=1"
          - "--pool=xtm-c29-eu.kryptex.network:8040"
          - "--user=krxXVNVMM7.forge-n0"
          - "--pass=x"
          - "--tls=1"
          - "--devices=0"
          - "--cclk=2350"
          - "--moff=1100"
          - "--pl=90"
          - "--apiport=4068"
        env:
        - name: LD_LIBRARY_PATH
          value: "/run/opengl-driver/lib:/nix/store"
        ports:
        - containerPort: 4068
          name: api
          protocol: TCP
        securityContext:
          privileged: true
        volumeMounts:
        - name: nvidia
          mountPath: /run/opengl-driver/lib
          readOnly: true
        - name: dev
          mountPath: /dev
        - name: nix-store
          mountPath: /nix/store
          readOnly: true
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
            nvidia.com/gpu: "1"
            amd.com/gpu: "0"
          limits:
            memory: "8Gi"
            cpu: "4"
            nvidia.com/gpu: "1"
            amd.com/gpu: "0"
      volumes:
      - name: nvidia
        hostPath:
          path: /run/opengl-driver/lib
      - name: dev
        hostPath:
          path: /dev
      - name: nix-store
        hostPath:
          path: /nix/store
