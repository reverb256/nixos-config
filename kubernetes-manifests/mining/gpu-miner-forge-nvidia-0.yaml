# GPU Miner for Forge - NVIDIA GPU 0 (RTX 4060)
# Single pod per GPU for maximum scheduling flexibility
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-miner-forge-nvidia-0
  namespace: mining
  labels:
    app: gpu-miner-forge
    gpu-type: nvidia
    gpu-id: "0"
    host: forge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gpu-miner-forge
      gpu-type: nvidia
      gpu-id: "0"
  template:
    metadata:
      labels:
        app: gpu-miner-forge
        gpu-type: nvidia
        gpu-id: "0"
        host: forge
    spec:
      schedulerName: yunikorn
      nodeName: forge
      serviceAccountName: gpu-miner-sa
      hostNetwork: true
      priorityClassName: preemptible-mining
      tolerations:
      - key: "scheduler.yunikorn.io/preemptible"
        operator: "Exists"
      containers:
      - name: lolminer
        image: docker.io/swamp7/lolminer:latest
        imagePullPolicy: IfNotPresent
        args:
        - "--algo=CR29"
        - "--pool=xtm-c29-us.kryptex.network:8040"
        - "--user=krxXVNVMM7.forge-n0"
        - "--pass=x"
        - "--tls=1"
        - "--pool=xtm-c29-eu.kryptex.network:8040"
        - "--user=krxXVNVMM7.forge-n0"
        - "--pass=x"
        - "--tls=1"
        - "--devices=0"
        - "--apiport=4068"
        - "--mode=b"
        env:
        - name: LD_LIBRARY_PATH
          value: "/run/opengl-driver/lib:/nix/store"
        ports:
        - containerPort: 4068
          name: api
          protocol: TCP
        securityContext:
          privileged: true
        volumeMounts:
        - name: nvidia
          mountPath: /run/opengl-driver/lib
          readOnly: true
        - name: dev
          mountPath: /dev
        - name: nix-store
          mountPath: /nix/store
          readOnly: true
        resources:
          requests:
            memory: "4Gi"
            cpu: "2"
            nvidia.com/gpu: "1"
            amd.com/gpu: "0"
          limits:
            memory: "8Gi"
            cpu: "4"
            nvidia.com/gpu: "1"
            amd.com/gpu: "0"
      volumes:
      - name: nvidia
        hostPath:
          path: /run/opengl-driver/lib
      - name: dev
        hostPath:
          path: /dev
      - name: nix-store
        hostPath:
          path: /nix/store
