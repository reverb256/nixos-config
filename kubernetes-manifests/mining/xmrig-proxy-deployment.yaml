# Central stratum proxy for all mining workers
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: mining
  labels:
    component: stratum-proxy
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        component: stratum-proxy
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
    spec:
      nodeName: nexus
      hostNetwork: true
      serviceAccountName: gpu-miner-sa
      automountServiceAccountToken: false
      priorityClassName: system-cluster-critical
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

      containers:
          imagePullPolicy: Never
          args:
            - "--no-color"
          ports:
            - containerPort: 3333
              name: stratum
              protocol: TCP
            - containerPort: 8081
              name: api
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: stratum
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: stratum
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: config
              readOnly: true
            - name: secrets
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          securityContext:
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
        - name: secrets
          secret:
            items:
              - key: api-token
                path: api-token
              - key: kryptex-password
                path: pool-password
