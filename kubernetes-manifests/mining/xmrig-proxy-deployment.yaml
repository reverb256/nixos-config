# xmrig-proxy Deployment
# Central stratum proxy for all mining workers
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xmrig-proxy
  namespace: mining
  labels:
    app: xmrig-proxy
    component: stratum-proxy
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: xmrig-proxy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: xmrig-proxy
        component: stratum-proxy
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
    spec:
      nodeName: nexus
      hostNetwork: true
      serviceAccountName: gpu-miner-sa
      automountServiceAccountToken: false
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      # securityContext:
      #   runAsNonRoot: true
      #   runAsUser: 1000
      #   fsGroup: 1000
      containers:
        - name: xmrig-proxy
          image: xmrig-proxy:nixos-6.24.0
          imagePullPolicy: Never
          args:
            - "--config=/etc/xmrig-proxy/config.json"
            - "--no-color"
          ports:
            - containerPort: 3333
              name: stratum
              protocol: TCP
            - containerPort: 8081
              name: api
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: stratum
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: stratum
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/xmrig-proxy
              readOnly: true
            - name: secrets
              mountPath: /etc/xmrig-proxy-secrets
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            # readOnlyRootFilesystem: true  # REMOVED: Proxy needs to write certificates
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: xmrig-proxy-config
        - name: secrets
          secret:
            secretName: xmrig-proxy-secrets
            items:
              - key: api-token
                path: api-token
              - key: pool-password
                path: pool-password
# Service definition moved to xmrig-proxy-service.yaml with proper ClusterIP
