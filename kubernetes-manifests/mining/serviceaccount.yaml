# Service Account for Mining Pods
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpu-miner-sa
  namespace: mining
---
# Role for mining pods (minimal permissions)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gpu-miner-role
  namespace: mining
rules:
  # Allow reading configmaps for configuration
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
# Role binding for the service account
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gpu-miner-rolebinding
  namespace: mining
subjects:
  - kind: ServiceAccount
    name: gpu-miner-sa
    namespace: mining
roleRef:
  kind: Role
  name: gpu-miner-role
  apiGroup: rbac.authorization.k8s.io
