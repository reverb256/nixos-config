---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-assistant-config
  namespace: default
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: fast-local-ssd
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-config
  namespace: default
data:
  TZ: "America/Chicago"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: default
  labels:
    app: home-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: home-assistant
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: home-assistant
    spec:
      nodeSelector:
        kubernetes.io/hostname: sentry  # Target Sentry node
      hostNetwork: true  # Required for USB device discovery and local network access
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: home-assistant
        image: ghcr.io/home-assistant/home-assistant:stable
        imagePullPolicy: IfNotPresent
        env:
        - name: TZ
          valueFrom:
            configMapKeyRef:
              name: home-assistant-config
              key: TZ
        ports:
        - name: http
          containerPort: 8123
          hostPort: 8123
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /config
        # USB device mounts (uncomment and adjust as needed)
        # - name: usb-zigbee
        #   mountPath: /dev/zigbee
        # - name: usb-zwave
        #   mountPath: /dev/zwave
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: home-assistant-config
      # USB device volumes (uncomment and adjust as needed)
      # - name: usb-zigbee
      #   hostPath:
      #     path: /dev/bus/usb/001/002  # Replace with actual device
      # - name: usb-zwave
      #   hostPath:
      #     path: /dev/bus/usb/001/003  # Replace with actual device

---
# Note: Service not needed with hostNetwork=true
# Home Assistant will be accessible on port 8123 on the Sentry node (10.1.1.140:8123)
# If you want a ClusterIP service, uncomment below:
# apiVersion: v1
# kind: Service
# metadata:
#   name: home-assistant
#   namespace: default
# spec:
#   type: ClusterIP
#   ports:
#   - port: 8123
#     targetPort: http
#     protocol: TCP
#   selector:
#     app: home-assistant

---
# Data migration script
# Save this as migrate-ha-data.sh
#!/bin/bash
# Migrate Home Assistant data from systemd to Kubernetes

set -e

echo "=== Home Assistant Data Migration ==="

# 1. Create temporary pod with PVC mounted
echo "Creating temporary pod..."
kubectl run ha-migrate --image=busybox --restart=Never --overrides='
{
  "spec": {
    "containers": [{
      "name": "migrate",
      "image": "busybox",
      "command": ["sleep", "3600"],
      "volumeMounts": [{
        "name": "config",
        "mountPath": /data
      }]
    }],
    "volumes": [{
      "name": "config",
      "persistentVolumeClaim": {
        "claimName": "home-assistant-config"
      }
    }]
  }
}' --namespace=default

# Wait for pod to be ready
echo "Waiting for pod to be ready..."
kubectl wait --for=condition=Ready pod/ha-migrate --timeout=60s --namespace=default

# 2. Copy existing Home Assistant config
echo "Copying Home Assistant configuration..."
kubectl cp /var/lib/hass ha-migrate:/data/ --namespace=default -c migrate

# 3. Clean up temporary pod
echo "Cleaning up..."
kubectl delete pod ha-migrate --namespace=default

echo "=== Migration complete ==="
echo "Verify data: kubectl exec -it deployment/home-assistant -- ls -la /config"
