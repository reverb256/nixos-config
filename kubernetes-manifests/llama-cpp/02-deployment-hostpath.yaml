---
# llama.cpp Deployment using host binary (Fastest for testing)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cpp-qwen
  namespace: ai-inference
  labels:
    app: llama-cpp-qwen
    component: llm-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama-cpp-qwen
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: llama-cpp-qwen
        component: llm-inference
    spec:
      # Node affinity for RTX 3090 on zephyr
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                    - zephyr
      volumes:
        # llama.cpp binary from Nix store
        - name: llama-binary
          hostPath:
            path: /nix/store/75j6cc37k7rb97hfznsw8an3jpaqy3mp-llama-cpp-8244/bin
            type: Directory
        # Model directory from host
        - name: models
          hostPath:
            path: /home/j_kro/.lmstudio/models
            type: Directory
        # Shared memory for performance
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: "4Gi"
        # CUDA libraries from host
        - name: cuda-lib
          hostPath:
            path: /run/opengl-driver
            type: Directory
      containers:
        - name: llama-cpp
          # Use minimal base image
          image: alpine:latest
          imagePullPolicy: IfNotPresent
          command: ["/llama-bin/llama-server"]
          args:
            - "--model"
            - "/models/unsloth/Qwen3.5-2B-GGUF/Qwen3.5-2B-IQ4_NL.gguf"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            - "--ngl"
            - "999"
            - "--ctx-size"
            - "16384"
            - "--threads"
            - "8"
            - "--batch-size"
            - "512"
            - "--ubatch-size"
            - "512"
            - "--flash-attn"
            - "on"
            - "--cache-type-k"
            - "bf16"
            - "--cache-type-v"
            - "bf16"
            - "--metrics"
            - "--port-metrics"
            - "9090"
            - "--temp"
            - "0.7"
            - "--top-k"
            - "40"
            - "--top-p"
            - "0.9"
            - "--embedding"
            - "true"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          resources:
            limits:
              cpu: "8"
              memory: 8Gi
              nvidia.com/gpu: "1"
            requests:
              cpu: "2"
              memory: 4Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: llama-binary
              mountPath: /llama-bin
            - name: models
              mountPath: /models
              readOnly: true
            - name: shm
              mountPath: /dev/shm
            - name: cuda-lib
              mountPath: /run/opengl-driver
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          env:
            - name: LD_LIBRARY_PATH
              value: /run/opengl-driver/lib
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
            - name: LLAMA_CUDA
              value: "1"
            - name: PATH
              value: "/llama-bin:/usr/local/bin:/usr/bin:/bin"
