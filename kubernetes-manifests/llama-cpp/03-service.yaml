---
# Service for llama.cpp Qwen3.5
apiVersion: v1
kind: Service
metadata:
  name: llama-cpp-qwen
  namespace: ai-inference
  labels:
    app: llama-cpp-qwen
    component: llm-inference
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
  selector:
    app: llama-cpp-qwen
