---
# Service for existing llama.cpp running on host
apiVersion: v1
kind: Service
metadata:
  name: llama-cpp-qwen
  namespace: ai-inference
  labels:
    app: llama-cpp-qwen
    component: llm-inference
spec:
  type: ExternalName
  # ExternalName to point to host's llama.cpp service
  externalName: zephyr.tigris-ule.ts.net
  ports:
    - name: http
      port: 8080
      targetPort: 8083
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
