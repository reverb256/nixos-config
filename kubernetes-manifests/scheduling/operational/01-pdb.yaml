# PodDisruptionBudgets for GPU Workloads
# Ensures high availability during node maintenance

---
# PodDisruptionBudget for AI Inference Gateway
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ai-inference-gateway-pdb
  namespace: ai-inference
  labels:
    app: ai-inference-gateway
spec:
  # Ensure at least 1 replica available during maintenance
  minAvailable: 1
  selector:
    matchLabels:
      app: ai-inference-gateway
---
# PodDisruptionBudget for GPU Mining (optional - mining can tolerate disruption)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gpu-miner-pdb
  namespace: mining
  labels:
    app: gpu-miner
spec:
  # Allow all mining pods to be disrupted (maxUnavailable: 100%)
  # Mining is opportunistic, so disruption is acceptable
  maxUnavailable: 100%
  selector:
    matchLabels:
      app: gpu-miner
