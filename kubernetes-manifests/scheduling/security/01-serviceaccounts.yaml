# ServiceAccounts for GPU Scheduler Workloads
# Provides least-privilege identity for each workload type

---
# ServiceAccount for AI Inference Gateway
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-gateway-sa
  namespace: ai-inference
  labels:
    app: ai-inference-gateway
---
# ServiceAccount for GPU Mining Workloads
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpu-miner-sa
  namespace: mining
  labels:
    app: gpu-miner
---
# ServiceAccounts will be created separately in security/01-serviceaccounts.yaml
