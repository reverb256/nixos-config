# Namespaces with Pod Security Standards
# Applies defense-in-depth security policies to all GPU workload namespaces

---
# Mining Namespace with PSS
apiVersion: v1
kind: Namespace
metadata:
  name: mining
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    name: mining
---
# AI Inference Namespace with PSS
apiVersion: v1
kind: Namespace
metadata:
  name: ai-inference
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    name: ai-inference
---
# YuniKorn Namespace with PSS (privileged for admission controller hostNetwork)
apiVersion: v1
kind: Namespace
metadata:
  name: yunikorn
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
    name: yunikorn
---
# Volcano Namespace with PSS (privileged for system components)
apiVersion: v1
kind: Namespace
metadata:
  name: volcano-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
    name: volcano-system
