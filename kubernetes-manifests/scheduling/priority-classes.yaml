---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: agent-critical
value: 1000000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "Agent inference workloads - always runs, can preempt miners"
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: system-infra
value: 500000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "System infrastructure - monitoring, logging, DNS"
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: mining-workload
value: 100
globalDefault: false
preemptionPolicy: Never
description: "Mining pods - preemptible by agents, never preempts others"
