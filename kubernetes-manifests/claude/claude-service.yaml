apiVersion: v1
kind: Service
metadata:
  name: claude-code
  namespace: ai-inference
  labels:
    app: claude-code
  annotations:
    # Enable Prometheus scraping
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: claude-code
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP

  # Session affinity for conversation continuity
  # Sticky sessions ensure user stays with same pod during conversation
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600  # 1 hour
