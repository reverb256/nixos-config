---
# vLLM Deployment with GPU support for Qwen3.5
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen3.5
  namespace: ai-inference
  labels:
    app: vllm-qwen
    component: llm-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-qwen
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: vllm-qwen
        component: llm-inference
    spec:
      # Node affinity for RTX 3090 on zephyr
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - zephyr
      volumes:
        # Model cache PVC
        - name: model-cache
          persistentVolumeClaim:
            claimName: vllm-model-cache
        # Shared memory for tensor parallel inference
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: "8Gi"
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.6.4
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              vllm serve Qwen/Qwen2.5-7B-Instruct \
                --trust-remote-code \
                --enable-chunked-prefill \
                --max-num-batched-tokens 2048 \
                --max-model-len 4096 \
                --tensor-parallel-size 1 \
                --gpu-memory-utilization 0.9 \
                --device cuda \
                --port 8000
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: huggingface-token
                  key: token
                  optional: true
            - name: VLLM_WORKER_MULTIPROC_METHOD
              value: "spawn"
            - name: NVIDIA_VISIBLE_DEVICES
              value: "0"
            - name: CUDA_DEVICE_ORDER
              value: "PCI_BUS_ID"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            limits:
              cpu: "8"
              memory: 16Gi
              nvidia.com/gpu: "1"
            requests:
              cpu: "2"
              memory: 8Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: model-cache
              mountPath: /root/.cache/huggingface
            - name: shm
              mountPath: /dev/shm
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
