---
# Knowledge Fabric Engine Deployment
# Self-hosted knowledge management, search, and research engine
# Built as Nix OCI image via pkgs/knowledge-fabric-image/
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-fabric
  namespace: search
  labels:
    app: knowledge-fabric
    component: knowledge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: knowledge-fabric
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: knowledge-fabric
        component: knowledge
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: nexus
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: knowledge-fabric
        # Audit-flagged image tag. AGENTS.md mandates no :latest, but k3s
        # cannot pull a locally-built image pinned to a SHA it lacks.
        # Coordination required: the upstream knowledge-fabric flake at
        # /data/projects/own/knowledge-fabric must build with a SHA tag
        # matching this manifest, otherwise pod startup will fail.
        # Tracked in TODO: pin to flake input commit (9f3e90153...).
        image: localhost/knowledge-fabric:latest
        imagePullPolicy: Never
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: 8100
          protocol: TCP
        env:
        # Override defaults to use K8s service DNS
        - name: KF_QDRANT_URL
          value: "http://10.1.1.120:6333"
        - name: KF_SEARXNG_URL
          value: "http://searxng.search.svc.cluster.local:7777"
        - name: KF_VALKEY_URL
          value: "valkey://valkey.search.svc.cluster.local:6379/0"
        - name: KF_EMBEDDING_MODEL
          value: "nomic-ai/nomic-embed-text-v2-moe"
        # LLM tiers — direct to host IPs (not in cluster)
        - name: KF_LLM_TIER0_URL
          value: "http://10.1.1.140:1235/v1"
        - name: KF_LLM_TIER1_URL
          value: "http://10.1.1.110:1235/v1"
        - name: KF_LLM_TIER2_URL
          value: "http://10.1.1.110:1234/v1"
        - name: KF_LLM_TIER3_URL
          value: ""
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "4"
            memory: "4Gi"
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: "2Gi"
      tolerations:
      - key: workstation
        operator: Equal
        value: "true"
        effect: NoSchedule
---
apiVersion: v1
kind: Service
metadata:
  name: knowledge-fabric
  namespace: search
  labels:
    app: knowledge-fabric
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8100
    targetPort: 8100
    protocol: TCP
  selector:
    app: knowledge-fabric
