# Memory Monitor CronJob
# Moved from default namespace to monitoring namespace
# Runs memory checks every 5 minutes on Zephyr
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: memory-monitor
  namespace: monitoring
spec:
  schedule: '*/5 * * * *'
  concurrencyPolicy: Allow
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: memory-check
            image: busybox:1.36
            command:
            - /bin/sh
            - /scripts/check-memory.sh
            volumeMounts:
            - name: scripts
              mountPath: /scripts
          nodeName: zephyr
          restartPolicy: OnFailure
          volumes:
          - name: scripts
            configMap:
              name: memory-monitor-script
              defaultMode: 493
