# Gemma 4 26B A4B AWQ-4bit on Zephyr RTX 3090 (24GB)
# MoE: 25.2B total, 3.8B active → ~4B speed
# 17.2GB weights + ~6.8GB KV cache. Preempts gpu-miner-zephyr.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemma-4-26b-zephyr
  namespace: ai-inference
  labels:
    app: gemma-4-26b-zephyr
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gemma-4-26b-zephyr
  template:
    metadata:
      labels:
        app: gemma-4-26b-zephyr
    spec:
      priorityClassName: ai-inference-high
      tolerations:
      - operator: Exists
      nodeSelector:
        kubernetes.io/hostname: zephyr
      containers:
      - name: vllm
        image: vllm/vllm-openai:v0.19.0
        imagePullPolicy: IfNotPresent
        args:
        - --model=/models/gemma-4-26B-A4B-AWQ-4bit
        - --served-model-name=gemma-4-26b
        - --device=cuda
        - --gpu-memory-utilization=0.90
        - --enforce-eager
        - --max-model-len=8192
        - --kv-cache-dtype=auto
        - --max-num-seqs=4
        - --disable-log-requests
        env:
        - name: LD_LIBRARY_PATH
          value: "/nix/store/ia20kw8xkfssyfjmk2kanm5nhxablfyz-nvidia-x11-595.45.04-6.18.13/lib:/usr/local/cuda/lib64"
        - name: CUDA_VISIBLE_DEVICES
          value: "1"
        - name: VLLM_WORKER_MULTIPROC_METHOD
          value: "fork"
        - name: PYTHONUNBUFFERED
          value: "1"
        ports:
        - name: http
          containerPort: 8000
        resources:
          requests:
            cpu: "2"
            memory: "20Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "6"
            memory: "24Gi"
            nvidia.com/gpu: "1"
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 15
          failureThreshold: 40
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 300
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 10
        volumeMounts:
        - name: models
          mountPath: /models
          readOnly: true
        - name: nvidia-driver
          mountPath: /nix/store/ia20kw8xkfssyfjmk2kanm5nhxablfyz-nvidia-x11-595.45.04-6.18.13/lib
          readOnly: true
      volumes:
      - name: models
        hostPath:
          path: /var/lib/vllm-models
          type: Directory
      - name: nvidia-driver
        hostPath:
          path: /nix/store/ia20kw8xkfssyfjmk2kanm5nhxablfyz-nvidia-x11-595.45.04-6.18.13/lib
          type: Directory
      terminationGracePeriodSeconds: 120
---
apiVersion: v1
kind: Service
metadata:
  name: gemma-4-26b-zephyr
  namespace: ai-inference
spec:
  type: ClusterIP
  selector:
    app: gemma-4-26b-zephyr
  ports:
  - port: 8001
    targetPort: 8000
