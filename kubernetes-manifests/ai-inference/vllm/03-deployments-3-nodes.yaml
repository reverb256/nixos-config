        - --device=cuda
        - --gpu-memory-utilization=0.9
        - --max-model-len=16384
        - --dtype=half
        - --enable-chunked-prefill
        - --max-num-seqs=8
        - --disable-log-requests
        env:
        - name: CUDA_VISIBLE_DEVICES
          value: "0"
        - name: LD_LIBRARY_PATH
