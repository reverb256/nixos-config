# vLLM Deployment with YuniKorn Scheduling
# Native GGUF support (v0.6.3+) - no model conversion needed
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen
  namespace: ai-inference
  labels:
    app: vllm-qwen
    component: llm-inference
    backend: vllm
spec:
  replicas: 2  # High availability
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0  # Prevent pod explosion
      maxUnavailable: 1
  selector:
    matchLabels:
      app: vllm-qwen
  template:
    metadata:
      labels:
        app: vllm-qwen
        component: llm-inference
        backend: vllm
      annotations:
        # YuniKorn queue assignment
        scheduling.k8s.io/group-name: "vllm-qwen-podgroup"
    spec:
      # Use YuniKorn scheduler for GPU-aware scheduling
      schedulerName: yunikorn

      # Priority class for GPU preemption (can preempt mining)
      priorityClassName: ai-inference-high

      # YuniKorn-specific annotations
      annotations:
        # Gang scheduling: wait for all pods to be scheduled
        scheduling.volcano.sh/group-name: "vllm-qwen-podgroup"
        # Queue for AI inference workloads
        yunikorn.apache.org/queue: "root.ai-inference"

      # NVIDIA GPU node affinity
      affinity:
        # Prefer Zephyr (RTX 3090 + 3060 Ti) for better performance
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - zephyr  # Best: 2x NVIDIA (RTX 3090 + 3060 Ti)
          - weight: 80
            preference:
              matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - nexus   # Good: 1x NVIDIA (RTX 3060 Ti)
          - weight: 60
            preference:
              matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - forge   # OK: 2x NVIDIA (RTX 4060, but usually mining)

        # Required: Must have NVIDIA GPU
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: nvidia.com/gpu
              operator: Exists
            - key: nvidia.com/gpu
              operator: Gt
              values:
              - "0"

        # Anti-affinity to spread pods across nodes
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - vllm-qwen
              topologyKey: kubernetes.io/hostname

      containers:
      - name: vllm
        image: vllm/vllm-openai:v0.6.3.post1
        imagePullPolicy: IfNotPresent

        command:
        - python3
        - -m
        - vllm.entrypoints.openai.api_server

        args:
        # Model configuration (GGUF format)
        - --model=/models/Qwen3.5-0.8B-Claude-4.6-Opus-Reasoning-Distilled-GGUF
        - --gpu-memory-utilization=0.9
        - --max-model-len=16384
        - --dtype=half

        # Performance optimizations
        - --enable-chunked-prefill
        - --max-num-seqs=8
        - --disable-log-requests

        env:
        # Select first GPU only (multi-GPU support future enhancement)
        - name: CUDA_VISIBLE_DEVICES
          value: "0"

        # vLLM configuration
        - name: VLLM_WORKER_MULTIPROC_METHOD
          value: "fork"

        - name: PYTHONUNBUFFERED
          value: "1"

        ports:
        - name: http
          containerPort: 8000
          protocol: TCP

        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "8"
            memory: "8Gi"
            nvidia.com/gpu: "1"

        volumeMounts:
        # Mount GGUF model directory
        - name: models
          mountPath: /models
          readOnly: true

        # Startup probe (vLLM takes time to load model)
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30  # 5 minutes total

        # Liveness probe
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

        # Readiness probe
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

      volumes:
      # GGUF models from host
      - name: models
        hostPath:
          path: /home/j_kro/.lmstudio/models/Jackrong/Qwen3.5-0.8B-Claude-4.6-Opus-Reasoning-Distilled-GGUF
          type: Directory

      # Restart policy
      restartPolicy: Always

      # Termination grace period
      terminationGracePeriodSeconds: 30

---
# HorizontalPodAutoscaler (for future use when inference demand increases)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vllm-qwen-hpa
  namespace: ai-inference
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vllm-qwen
  minReplicas: 2
  maxReplicas: 4
  metrics:
  # Scale based on GPU utilization (when custom metrics available)
  - type: Resource
    resource:
      name: nvidia.com/gpu
      target:
        type: Utilization
        averageUtilization: 80
  # Scale based on CPU
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # Wait 5 min before scaling down
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0  # Scale up immediately
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 1
        periodSeconds: 30
      selectPolicy: Max
