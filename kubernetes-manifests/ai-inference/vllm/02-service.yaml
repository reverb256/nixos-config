# vLLM Service
# ClusterIP service for internal cluster access
apiVersion: v1
kind: Service
metadata:
  name: vllm-qwen
  namespace: ai-inference
  labels:
    app: vllm-qwen
  annotations:
    # Promotes to Caddy Ingress for external access
    caddy.ingress.hostname: "vllm.cluster.local"
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: vllm-qwen
