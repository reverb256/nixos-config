# Istio Service Mesh Configuration for AI Inference
---
# Enable mTLS for the entire mesh (strict mode)
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: istio-system
spec:
  mtls:
    mode: STRICT
---
# Enable mTLS for ai-inference namespace
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: ai-inference-mtls
  namespace: ai-inference
spec:
  mtls:
    mode: STRICT
---
# Allow plain text for services that don't have sidecar yet
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: llama-cpp-permissive
  namespace: ai-inference
spec:
  selector:
    matchLabels:
      app: llama-cpp
  mtls:
    mode: PERMISSIVE
---
# Gateway for external access
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: ai-gateway-gateway
  namespace: ai-inference
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*"
---
# VirtualService for AI Gateway
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: ai-gateway
  namespace: ai-inference
spec:
  hosts:
  - "*"
  gateways:
  - ai-gateway-gateway
  http:
  - match:
    - uri:
        prefix: /v1
    route:
    - destination:
        host: ai-gateway
        port:
          number: 8080
---
# DestinationRule for AI Gateway with circuit breaking
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: ai-gateway
  namespace: ai-inference
spec:
  host: ai-gateway
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
        connectTimeout: 30s
        tcpKeepalive:
          time: 7200s
          interval: 75s
    outlierDetection:
      consecutiveGatewayErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      minHealthPercent: 40
---
# ServiceEntry for llama.cpp backend (hostNetwork service)
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: llama-cpp-external
  namespace: ai-inference
spec:
  hosts:
  - "zephyr.lan"
  location: MESH_EXTERNAL
  ports:
  - number: 8083
    name: http
    protocol: HTTP
  resolution: DNS
  endpoints:
  - address: 10.1.1.110
---
# VirtualService for llama.cpp backend
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: llama-cpp
  namespace: ai-inference
spec:
  hosts:
  - "llama-cpp.ai-inference.svc.cluster.local"
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: zephyr.lan
        port:
          number: 8083
    timeout: 300s
---
# Authorization policy to allow ai-gateway to talk to llama.cpp
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: ai-gateway-to-llamacpp
  namespace: ai-inference
spec:
  selector:
    matchLabels:
      app: ai-gateway
  action:
    ALLOW
  rules:
  - from:
    - source:
        namespaces: ["ai-inference"]
  to:
    - operation:
        methods: ["GET", "POST", "PUT", "DELETE"]
    when:
    - key: connection.name
      values: ["llama-cpp*"]
---
# EnvoyFilter for circuit breaking metrics
apiVersion: networking.istio.io/v1
kind: EnvoyFilter
metadata:
  name: ai-gateway-circuit-breaker
  namespace: ai-inference
spec:
  workloadSelector:
    labels:
      app: ai-gateway
  configPatches:
  - applyTo: NETWORK_FILTER
    match:
      context: CLUSTER
    patch:
      operation: INSERT_BEFORE
      value:
        name: envoy.filters.local.ratelimit
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
          stat_prefix: http_local_ratelimit
          token_bucket:
            max_tokens: 1000
            tokens_per_fill: 100
            fill_interval: "1s"
            filter_enabled:
              runtime_key: local_rate_limit
  - applyTo: CLUSTER
    match:
      context: CLUSTER
    patch:
      operation: INSERT_BEFORE
      value:
        name: envoy.filters.http.circuit_breaker
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.http.circuit_breaker.v3.CircuitBreaker
          stat_prefix: circuit_breaker
          retryOptions:
            numRetries: 3
            retriableStatusCodes:
            - 503
            - 503
            504
          timeout: 30s
