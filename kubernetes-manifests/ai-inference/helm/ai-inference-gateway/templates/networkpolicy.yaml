{{/*
AI Inference Gateway — NetworkPolicy
*/}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ai-inference-gateway.fullname" . }}-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-inference-gateway.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ai-inference-gateway.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    # Allow DNS
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # Allow backend inference engines
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8083
    # Allow Qdrant
    - ports:
        - protocol: TCP
          port: 6333
    # Allow Redis
    - ports:
        - protocol: TCP
          port: 6379
    # Allow external APIs (ZAI, NIM, etc.)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ai-inference-gateway.fullname" . }}-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-inference-gateway.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ai-inference-gateway.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.gateway.port }}
        {{- if .Values.monitoring.enabled }}
        - protocol: TCP
          port: {{ .Values.monitoring.port }}
        {{- end }}
{{- end }}
