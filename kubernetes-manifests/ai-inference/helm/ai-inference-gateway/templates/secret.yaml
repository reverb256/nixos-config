{{/*
AI Inference Gateway — Secret
Secrets are managed externally (agenix/vault). This template creates
an empty secret that can be populated via --set or sealed-secrets.
*/}}
{{- if or .Values.zai.enabled .Values.nvidiaNim.enabled .Values.pollinations.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-inference-gateway.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-inference-gateway.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.zai.enabled }}
  zai-api-key: {{ .Values.zai.apiKey | default "" | b64enc | quote }}
  {{- end }}
  {{- if .Values.nvidiaNim.enabled }}
  nvidia-nim-api-key: {{ .Values.nvidiaNim.apiKey | default "" | b64enc | quote }}
  {{- end }}
  {{- if .Values.pollinations.enabled }}
  pollinations-api-key: {{ .Values.pollinations.apiKey | default "" | b64enc | quote }}
  {{- end }}
{{- end }}
