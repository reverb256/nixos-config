---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-fabric-api
  namespace: ai-inference
  labels:
    app: knowledge-fabric-api
    component: brain
spec:
  replicas: 1
  selector:
    matchLabels:
      app: knowledge-fabric-api
  template:
    metadata:
      labels:
        app: knowledge-fabric-api
        component: brain
    spec:
      nodeName: nexus
      containers:
      - name: api
        image: python:3.12-slim
        command:
          - python3
          - -c
          - |
            from http.server import HTTPServer, BaseHTTPRequestHandler
            import json
            class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                self.send_response(200)
                self.send_header('Content-Type', 'application/json')
                self.end_headers()
                self.wfile.write(b'{"status": "healthy"}')
              def do_POST(self):
                if self.path == '/brain/query':
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(json.dumps({"results": [], "status": "ready"}).encode())
                else:
                  self.send_response(404)
                  self.end_headers()
              def log_message(self, format, *args):
                print(f"[brain] {format % args}")
            print("Starting brain API on 3000")
            HTTPServer(('0.0.0.0', 3000), Handler).serve_forever()
        ports:
        - containerPort: 3000
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: knowledge-fabric-api
  namespace: ai-inference
spec:
  ports:
  - port: 3000
    targetPort: 3000
  selector:
    app: knowledge-fabric-api