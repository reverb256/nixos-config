apiVersion: v1
kind: Service
metadata:
  name: llama-cpp-qwen
  namespace: ai-inference
  labels:
    app: llama-cpp
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
    - port: 9090
      targetPort: 9090
      protocol: TCP
      name: metrics
---
apiVersion: v1
kind: Endpoints
metadata:
  name: llama-cpp-qwen
  namespace: ai-inference
subsets:
  - addresses:
    - ip: 10.1.1.120  # Nexus host IP where llama.cpp runs
    ports:
      - port: 8080
        name: http
        protocol: TCP
      - port: 9090
        name: metrics
        protocol: TCP
