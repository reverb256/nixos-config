apiVersion: v1
kind: Namespace
metadata:
  name: autoresearch
  labels:
    name: autoresearch
    purpose: llm-evaluation

---
apiVersion: v1
kind: Endpoints
metadata:
  name: llama-server
  namespace: autoresearch
subsets:
  - addresses:
    - ip: 10.1.1.120  # Nexus host IP
    ports:
    - port: 8080
      name: http
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: llama-server
  namespace: autoresearch
  labels:
    app: llama-server
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
