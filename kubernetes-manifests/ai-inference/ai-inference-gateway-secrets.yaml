# Secret for AI Inference Gateway
# IMPORTANT: Update 'zai-api-key' with your actual ZAI API key
# 
# To update the secret:
# kubectl create secret generic ai-inference-gateway-secrets \
#   --from-literal=zai-api-key='YOUR_API_KEY_HERE' \
#   --namespace=ai-inference \
#   --dry-run=client -o yaml | kubectl apply -f -
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-inference-gateway-secrets
  namespace: ai-inference
type: Opaque
stringData:
  # Placeholder - replace with your actual ZAI API key
  zai-api-key: "YOUR_ZAI_API_KEY_HERE"
