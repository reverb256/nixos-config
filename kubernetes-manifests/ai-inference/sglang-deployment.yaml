# SGLang Multi-GPU Inference Deployment
# Advanced inference with RadixAttention and multi-node support
---
apiVersion: v1
kind: Namespace
metadata:
  name: ai-inference
  labels:
    app: ai-inference
    tier: backend

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sglang-config
  namespace: ai-inference
data:
  MODEL_PATH: "Qwen/Qwen3.5-4B"
  TENSOR_PARALLEL_SIZE: "2"
  CONTEXT_LENGTH: "32768"
  TP_SIZE: "2"
  CHUNKED_PREFILL_SIZE: "8192"

---
apiVersion: v1
kind: Service
metadata:
  name: sglang-inference
  namespace: ai-inference
  labels:
    app: sglang
    component: inference
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  selector:
    app: sglang

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sglang-inference
  namespace: ai-inference
  labels:
    app: sglang
    component: inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sglang
  template:
    metadata:
      labels:
        app: sglang
        component: inference
    spec:
      nodeName: zephyr  # Schedule on Zephyr (2 GPUs available)
      containers:
      - name: sglang
        image: lmsysorg/sglang:v0.4.1
        command:
        - python3
        - -m
        - sglang.launch_server
        args:
        - --model-path=$(MODEL_PATH)
        - --tp=$(TP_SIZE)
        - --context-length=$(CONTEXT_LENGTH)
        - --host=0.0.0.0
        - --port=8000
        - --chunked-prefill-size=$(CHUNKED_PREFILL_SIZE)
        env:
        - name: MODEL_PATH
          valueFrom:
            configMapKeyRef:
              name: sglang-config
              key: MODEL_PATH
        - name: TP_SIZE
          valueFrom:
            configMapKeyRef:
              name: sglang-config
              key: TP_SIZE
        - name: CONTEXT_LENGTH
          valueFrom:
            configMapKeyRef:
              name: sglang-config
              key: CONTEXT_LENGTH
        - name: CHUNKED_PREFILL_SIZE
          valueFrom:
            configMapKeyRef:
              name: sglang-config
              key: CHUNKED_PREFILL_SIZE
        - name: CUDA_VISIBLE_DEVICES
          value: "0,1"  # Use both GPUs on Zephyr
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: NCCL_DEBUG
          value: "WARN"
        - name: NCCL_IB_DISABLE
          value: "1"  # Disable InfiniBand for heterogeneous GPUs
        resources:
          requests:
            nvidia.com/gpu: "2"
            memory: "8Gi"
            cpu: "4"
          limits:
            nvidia.com/gpu: "2"
            memory: "24Gi"
            cpu: "8"
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: model-cache
          mountPath: /models
        - name: shm
          mountPath: /dev/shm
      volumes:
      - name: model-cache
        hostPath:
          path: /var/cache/ai-inference
          type: DirectoryOrCreate
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
      priorityClassName: high-priority

---
# ServiceMonitor for Prometheus
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sglang-inference
  namespace: ai-inference
  labels:
    app: sglang
spec:
  selector:
    matchLabels:
      app: sglang
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
