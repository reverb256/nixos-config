---
# AI Inference Gateway - Kubernetes Deployment on Nexus
# Complete migration from NixOS systemd service
#
# PREREQUISITE: The local image must be loaded on nexus:
#   nix build .#ai-inference-gateway-image
#   result | podman load
#   podman tag ai-inference-gateway:latest ai-inference-gateway:local
#   (Or use ctr -n k8s.io images import for containerd)

apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-inference-gateway
  namespace: ai-inference
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-inference-gateway-config
  namespace: ai-inference
data:
  # Backend configuration (primary: local llama.cpp, fallback: ZAI)
  BACKEND_URL: "http://zephyr.lan:8081"
  BACKEND_TYPE: "llama-cpp"
  BACKEND_FALLBACK_URLS: "https://api.z.ai/api/coding/paas/v4"

  # Gateway configuration
  GATEWAY_HOST: "0.0.0.0"
  PORT: "8080"
  AUTH_MODE: "api-key"

  # Routing
  ROUTING_ENABLED: "true"
  DEFAULT_MODEL: "qwen3.5-35b-a3b"

  # Rate limiting
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_RPM: "120"
  MAX_REQUEST_SIZE: "10485760"

  # Security
  SECURITY_PROXY_ENABLED: "false"

  # MCP configuration
  MCP_ENABLED: "true"
  MCP_SERVERS: '{
    "searxng": {
      "command": ["python", "-m", "ai_inference_gateway.mcp_servers.searxng_server"],
      "environment": {
        "SEARXNG_URL": "http://searxng.search.svc.cluster.local:8080",
        "SEARXNG_CACHE_TTL": "300"
      },
      "enabled": true,
      "type": "local"
    }
  }'

  # RAG configuration
  RAG_ENABLED: "false"
  QDRANT_URL: "http://qdrant.ai-inference.svc.cluster.local:6333"
  EMBEDDING_MODEL: "sentence-transformers/all-MiniLM-L6-v2"
  CHUNK_SIZE: "512"
  CHUNK_OVERLAP: "50"
  RAG_TOP_K: "10"
  HYBRID_SEARCH_ENABLED: "true"
  VECTOR_WEIGHT: "0.7"
  BM25_WEIGHT: "0.3"
  AUTO_RAG_ENABLED: "true"
  TOKEN_SCOPED_COLLECTIONS: "true"

  # Knowledge Fabric (disabled for non-RAG requests to reduce TTFT)
  MIDDLEWARE__KNOWLEDGE_FABRIC__ENABLED: "false"
  MIDDLEWARE__KNOWLEDGE_FABRIC__RRF_K: "60"
  MIDDLEWARE__KNOWLEDGE_FABRIC__RAG_ENABLED: "true"
  MIDDLEWARE__KNOWLEDGE_FABRIC__CODE_SEARCH_ENABLED: "true"
  MIDDLEWARE__KNOWLEDGE_FABRIC__SEARXNG_ENABLED: "true"
  MIDDLEWARE__KNOWLEDGE_FABRIC__SEARXNG_URL: "http://searxng.search.svc.cluster.local:8080"
  MIDDLEWARE__KNOWLEDGE_FABRIC__SEARXNG_MAX_RESULTS: "10"
  MIDDLEWARE__KNOWLEDGE_FABRIC__WEB_SEARCH_ENABLED: "true"
  MIDDLEWARE__KNOWLEDGE_FABRIC__WEB_MAX_RESULTS: "10"
  MIDDLEWARE__KNOWLEDGE_FABRIC__CODE_MAX_RESULTS: "10"
  MIDDLEWARE__KNOWLEDGE_FABRIC__CODE_SEARCH_PATHS: '["/etc/nixos","/home/j_kro"]'
  MIDDLEWARE__KNOWLEDGE_FABRIC__RAG_TOP_K: "10"

  # Cache
  TRANSFORMERS_CACHE: "/var/cache/ai-inference"
  HF_HOME: "/var/cache/ai-inference"

  # Monitoring
  # Sentry error tracking - disabled (no Sentry/GlitchTip instance)
  SENTRY_ENABLED: "false"

  # System prompts
  SYSTEM_PROMPTS_ENABLED: "true"
  SYSTEM_PROMPTS_DEFAULT: "You are a helpful AI assistant with access to comprehensive knowledge sources."
  SYSTEM_PROMPTS_REASONING: "You are an expert reasoning assistant. Think step-by-step and provide clear explanations backed by retrieved information."
  SYSTEM_PROMPTS_ANALYSIS: "You are an expert analysis assistant. Provide thorough and structured analysis using multiple sources."
  SYSTEM_PROMPTS_AGENTIC: "You are an autonomous agent capable of multi-step planning and execution. Use available tools to complete complex tasks."
  SYSTEM_PROMPTS_FAST: "You are a fast and efficient assistant. Provide concise, direct answers."

  PYTHONUNBUFFERED: "1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-inference-gateway
  namespace: ai-inference
  labels:
    app: ai-inference-gateway
    version: "v2.0.0"
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: ai-inference-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: ai-inference-gateway
        version: "v2.0.0"
    spec:
      serviceAccountName: ai-inference-gateway
      nodeName: nexus
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: gateway
        image: ai-inference-gateway:local
        imagePullPolicy: Never  # Use local Nix-built image
        command:
          - "uvicorn"
          - "ai_inference_gateway.main:app"
          - "--host"
          - "0.0.0.0"
          - "--port"
          - "8080"
          - "--log-level"
          - "info"
        env:
          - name: PORT
            valueFrom:
              configMapKeyRef:
                name: ai-inference-gateway-config
                key: PORT
          - name: GATEWAY_HOST
            valueFrom:
              configMapKeyRef:
                name: ai-inference-gateway-config
                key: GATEWAY_HOST
          - name: AUTH_MODE
            valueFrom:
              configMapKeyRef:
                name: ai-inference-gateway-config
                key: AUTH_MODE
          - name: API_KEYS_FILE
            value: "/run/ai-inference/api-keys.txt"
          - name: BACKEND_URL
            valueFrom:
              configMapKeyRef:
                name: ai-inference-gateway-config
                key: BACKEND_URL
          - name: BACKEND_TYPE
            valueFrom:
              configMapKeyRef:
                name: ai-inference-gateway-config
                key: BACKEND_TYPE
          - name: ZAI_API_KEY
            valueFrom:
              secretKeyRef:
                name: ai-inference-gateway-secrets
                key: zai-api-key
                optional: true
          - name: BACKEND_FALLBACK_URLS
            valueFrom:
              configMapKeyRef:
                name: ai-inference-gateway-config
                key: BACKEND_FALLBACK_URLS
          - name: ROUTING_ENABLED
            valueFrom:
              configMapKeyRef:
                name: ai-inference-gateway-config
                key: ROUTING_ENABLED
          - name: DEFAULT_MODEL
            valueFrom:
              configMapKeyRef:
                name: ai-inference-gateway-config
                key: DEFAULT_MODEL
          - name: RATE_LIMIT_ENABLED
            valueFrom:
              configMapKeyRef:
                name: ai-inference-gateway-config
                key: RATE_LIMIT_ENABLED
          - name: RATE_LIMIT_RPM
            valueFrom:
              configMapKeyRef:
                name: ai-inference-gateway-config
                key: RATE_LIMIT_RPM
          - name: MAX_REQUEST_SIZE
            valueFrom:
              configMapKeyRef:
                name: ai-inference-gateway-config
                key: MAX_REQUEST_SIZE
          - name: SECURITY_PROXY_ENABLED
            valueFrom:
              configMapKeyRef:
                name: ai-inference-gateway-config
                key: SECURITY_PROXY_ENABLED
          - name: MCP_ENABLED
            valueFrom:
              configMapKeyRef:
                name: ai-inference-gateway-config
                key: MCP_ENABLED
          - name: MCP_SERVERS
            valueFrom:
              configMapKeyRef:
                name: ai-inference-gateway-config
                key: MCP_SERVERS
          - name: RAG_ENABLED
            valueFrom:
              configMapKeyRef:
                name: ai-inference-gateway-config
                key: RAG_ENABLED
          - name: QDRANT_URL
            valueFrom:
              configMapKeyRef:
                name: ai-inference-gateway-config
                key: QDRANT_URL
          - name: EMBEDDING_MODEL
            valueFrom:
              configMapKeyRef:
                name: ai-inference-gateway-config
                key: EMBEDDING_MODEL
          - name: CHUNK_SIZE
            valueFrom:
              configMapKeyRef:
                name: ai-inference-gateway-config
                key: CHUNK_SIZE
          - name: CHUNK_OVERLAP
            valueFrom:
              configMapKeyRef:
                name: ai-inference-gateway-config
                key: CHUNK_OVERLAP
          - name: RAG_TOP_K
            valueFrom:
              configMapKeyRef:
                name: ai-inference-gateway-config
                key: RAG_TOP_K
          - name: HYBRID_SEARCH_ENABLED
            valueFrom:
              configMapKeyRef:
                name: ai-inference-gateway-config
                key: HYBRID_SEARCH_ENABLED
          - name: VECTOR_WEIGHT
            valueFrom:
              configMapKeyRef:
                name: ai-inference-gateway-config
                key: VECTOR_WEIGHT
          - name: BM25_WEIGHT
            valueFrom:
              configMapKeyRef:
                name: ai-inference-gateway-config
                key: BM25_WEIGHT
          - name: AUTO_RAG_ENABLED
            valueFrom:
              configMapKeyRef:
                name: ai-inference-gateway-config
                key: AUTO_RAG_ENABLED
          - name: TOKEN_SCOPED_COLLECTIONS
            valueFrom:
              configMapKeyRef:
                name: ai-inference-gateway-config
                key: TOKEN_SCOPED_COLLECTIONS
          - name: TRANSFORMERS_CACHE
            valueFrom:
              configMapKeyRef:
                name: ai-inference-gateway-config
                key: TRANSFORMERS_CACHE
          - name: HF_HOME
            valueFrom:
              configMapKeyRef:
                name: ai-inference-gateway-config
                key: HF_HOME
          - name: SENTRY_ENABLED
            valueFrom:
              configMapKeyRef:
                name: ai-inference-gateway-config
                key: SENTRY_ENABLED
          - name: SYSTEM_PROMPTS_ENABLED
            valueFrom:
              configMapKeyRef:
                name: ai-inference-gateway-config
                key: SYSTEM_PROMPTS_ENABLED
          - name: SYSTEM_PROMPTS_DEFAULT
            valueFrom:
              configMapKeyRef:
                name: ai-inference-gateway-config
                key: SYSTEM_PROMPTS_DEFAULT
          - name: SYSTEM_PROMPTS_REASONING
            valueFrom:
              configMapKeyRef:
                name: ai-inference-gateway-config
                key: SYSTEM_PROMPTS_REASONING
          - name: SYSTEM_PROMPTS_ANALYSIS
            valueFrom:
              configMapKeyRef:
                name: ai-inference-gateway-config
                key: SYSTEM_PROMPTS_ANALYSIS
          - name: SYSTEM_PROMPTS_AGENTIC
            valueFrom:
              configMapKeyRef:
                name: ai-inference-gateway-config
                key: SYSTEM_PROMPTS_AGENTIC
          - name: SYSTEM_PROMPTS_FAST
            valueFrom:
              configMapKeyRef:
                name: ai-inference-gateway-config
                key: SYSTEM_PROMPTS_FAST
          - name: PYTHONUNBUFFERED
            valueFrom:
              configMapKeyRef:
                name: ai-inference-gateway-config
                key: PYTHONUNBUFFERED
          # Required for PyTorch cache directory
          - name: HOME
            value: /home/ai-gateway
          - name: USER
            value: ai-gateway
          - name: TORCHINDUCTOR_CACHE_DIR
            value: /var/cache/ai-inference/torch-cache
          # Knowledge Fabric environment variables
          - name: MIDDLEWARE__KNOWLEDGE_FABRIC__ENABLED
            valueFrom:
              configMapKeyRef:
                name: ai-inference-gateway-config
                key: MIDDLEWARE__KNOWLEDGE_FABRIC__ENABLED
          - name: MIDDLEWARE__KNOWLEDGE_FABRIC__RRF_K
            valueFrom:
              configMapKeyRef:
                name: ai-inference-gateway-config
                key: MIDDLEWARE__KNOWLEDGE_FABRIC__RRF_K
          - name: MIDDLEWARE__KNOWLEDGE_FABRIC__RAG_ENABLED
            valueFrom:
              configMapKeyRef:
                name: ai-inference-gateway-config
                key: MIDDLEWARE__KNOWLEDGE_FABRIC__RAG_ENABLED
          - name: MIDDLEWARE__KNOWLEDGE_FABRIC__CODE_SEARCH_ENABLED
            valueFrom:
              configMapKeyRef:
                name: ai-inference-gateway-config
                key: MIDDLEWARE__KNOWLEDGE_FABRIC__CODE_SEARCH_ENABLED
          - name: MIDDLEWARE__KNOWLEDGE_FABRIC__SEARXNG_ENABLED
            valueFrom:
              configMapKeyRef:
                name: ai-inference-gateway-config
                key: MIDDLEWARE__KNOWLEDGE_FABRIC__SEARXNG_ENABLED
          - name: MIDDLEWARE__KNOWLEDGE_FABRIC__SEARXNG_URL
            valueFrom:
              configMapKeyRef:
                name: ai-inference-gateway-config
                key: MIDDLEWARE__KNOWLEDGE_FABRIC__SEARXNG_URL
          - name: MIDDLEWARE__KNOWLEDGE_FABRIC__SEARXNG_MAX_RESULTS
            valueFrom:
              configMapKeyRef:
                name: ai-inference-gateway-config
                key: MIDDLEWARE__KNOWLEDGE_FABRIC__SEARXNG_MAX_RESULTS
          - name: MIDDLEWARE__KNOWLEDGE_FABRIC__WEB_SEARCH_ENABLED
            valueFrom:
              configMapKeyRef:
                name: ai-inference-gateway-config
                key: MIDDLEWARE__KNOWLEDGE_FABRIC__WEB_SEARCH_ENABLED
          - name: MIDDLEWARE__KNOWLEDGE_FABRIC__WEB_MAX_RESULTS
            valueFrom:
              configMapKeyRef:
                name: ai-inference-gateway-config
                key: MIDDLEWARE__KNOWLEDGE_FABRIC__WEB_MAX_RESULTS
          - name: MIDDLEWARE__KNOWLEDGE_FABRIC__CODE_MAX_RESULTS
            valueFrom:
              configMapKeyRef:
                name: ai-inference-gateway-config
                key: MIDDLEWARE__KNOWLEDGE_FABRIC__CODE_MAX_RESULTS
          - name: MIDDLEWARE__KNOWLEDGE_FABRIC__CODE_SEARCH_PATHS
            valueFrom:
              configMapKeyRef:
                name: ai-inference-gateway-config
                key: MIDDLEWARE__KNOWLEDGE_FABRIC__CODE_SEARCH_PATHS
          - name: MIDDLEWARE__KNOWLEDGE_FABRIC__RAG_TOP_K
            valueFrom:
              configMapKeyRef:
                name: ai-inference-gateway-config
                key: MIDDLEWARE__KNOWLEDGE_FABRIC__RAG_TOP_K
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 45
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 5
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false  # Needs write access for cache
          capabilities:
            drop:
              - ALL
        volumeMounts:
        - name: cache
          mountPath: /var/cache/ai-inference
        - name: home
          mountPath: /home/ai-gateway
        - name: tmp
          mountPath: /tmp
        - name: run-ai-inference
          mountPath: /run/ai-inference
      volumes:
      - name: cache
        emptyDir:
          sizeLimit: "2Gi"
      - name: home
        emptyDir:
          sizeLimit: "100Mi"
      - name: tmp
        emptyDir: {}
      - name: run-ai-inference
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-inference-gateway
  namespace: ai-inference
  labels:
    app: ai-inference-gateway
spec:
  selector:
    app: ai-inference-gateway
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
  type: ClusterIP
---
# NetworkPolicy to allow gateway ingress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-ingress
  namespace: ai-inference
spec:
  podSelector:
    matchLabels:
      app: ai-inference-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-system
      ports:
        - protocol: TCP
          port: 8080
    # Allow intra-namespace traffic (MCP, health checks from other pods)
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
---
# NetworkPolicy to allow gateway egress to dependencies
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-egress
  namespace: ai-inference
spec:
  podSelector:
    matchLabels:
      app: ai-inference-gateway
  policyTypes:
    - Egress
  egress:
    # Allow DNS
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # Allow HTTPS egress to external APIs (ZAI, Pollinations)
    - ports:
        - protocol: TCP
          port: 443
    # Allow access to search namespace (SearXNG)
    - to:
        - namespaceSelector:
            matchLabels:
              name: search
      ports:
        - protocol: TCP
          port: 8080
    # Allow access to ai-inference namespace (Qdrant, llama.cpp backend)
    - to:
        - podSelector:
            matchLabels:
              app: qdrant
      ports:
        - protocol: TCP
          port: 6333
    - to:
        - podSelector:
            matchLabels:
              app: llama-cpp
      ports:
        - protocol: TCP
          port: 8083
