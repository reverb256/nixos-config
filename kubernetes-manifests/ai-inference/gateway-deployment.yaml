---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-gateway-config
  namespace: ai-inference
data:
  # Core Configuration
  AUTH_MODE: "none"
  BACKEND_TYPE: "llama-cpp"
  BACKEND_URL: "http://127.0.0.1:8083"
  DEFAULT_MODEL: "qwen3.5-35b-a3b"

  # RAG Configuration
  RAG_ENABLED: "true"
  RAG_TOP_K: "5"
  CHUNK_SIZE: "512"
  CHUNK_OVERLAP: "50"
  EMBEDDING_MODEL: "sentence-transformers/all-MiniLM-L6-v2"

  # Qdrant (vector database)
  QDRANT_URL: "http://qdrant:6333"

  # Knowledge Fabric Middleware
  MIDDLEWARE__KNOWLEDGE_FABRIC__ENABLED: "true"
  MIDDLEWARE__KNOWLEDGE_FABRIC__RRF_K: "60"
  MIDDLEWARE__KNOWLEDGE_FABRIC__RAG_ENABLED: "true"
  MIDDLEWARE__KNOWLEDGE_FABRIC__RAG_TOP_K: "5"
  MIDDLEWARE__KNOWLEDGE_FABRIC__CODE_SEARCH_ENABLED: "true"
  MIDDLEWARE__KNOWLEDGE_FABRIC__CODE_MAX_RESULTS: "5"
  MIDDLEWARE__KNOWLEDGE_FABRIC__SEARXNG_ENABLED: "true"
  MIDDLEWARE__KNOWLEDGE_FABRIC__SEARXNG_MAX_RESULTS: "5"
  MIDDLEWARE__KNOWLEDGE_FABRIC__SEARXNG_URL: "http://searxng:7777"
  MIDDLEWARE__KNOWLEDGE_FABRIC__WEB_SEARCH_ENABLED: "true"
  MIDDLEWARE__KNOWLEDGE_FABRIC__WEB_MAX_RESULTS: "5"

  # Auto-RAG
  AUTO_RAG_ENABLED: "true"
  HYBRID_SEARCH_ENABLED: "true"
  BM25_WEIGHT: "0.300000"

  # MCP Configuration
  MCP_ENABLED: "false"  # Disabled for K8s (local MCP servers won't work in pods)

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-inference-gateway
  namespace: ai-inference
  labels:
    app: ai-inference-gateway
    version: v2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-inference-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ai-inference-gateway
        version: v2
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9190"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: zephyr  # Keep on Zephyr (local backend dependency)
      containers:
      - name: gateway
        image: ghcr.io/j-kro/ai-inference-gateway:latest
        imagePullPolicy: IfNotPresent
        env:
        # Core Configuration
        - name: AUTH_MODE
          valueFrom:
            configMapKeyRef:
              name: ai-gateway-config
              key: AUTH_MODE
        - name: BACKEND_TYPE
          valueFrom:
            configMapKeyRef:
              name: ai-gateway-config
              key: BACKEND_TYPE
        - name: BACKEND_URL
          valueFrom:
            configMapKeyRef:
              name: ai-gateway-config
              key: BACKEND_URL
        - name: DEFAULT_MODEL
          valueFrom:
            configMapKeyRef:
              name: ai-gateway-config
              key: DEFAULT_MODEL
        # RAG Configuration
        - name: RAG_ENABLED
          valueFrom:
            configMapKeyRef:
              name: ai-gateway-config
              key: RAG_ENABLED
        - name: RAG_TOP_K
          valueFrom:
            configMapKeyRef:
              name: ai-gateway-config
              key: RAG_TOP_K
        - name: CHUNK_SIZE
          valueFrom:
            configMapKeyRef:
              name: ai-gateway-config
              key: CHUNK_SIZE
        - name: CHUNK_OVERLAP
          valueFrom:
            configMapKeyRef:
              name: ai-gateway-config
              key: CHUNK_OVERLAP
        - name: EMBEDDING_MODEL
          valueFrom:
            configMapKeyRef:
              name: ai-gateway-config
              key: EMBEDDING_MODEL
        # Qdrant
        - name: QDRANT_URL
          valueFrom:
            configMapKeyRef:
              name: ai-gateway-config
              key: QDRANT_URL
        # Knowledge Fabric
        - name: MIDDLEWARE__KNOWLEDGE_FABRIC__ENABLED
          valueFrom:
            configMapKeyRef:
              name: ai-gateway-config
              key: MIDDLEWARE__KNOWLEDGE_FABRIC__ENABLED
        - name: MIDDLEWARE__KNOWLEDGE_FABRIC__RRF_K
          valueFrom:
            configMapKeyRef:
              name: ai-gateway-config
              key: MIDDLEWARE__KNOWLEDGE_FABRIC__RRF_K
        - name: MIDDLEWARE__KNOWLEDGE_FABRIC__RAG_ENABLED
          valueFrom:
            configMapKeyRef:
              name: ai-gateway-config
              key: MIDDLEWARE__KNOWLEDGE_FABRIC__RAG_ENABLED
        - name: MIDDLEWARE__KNOWLEDGE_FABRIC__CODE_SEARCH_ENABLED
          valueFrom:
            configMapKeyRef:
              name: ai-gateway-config
              key: MIDDLEWARE__KNOWLEDGE_FABRIC__CODE_SEARCH_ENABLED
        - name: MIDDLEWARE__KNOWLEDGE_FABRIC__SEARXNG_ENABLED
          valueFrom:
            configMapKeyRef:
              name: ai-gateway-config
              key: MIDDLEWARE__KNOWLEDGE_FABRIC__SEARXNG_ENABLED
        # Gateway Configuration
        - name: GATEWAY_HOST
          value: "0.0.0.0"
        - name: PORT
          value: "8080"
        - name: PYTHONUNBUFFERED
          value: "1"
        # MCP (disabled in K8s)
        - name: MCP_ENABLED
          valueFrom:
            configMapKeyRef:
              name: ai-gateway-config
              key: MCP_ENABLED
        # Security
        - name: MAX_REQUEST_SIZE
          value: "10485760"
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: metrics
          containerPort: 9190
          protocol: TCP
        # Health Checks
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        # Resources
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        # Volume mounts for code search (read-only)
        volumeMounts:
        - name: nixos-config
          mountPath: /etc/nixos
          readOnly: true
      volumes:
      - name: nixos-config
        hostPath:
          path: /etc/nixos
          type: Directory

---
apiVersion: v1
kind: Service
metadata:
  name: ai-inference-gateway
  namespace: ai-inference
  labels:
    app: ai-inference-gateway
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9190"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 9190
    targetPort: metrics
    protocol: TCP
  selector:
    app: ai-inference-gateway
