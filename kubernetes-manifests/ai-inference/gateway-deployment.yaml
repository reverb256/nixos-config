---
# NetworkPolicy to allow gateway ingress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-ingress
  namespace: ai-inference
spec:
  podSelector:
    matchLabels:
      app: ai-inference-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-system
      ports:
        - protocol: TCP
          port: 8080
---
# NetworkPolicy to allow gateway egress to dependencies
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-egress
  namespace: ai-inference
spec:
  podSelector:
    matchLabels:
      app: ai-inference-gateway
  policyTypes:
    - Egress
  egress:
    # Allow DNS
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # Allow access to search namespace (SearXNG)
    - to:
        - namespaceSelector:
            matchLabels:
              name: search
      ports:
        - protocol: TCP
          port: 8080
    # Allow access to ai-inference namespace (Qdrant, llama.cpp backend)
    - to:
        - podSelector:
            matchLabels:
              app: qdrant
      ports:
        - protocol: TCP
          port: 6333
    - to:
        - podSelector:
            matchLabels:
              app: llama-cpp
      ports:
        - protocol: TCP
          port: 8083
