---
# Hermes Studio — Full-featured web UI for hermes-agent
# Repo: https://github.com/JPeetz/Hermes-Studio v1.18.1
# Deployed to nexus — Caddy on zephyr (10.1.1.100) exposes at studio.lan
# Connects to hermes-agent API at 10.1.1.120:8642 (same host, zero hops)
# Redis for sessions: Valkey at 10.2.10.161:6379 (search ns)
---
apiVersion: v1
kind: Secret
metadata:
  name: hermes-studio-secrets
  namespace: ai-inference
type: Opaque
stringData:
  password: "changeme-studio-2026"
  # TODO: Migrate to agenix-encrypted K8s secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-studio
  namespace: ai-inference
  labels:
    app: hermes-studio
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: hermes-studio
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: hermes-studio
    spec:
      nodeName: nexus
      dnsPolicy: ClusterFirst
      containers:
        - name: hermes-studio
          image: localhost/hermes-studio:1.18.1-prod
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              protocol: TCP
              name: http
          env:
            - name: HERMES_API_URL
              value: "http://10.1.1.120:8650"
            - name: HERMES_API_KEY
              value: "hermes-local-dev-b8b2275d6053fb335a9508048c54dc96"
            - name: REDIS_URL
              value: "redis://10.2.10.161:6379"
            - name: HERMES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hermes-studio-secrets
                  key: password
            - name: HERMES_DEFAULT_MODEL
              value: "glm-5.1"
            - name: NODE_ENV
              value: "production"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=2048"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
              nvidia.com/gpu: 0
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: studio-data
              mountPath: /app/.runtime
            - name: hermes-config
              mountPath: /root/.hermes/config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: studio-data
          emptyDir: {}
        - name: hermes-config
          configMap:
            name: hermes-studio-config
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-studio
  namespace: ai-inference
  labels:
    app: hermes-studio
spec:
  type: NodePort
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
      nodePort: 30300
  selector:
    app: hermes-studio
---
# NetworkPolicy — allow hermes-studio to reach hermes-agent API + Valkey
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-studio
  namespace: ai-inference
spec:
  podSelector:
    matchLabels:
      app: hermes-studio
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.1.1.0/24
      ports:
        - port: 3000
          protocol: TCP
    - from:
        - podSelector: {}
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 10.1.1.120/32
      ports:
        - port: 8642
          protocol: TCP
        - port: 8650
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 10.2.10.161/32
      ports:
        - port: 6379
          protocol: TCP