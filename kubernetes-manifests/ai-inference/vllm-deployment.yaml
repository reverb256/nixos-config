# vLLM Multi-GPU Inference Deployment
# High-performance LLM inference with PagedAttention
---
apiVersion: v1
kind: Namespace
metadata:
  name: ai-inference
  labels:
    app: ai-inference
    tier: backend

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-config
  namespace: ai-inference
data:
  MODEL_NAME: "Qwen/Qwen3.5-4B"
  TENSOR_PARALLEL_SIZE: "2"
  MAX_MODEL_LEN: "32768"
  GPU_MEMORY_UTILIZATION: "0.9"
  DTYPE: "half"

---
apiVersion: v1
kind: Service
metadata:
  name: vllm-inference
  namespace: ai-inference
  labels:
    app: vllm
    component: inference
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  selector:
    app: vllm

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-inference
  namespace: ai-inference
  labels:
    app: vllm
    component: inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
        component: inference
    spec:
      nodeName: zephyr  # Schedule on Zephyr (2 GPUs available)
      containers:
      - name: vllm
        image: vllm/vllm-openai:v0.6.0.post1
        command:
        - python
        - -m
        - vllm.entrypoints.openai.api_server
        args:
        - --model=$(MODEL_NAME)
        - --tensor-parallel-size=$(TENSOR_PARALLEL_SIZE)
        - --max-model-len=$(MAX_MODEL_LEN)
        - --gpu-memory-utilization=$(GPU_MEMORY_UTILIZATION)
        - --dtype=$(DTYPE)
        - --host=0.0.0.0
        - --port=8000
        - --enable-chunked-preload
        - --max-num-seqs=128
        - --disable-log-requests
        env:
        - name: MODEL_NAME
          valueFrom:
            configMapKeyRef:
              name: vllm-config
              key: MODEL_NAME
        - name: TENSOR_PARALLEL_SIZE
          valueFrom:
            configMapKeyRef:
              name: vllm-config
              key: TENSOR_PARALLEL_SIZE
        - name: MAX_MODEL_LEN
          valueFrom:
            configMapKeyRef:
              name: vllm-config
              key: MAX_MODEL_LEN
        - name: GPU_MEMORY_UTILIZATION
          valueFrom:
            configMapKeyRef:
              name: vllm-config
              key: GPU_MEMORY_UTILIZATION
        - name: DTYPE
          valueFrom:
            configMapKeyRef:
              name: vllm-config
              key: DTYPE
        - name: CUDA_VISIBLE_DEVICES
          value: "0,1"  # Use both GPUs on Zephyr
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          requests:
            nvidia.com/gpu: "2"
            memory: "8Gi"
            cpu: "4"
          limits:
            nvidia.com/gpu: "2"
            memory: "24Gi"
            cpu: "8"
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: model-cache
          mountPath: /models
        - name: shm
          mountPath: /dev/shm
      volumes:
      - name: model-cache
        hostPath:
          path: /var/cache/ai-inference
          type: DirectoryOrCreate
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
      priorityClassName: high-priority

---
# HorizontalPodAutoscaler for vLLM
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vllm-inference-hpa
  namespace: ai-inference
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vllm-inference
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 60

---
# ServiceMonitor for Prometheus
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vllm-inference
  namespace: ai-inference
  labels:
    app: vllm
spec:
  selector:
    matchLabels:
      app: vllm
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
