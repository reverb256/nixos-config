---
# SearXNG Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: search
  labels:
    app: searxng
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: searxng
    spec:
      # POD LEVEL SECURITY CONTEXT
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: searxng
        # Using the official SearXNG image
        image: searxng/searxng:latest
        imagePullPolicy: IfNotPresent
        # CONTAINER LEVEL SECURITY CONTEXT
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        env:
        - name: SEARXNG_SECRET
          value: "REDACTED_SEARXNG_SECRET_KEY"
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        # Volume mounts for read-only root filesystem
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/sh
              - -c
              - |
                # Wait for settings.yml to be auto-generated
                sleep 2
                # Enable all formats (html, csv, json, rss)
                sed -i 's/formats:/formats: #/' /etc/searxng/settings.yml
                sed -i '/# remove format to deny/a\  formats:\n    - html\n    - csv\n    - json\n    - rss' /etc/searxng/settings.yml || \
                sed -i 's/  - html$/  - html\n    - csv\n    - json\n    - rss/' /etc/searxng/settings.yml
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /var/www/searxng/cache
        - name: settings
          mountPath: /etc/searxng
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
      - name: settings
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: searxng
  namespace: search
  labels:
    app: searxng
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 7777
    targetPort: 8080
    protocol: TCP
  selector:
    app: searxng
