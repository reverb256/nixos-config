# TurboQuant Test Deployment on Zephyr GPU 0 (RTX 3060 Ti, 8GB)
# Testing KV cache compression with Qwen3.5-35B-A3B (MoE, 3B active params)
#
# Before applying:
#   kubectl taint nodes zephyr workstation=true:NoSchedule --overwrite  (already set)
#   kubectl taint nodes zephyr interactive=true:NoExecute --overwrite     (already set)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: turboquant-test-config
  namespace: ai-inference
data:
  MODEL_PATH: "/models/Qwen3.5-35B-A3B-GGUF/Qwen3.5-35B-A3B-UD-IQ4_NL.gguf"
  TURBOQUANT_BITS: "4"
  MAX_MODEL_LEN: "8192"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: turboquant-test
  namespace: ai-inference
  labels:
    app: turboquant-test
    test: turboquant
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: turboquant-test
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: turboquant-test
        test: turboquant
    spec:
      nodeName: zephyr
      runtimeClassName: nvidia
      priorityClassName: ai-inference-high
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - key: "workstation"
          operator: "Equal"
          value: "true"
          effect: NoSchedule
        - key: "interactive"
          operator: "Equal"
          value: "true"
          effect: NoExecute
        - key: "ram-constrained"
          operator: "Equal"
          value: "true"
          effect: NoSchedule
      containers:
      - name: vllm
        image: vllm/vllm-openai:latest
        imagePullPolicy: IfNotPresent
        command:
        - python3
        - -m
        - vllm.entrypoints.openai.api_server
        args:
        - --model=/models/Qwen3.5-35B-A3B-GGUF/Qwen3.5-35B-A3B-UD-IQ4_NL.gguf
        - --gpu-memory-utilization=0.85
        - --max-model-len=8192
        - --dtype=half
        - --enable-chunked-prefill
        - --max-num-seqs=4
        - --disable-log-requests
        - --port=8000
        - --kv-cache-dtype=fp8_e4m3fn
        env:
        - name: CUDA_VISIBLE_DEVICES
          value: "0"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: VLLM_WORKER_MULTIPROC_METHOD
          value: "fork"
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        resources:
          requests:
            cpu: "2"
            memory: "3Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "4"
            memory: "4Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: models
          mountPath: /models
          readOnly: true
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: models
        hostPath:
          path: /home/j_kro/.lmstudio/models/unsloth
          type: Directory
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: turboquant-test
  namespace: ai-inference
  labels:
    app: turboquant-test
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  selector:
    app: turboquant-test
