# Secret for AI Inference Gateway
# IMPORTANT: Update values with your actual credentials
#
# To update the secret:
# kubectl create secret generic ai-inference-gateway-secrets \
#   --from-literal=zai-api-key='YOUR_ZAI_KEY' \
#   --from-file=api-keys=./api-keys.txt \
#   --namespace=ai-inference \
#   --dry-run=client -o yaml | kubectl apply -f -
#
# api-keys.txt format (one key per line):
#   sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-inference-gateway-secrets
  namespace: ai-inference
type: Opaque
stringData:
  # ZAI cloud inference API key
  zai-api-key: "YOUR_ZAI_API_KEY_HERE"
  # API keys for gateway authentication (one per line, format: key-name=sk-xxx)
  # AUTH_MODE=api-key reads this file via API_KEYS_FILE env var
  api-keys: |
    default=sk-replace-with-your-actual-api-key
