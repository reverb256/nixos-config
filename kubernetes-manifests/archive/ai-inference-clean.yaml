apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    deployment.kubernetes.io/revision: '1'
  labels:
    app: grafana
  name: grafana
  namespace: ai-inference
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: grafana
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: '2026-04-10T15:08:09-05:00'
      labels:
        app: grafana
    spec:
      containers:
      - env:
        - name: GF_SECURITY_ADMIN_USER
          value: admin
        - name: GF_USERS_ALLOW_SIGN_UP
          value: 'false'
        - name: GF_INSTALL_PLUGINS
        - name: GF_SERVER_ROOT_URL
          value: http://localhost:3000
        image: grafana/grafana:11.1.0
        imagePullPolicy: IfNotPresent
        name: grafana
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/hostname: nexus
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    deployment.kubernetes.io/revision: '1'
  labels:
    app: open-webui
  name: open-webui
  namespace: ai-inference
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: open-webui
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
      - env:
        - name: OLLAMA_BASE_URLS
          value: http://10.1.1.110:8080/v1
        - name: ENABLE_OLLAMA
          value: 'true'
        - name: ENABLE_OPENAI_API
          value: 'false'
        - name: ENABLE_LLM
          value: 'true'
        - name: ENABLE_SIGNUP
          value: 'true'
        - name: ENABLE_LDAP_LOGIN
          value: 'false'
        image: ghcr.io/open-webui/open-webui:0.6.5
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 10
        name: open-webui
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            cpu: '2'
            memory: 4Gi
          requests:
            cpu: 500m
            memory: 1Gi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /app/backend/data
          name: webui-data
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/hostname: nexus
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: open-webui
      serviceAccountName: open-webui
      terminationGracePeriodSeconds: 30
      volumes:
      - hostPath:
          path: /mnt/open-webui-data
          type: DirectoryOrCreate
        name: webui-data
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: grafana
  name: grafana
  namespace: ai-inference
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: http
    port: 3000
    protocol: TCP
    targetPort: 3000
  selector:
    app: grafana
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: open-webui
  name: open-webui
  namespace: ai-inference
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app: open-webui
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    caddy.ingress.kubernetes.io/disable-ssl-redirect: 'true'
  labels:
    app.kubernetes.io/name: llama-server
  name: llama-server
  namespace: ai-inference
spec:
  ingressClassName: caddy
  rules:
  - host: ai.lan
    http:
      paths:
      - backend:
          service:
            name: llama-server
            port:
              number: 8080
        path: /
        pathType: Prefix
  - host: ai.cluster.local
    http:
      paths:
      - backend:
          service:
            name: llama-server
            port:
              number: 8080
        path: /
        pathType: Prefix
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    caddy.ingress.kubernetes.io/disable-ssl-redirect: 'true'
  labels:
    app.kubernetes.io/name: openwebui
  name: openwebui
  namespace: ai-inference
spec:
  ingressClassName: caddy
  rules:
  - host: openwebui.lan
    http:
      paths:
      - backend:
          service:
            name: open-webui
            port:
              number: 8080
        path: /
        pathType: Prefix
  - host: openwebui.cluster.local
    http:
      paths:
      - backend:
          service:
            name: open-webui
            port:
              number: 8080
        path: /
        pathType: Prefix
---
