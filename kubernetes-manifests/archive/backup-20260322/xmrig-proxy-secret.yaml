# XMRig Proxy Secret
# Contains sensitive configuration that should not be in ConfigMap
apiVersion: v1
kind: Secret
metadata:
  name: xmrig-proxy-secret
  namespace: mining
  labels:
    app: xmrig-proxy
    component: stratum-proxy
type: Opaque
stringData:
  # API token for xmrig-proxy admin interface
  # CHANGE THIS: Generate a secure token before deployment
  api-token: "CHANGE-THIS-TO-A-SECURE-RANDOM-TOKEN"
---
# Pool credentials (if needed for authentication)
# Some pools require username/password authentication
apiVersion: v1
kind: Secret
metadata:
  name: pool-credentials
  namespace: mining
  labels:
    app: xmrig
    component: pool-auth
type: Opaque
stringData:
  # Pool passwords - typically just "x" for most public pools
  kryptex-password: "x"
