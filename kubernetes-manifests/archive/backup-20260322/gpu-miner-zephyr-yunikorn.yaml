# GPU Miner Deployment for Zephyr (RTX 3060 Ti + RTX 3090)
# MIGRATED: Now uses YuniKorn scheduler with priority-based preemption
#
# Changes from original:
# - Added schedulerName: yunikorn
# - Priority class maintained (low-priority-mining)
# - PodGroup association for gang scheduling support
# - Enhanced resource requests/limits for scheduler awareness
# - Added eviction toleration for preemption

apiVersion: scheduling.volcano.sh/v1beta1
kind: PodGroup
metadata:
  name: gpu-miner-zephyr-group
  namespace: mining
  labels:
    app: gpu-miner
    host: zephyr
spec:
  # Minimum resources for gang scheduling
  minMember: 1
  minResources:
    nvidia.com/gpu: "2"
    memory: "8Gi"
    cpu: "2"
  # Priority class (low - preemptible by AI)
  priorityClassName: preemptible-mining
  # Queue for mining workloads
  queue: mining-queue
  # Timeout for resource allocation
  minTaskTimeout: 5m
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-miner-zephyr
  namespace: mining
  labels:
    app: gpu-miner
    host: zephyr
    scheduler: yunikorn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gpu-miner
      host: zephyr
  template:
    metadata:
      labels:
        app: gpu-miner
        host: zephyr
        # PodGroup association for gang scheduling
        scheduling.volcano.sh/pod-group: gpu-miner-zephyr-group
      annotations:
        # PromotePods annotation for faster preemption recovery
        prometheus.io/scrape: "true"
        prometheus.io/port: "4068"
        prometheus.io/path: "/metrics"
    spec:
      # Use YuniKorn scheduler
      schedulerName: yunikorn
      # Pin to Zephyr node (RTX 3060 Ti + RTX 3090)
      nodeName: zephyr
      serviceAccountName: gpu-miner-sa
      # Use host network for stratum connection
      hostNetwork: true
      # Low priority (preemptible by AI workloads)
      priorityClassName: preemptible-mining
      # Tolerations for control plane and preemption
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      # Allow this pod to be evicted for higher priority pods
      - key: "scheduler.yunikorn.io/preemptible"
        operator: "Exists"
      containers:
      - name: lolminer
        image: lolminer:1.98a-nixos
        imagePullPolicy: Never  # Use local image built by Nix
        args:
          - "--algo=CR29"
          - "--pool=stratum+tcp://10.1.1.110:3333"  # Connect to xmrig-proxy service
          - "--user=zephyr-gpu"
          - "--devices=0,1"  # RTX 3060 Ti (GPU 0) + RTX 3090 (GPU 1)
          - "--apiport=4068"
          - "--mode=b"
          - "--tls=1"
        ports:
        - containerPort: 4068
          name: api
          protocol: TCP
        # Health probes - lolMiner API for monitoring
        livenessProbe:
          httpGet:
            path: /
            port: api
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: api
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        securityContext:
          privileged: true  # Required for GPU access
        volumeMounts:
        - name: nvidia
          mountPath: /usr/lib/nvidia
        # Enhanced resource requests for YuniKorn scheduling
        resources:
          requests:
            memory: "4Gi"
            cpu: "2"
            nvidia.com/gpu: "2"
          limits:
            memory: "8Gi"
            cpu: "4"
            nvidia.com/gpu: "2"
      volumes:
      - name: nvidia
        hostPath:
          path: /run/current-system/sw/lib/nvidia
      initContainers:
      - name: set-gpu-power-limits
        image: lolminer:1.98a-nixos
        imagePullPolicy: Never
        command:
          - /bin/bash
          - -c
          - |
            # Set per-GPU power limits using host's nvidia-smi
            echo "Setting GPU power limits..."

            # Use host's nvidia-smi via mount
            /usr/lib/nvidia/bin/nvidia-smi -i 0 -pm 1 -pl 130  # RTX 3060 Ti
            /usr/lib/nvidia/bin/nvidia-smi -i 1 -pm 1 -pl 250  # RTX 3090 (VRAM-safe)

            echo "Power limits set successfully"
        securityContext:
          privileged: true
        volumeMounts:
        - name: nvidia
          mountPath: /usr/lib/nvidia
