---
# Knowledge Fabric API — Brain query endpoint
# Simple Flask-based brain API for RAG and memory
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-fabric-api
  namespace: ai-inference
  labels:
    app: knowledge-fabric-api
    component: brain
spec:
  replicas: 1
  selector:
    matchLabels:
      app: knowledge-fabric-api
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: knowledge-fabric-api
        component: brain
    spec:
      nodeName: nexus
      priorityClassName: agent-critical
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: knowledge-fabric-api
        image: python:3.12-slim
        imagePullPolicy: IfNotPresent
        command:
          - python3
          - -c
          - |
            from http.server import HTTPServer, BaseHTTPRequestHandler
            import json
            
            class BrainHandler(BaseHTTPRequestHandler):
              def do_GET(self):
                if self.path == '/health':
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(b'{"status": "healthy", "service": "knowledge-fabric"}')
                else:
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(b'{"message": "knowledge-fabric-api running", "endpoints": ["/brain/query", "/health"]}')
              
              def do_POST(self):
                if self.path == '/brain/query':
                  content_length = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(content_length) if content_length > 0 else b'{}'
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  # Return placeholder response - real impl would query Qdrant
                  self.wfile.write(json.dumps({
                    "results": [],
                    "context": "Knowledge fabric placeholder - Qdrant integration pending",
                    "status": "ready"
                  }).encode())
                else:
                  self.send_response(404)
                  self.end_headers()
              
              def log_message(self, format, *args):
                print(f"[brain] {format % args}")
            
            print("Starting knowledge-fabric-api on port 3000...")
            server = HTTPServer(('0.0.0.0', 3000), BrainHandler)
            server.serve_forever()
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      tolerations:
      - key: workstation
        operator: Equal
        value: "true"
        effect: NoSchedule
      - key: interactive
        operator: Equal
        value: "true"
        effect: NoExecute
---
apiVersion: v1
kind: Service
metadata:
  name: knowledge-fabric-api
  namespace: ai-inference
  labels:
    app: knowledge-fabric-api
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    protocol: TCP
  selector:
    app: knowledge-fabric-api
---
# Ingress for brain.lan via Caddy
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: knowledge-fabric-api
  namespace: ai-inference
  labels:
    app: knowledge-fabric-api
  annotations:
    caddy.ingress.kubernetes.io/disable-ssl-redirect: "true"
spec:
  ingressClassName: caddy
  rules:
  - host: brain.lan
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: knowledge-fabric-api
            port:
              number: 3000