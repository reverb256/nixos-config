# GPU Test Pod - Verify GPU Passthrough
apiVersion: v1
kind: Pod
metadata:
  name: gpu-test-phase1
spec:
  restartPolicy: OnFailure
  hostPID: true
  containers:
  - name: gpu-test
    image: nvidia/cuda:12.1.0-devel-ubuntu22.04
    command: ["/bin/bash", "-c"]
    args: ["ls -la /dev/nvidia* 2>&1; echo 'GPU devices:'; ls -la /dev/dri/by-path/ | grep -i nvidia 2>&1 || echo 'No GPU devices found in /dev/dri/by-path'"]
    resources:
      limits:
        nvidia.com/gpu: 1
    securityContext:
      privileged: true
  nodeSelector:
    accelerator: nvidia-gpu