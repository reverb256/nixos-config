version: "2.0"

services:
  keepalive:
    image: nginx:1.25.3
    expose:
      - port: 80
        as: 80
        to:
          - global: true

profiles:
  compute:
    keepalive:
      resources:
        cpu:
          units: 0.1        # Minimal CPU
        memory:
          size: 128Mi      # Minimal memory
        storage:
          size: 128Mi      # Minimal storage
          attributes:
            persistent: false  # Ephemeral is fine for keepalive

  placement:
    provider:
      pricing:
        keepalive:
          denom: uakt
          amount: 1000     # Minimal bid price

deployment:
  keepalive:
    provider:
      profile: keepalive
      count: 1
