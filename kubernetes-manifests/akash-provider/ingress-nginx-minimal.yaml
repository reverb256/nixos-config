# Minimal ingress-nginx for Akash Hostname Operator
# This deployment is specifically for Akash provider hostname operator compatibility
# The hostname operator creates Kubernetes Ingress resources and expects ingress-nginx to serve them

apiVersion: v1
kind: Namespace
metadata:
  name: ingress-nginx-akash

---
# Minimal RBAC for ingress-nginx
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ingress-nginx-akash
  namespace: ingress-nginx-akash

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ingress-nginx-akash
  namespace: ingress-nginx-akash
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
      - endpoints
      - namespaces
      - pods
      - secrets
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ingress-nginx-akash
  namespace: ingress-nginx-akash
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ingress-nginx-akash
subjects:
  - kind: ServiceAccount
    name: ingress-nginx-akash
    namespace: ingress-nginx-akash

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ingress-nginx-controller
  namespace: ingress-nginx-akash
data:
  # Minimal configuration for Akash hostname operator
  # Disable features that conflict with Caddy
  allow-snippet-annotations: "false"
  hide-headers: "CSP-Header"
  server-tokens: "false"

---
apiVersion: v1
kind: Service
metadata:
  name: ingress-nginx-akash
  namespace: ingress-nginx-akash
  annotations:
    service.beta.kubernetes.io/do-loadbalancer: "false"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  - name: https
    port: 443
    targetPort: 443
    protocol: TCP
  selector:
    app.kubernetes.io/name: ingress-nginx-akash
  sessionAffinity: None

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress-nginx-akash
  namespace: ingress-nginx-akash
  labels:
    app.kubernetes.io/name: ingress-nginx-akash
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ingress-nginx-akash
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingress-nginx-akash
    spec:
      serviceAccountName: ingress-nginx-akash
      terminationGracePeriodSeconds: 60
      tolerations:
      # Run on GPU nodes where Akash provider is scheduled
      - key: accelerator
        operator: In
        values:
          - nvidia-gpu
          - amd-gpu
      - key: workstation
        operator: Equal
        value: "true"
        effect: NoSchedule
      containers:
      - name: controller
        image: registry.k8s.io/ingress-nginx/controller:v1.11.3@sha256:7e6cd234b18edbec2c276c9b019a8944eb634dd3477b5d72d3b1009821385d
        name: controller
        args:
          - /nginx-ingress-controller
          - --configmap=$(POD_NAMESPACE)/ingress-nginx-controller
          - --tcp-configmap=$(POD_NAMESPACE)/tcp-services
          - --udp-configmap=$(POD_NAMESPACE)/udp-services
          - --publish-status-address=127.0.0.1
          - --enable-metrics=false
          - --disable-service-listener
        env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: LD_PRELOAD
            value: /usr/local/lib/libmimalloc.so
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        - name: https
          containerPort: 443
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: 10254
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 1
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 10254
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 1
          successThreshold: 1
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
              - NET_BIND_SERVICE

---
# NodePort service for external access (if needed)
apiVersion: v1
kind: Service
metadata:
  name: ingress-nginx-akash-nodeport
  namespace: ingress-nginx-akash
spec:
  type: NodePort
  externalTrafficPolicy: Local
  ports:
  - name: http
    port: 80
    targetPort: 80
    nodePort: 30080
    protocol: TCP
  - name: https
    port: 443
    targetPort: 443
    nodePort: 30443
    protocol: TCP
  selector:
    app.kubernetes.io/name: ingress-nginx-akash
  sessionAffinity: None

---
# IngressClass for Akash provider
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: nginx-akash
spec:
  controller: k8s.io/ingress-nginx-akash
  parameters:
    # Use the specific ingress-nginx deployment
  # Wildcard DNS *.ingress.provider.reverb256.ca should point to NodePort or LoadBalancer
