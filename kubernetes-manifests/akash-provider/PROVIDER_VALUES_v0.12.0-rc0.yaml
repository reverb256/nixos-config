# Akash Provider Helm Values - v0.12.0-rc0 (UPGRADED 2026-03-26)
# Chart: akash/provider 15.0.0 | App Version: 0.12.0-rc0
# Last Updated: 2026-03-26
# Upgrade Reason: Fix balance-checker crash (Issue #440, PR #376)
# Source: v0.12.0-rc0 (released 2026-03-24)

# =============================================================================
# PROVIDER IDENTITY
# =============================================================================
clusterPublicHostname: provider.reverb256.ca
domain: provider.reverb256.ca
providerAddress: akash1c6h804ky08tdpnxrv72vum783xuey09qzt2p6
from: provider-wallet
email: admin@reverb256.ca
website: https://reverb256.ca

# =============================================================================
# CRITICAL IMAGE CONFIGURATION
# =============================================================================
# UPgraded to v0.12.0-rc0 to fix balance-checker nil-pointer panic crash
image:
  repository: ghcr.io/akash-network/provider
  tag: 0.12.0-rc0
  pullPolicy: IfNotPresent

# CRITICAL: Empty withdrawal period disables periodic withdrawals (fixes withdrawal goroutine crash)
withdrawalperiod: ""

# CRITICAL FIX: Correct hostname structure (was causing hostname-operator health check failure)
# Working config used provider.reverb256.ca, NOT provider.provider.reverb256.ca
deployment:
  ingressDomain: ingress.provider.reverb256.ca

# =============================================================================
# ENVIRONMENT VARIABLES
# =============================================================================
env:
  - name: AKASH_FROM
    value: "provider-wallet"
  - name: AP_CERT_ISSUER_EMAIL
    value: "admin@reverb256.ca"

# =============================================================================
# BLOCKCHAIN CONNECTION
# =============================================================================
# Using Polkachu RPC endpoint (hostname with /etc/hosts fallback)
node: https://akash-rpc.polkachu.com:443
chainID: akashnet-2

# =============================================================================
# INGRESS & SERVICE CONFIGURATION
# =============================================================================
ingress:
  enabled: false

service:
  type: NodePort
  ports:
    - name: api
      port: 8443
      targetPort: api
    - name: grpc
      port: 8444
      targetPort: grpc

# =============================================================================
# LET'S ENCRYPT (DISABLED)
# =============================================================================
letsEncrypt:
  enabled: false

# =============================================================================
# RESOURCE LIMITS (comply with namespace LimitRange: max 2Gi)
# =============================================================================
resources:
  limits:
    cpu: "2"
    memory: 2Gi
  requests:
    cpu: "1"
    memory: 1Gi

# =============================================================================
# NODE SCHEDULING
# =============================================================================
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: accelerator
          operator: In
          values:
          - nvidia-gpu
      - matchExpressions:
        - key: accelerator
          operator: In
          values:
          - amd-gpu

# =============================================================================
# INVENTORY OPERATOR CONFIGURATION
# =============================================================================
# CRITICAL: Must include beta2 (fast NVMe SSD) for competitive bidding
inventory:
  config:
    version: v1
    cluster_storage:
      - beta2    # NVMe SSD (fast-local-ssd on zephyr, forge, nexus)
      - beta3    # HDD (slow-hdd on sentry)
      - ram      # RAM disk (volatile, fast)
    exclude:
      nodes:
        - ^zephyr.*  # Exclude zephyr from provider inventory (control plane node)
      node_storage: []

# =============================================================================
# HOSTNAME OPERATOR CONFIGURATION
# =============================================================================
hostname:
  cloudflare:
    enabled: true
    apiToken:
      valueFrom:
        secretKeyRef:
          name: cloudflare-dns-token
          key: CF_DNS_API_TOKEN

# =============================================================================
# CRITICAL FIX: Bypass DNS trailing dot bug with static endpoint
# =============================================================================
# Bug location: cluster/util/service_discovery_agent.go:167-169
# Issue: DNS SRV lookup returns FQDN with trailing dot (e.g., "operator-hostname.akash-services.svc.cluster.local.")
# Impact: Creates malformed URL "http://operator-hostname.akash-services.svc.cluster.local.:8080/health"
# Fix: Use static cluster IP endpoint to bypass DNS discovery entirely
# Note: This is a workaround until provider code is patched to strip trailing dots from DNS results
# IMPORTANT: Do NOT override run.sh - let Helm chart use its default
scripts:
  init.sh: |
    #!/bin/bash
    set -x

    AKASH_HOME="${AKASH_HOME:-/root/.akash}"
    AKASH_KEYRING_BACKEND="${AKASH_KEYRING_BACKEND:-test}"
    AKASH_FROM="${AKASH_FROM:-provider-wallet}"
    EXPECTED_ADDRESS="akash1c6h804ky08tdpnxrv72vum783xuey09qgzt2p6"

    # Read mnemonic from mounted file
    MNEMONIC="$(cat /boot-keys/mnemonic.txt)"

    echo "=== Importing Key from Mnemonic ==="
    echo "Expected address: $EXPECTED_ADDRESS"

    # Check if key already exists
    EXISTING_ADDRESS=$(provider-services --home="$AKASH_HOME" keys show "$AKASH_FROM" --keyring-backend="$AKASH_KEYRING_BACKEND" -a 2>/dev/null || "")

    if [ "$EXISTING_ADDRESS" = "$EXPECTED_ADDRESS" ]; then
        echo "✓ Key already exists with correct address!"
    elif [ -n "$EXISTING_ADDRESS" ]; then
        echo "Key exists but has wrong address: $EXISTING_ADDRESS"
        echo "Deleting and re-importing..."
        provider-services --home="$AKASH_HOME" keys delete "$AKASH_FROM" --keyring-backend="$AKASH_KEYRING_BACKEND" || true
        echo "$MNEMONIC" | provider-services --home="$AKASH_HOME" keys add "$AKASH_FROM" \
            --recover \
            --keyring-backend="$AKASH_KEYRING_BACKEND" || exit 1
    else
        echo "Importing new key from mnemonic..."
        echo "$MNEMONIC" | provider-services --home="$AKASH_HOME" keys add "$AKASH_FROM" \
            --recover \
            --keyring-backend="$AKASH_KEYRING_BACKEND" || exit 1
    fi

    # Verify the address
    ACTUAL_ADDRESS=$(provider-services --home="$AKASH_HOME" keys show "$AKASH_FROM" --keyring-backend="$AKASH_KEYRING_BACKEND" -a)
    echo "Actual: $ACTUAL_ADDRESS"
    echo "Expected: $EXPECTED_ADDRESS"

    if [ "$ACTUAL_ADDRESS" = "$EXPECTED_ADDRESS" ]; then
        echo "✓ Key imported/verified successfully!"
        /scripts/wait_for_rpc.sh
        /scripts/create_provider.sh
        /scripts/refresh_provider_cert.sh

        # === AUTO-KEEPALIVE DISABLED FOR v0.12.0-rc0 UPGRADE ===
        # The balance-checker crash bug should be fixed in v0.12.0-rc0
        # Providers should now be able to run 24/7 without tenants
        echo "=== AUTO-KEEPALIVE: SKIPPED (v0.12.0-rc0 fixes balance-checker crash) ==="
        echo "Provider can now run 24/7 without active leases"
        exit 0
    else
        echo "✗ Address mismatch!"
        exit 1
    fi

  wait_for_rpc.sh: |
    #!/bin/bash
    set -e

    # CRITICAL FIX: Add /etc/hosts entry BEFORE any DNS operations
    # This must happen first, before any command that might trigger DNS resolution
    echo "104.26.4.81 akash-rpc.polkachu.com" >> /etc/hosts
    echo "Added /etc/hosts entry for akash-rpc.polkachu.com"

    type curl || exit 1
    type jq || exit 1
    type awk || exit 1
    type bc || exit 1

    NODE=${AKASH_NODE:-https://akash-rpc.polkachu.com:443}

    if [[ -z "$NODE" ]]; then
        echo "AKASH_NODE is required"
        exit 1
    fi

    # Wait for node to be ready
    echo "Waiting for Akash RPC $NODE to be ready..."
    while true; do
        if [[ "$NODE" =~ https:// ]]; then
            CATCHING_UP=$(curl -s -k "$NODE/status" | jq -r '.result.sync_info.catching_up')
        else
            CATCHING_UP=$(curl -s "http://$NODE/status" | jq -r '.result.sync_info.catching_up')
        fi

        if [[ "$CATCHING_UP" == "false" ]]; then
            if [[ "$NODE" =~ https:// ]]; then
                DATE_AKASH=$(curl -s -k "$NODE/status" | jq -r '.result.sync_info.latest_block_time')
            else
                DATE_AKASH=$(curl -s "http://$NODE/status" | jq -r '.result.sync_info.latest_block_time')
            fi

            TS_AKASH=$(date +%s --date "$DATE_AKASH")
            TS=$(date +%s)
            DIFF=$((TS - TS_AKASH))

            echo "Last block Akash RPC $NODE seen was $DIFF seconds ago"

            if [[ $DIFF -gt 30 ]]; then
                echo "Akash node not ready. Retrying"
                sleep 15
                continue
            fi

            echo "Last block Akash RPC $NODE seen was $DIFF seconds ago => OK"
            break
        fi

        sleep 5
    done

    echo "Akash RPC $NODE is ready"

  create_provider.sh: |
    #!/bin/bash
    set -x

    AKASH_HOME="${AKASH_HOME:-/root/.akash}"
    AKASH_KEYRING_BACKEND="${AKASH_KEYRING_BACKEND:-test}"
    AKASH_FROM="${AKASH_FROM:-provider-wallet}"

    PROVIDER_ADDRESS=$(provider-services --home="$AKASH_HOME" keys show "$AKASH_FROM" --keyring-backend="$AKASH_KEYRING_BACKEND" -a)

    if [[ -z "$PROVIDER_ADDRESS" ]]; then
        echo "PROVIDER_ADDRESS variable empty. Something went wrong"
        exit 1
    fi

    export AKASH_HOME AKASH_KEYRING_BACKEND AKASH_FROM
    provider-services provider create \
      --from "$AKASH_FROM" \
      --keyring-backend "$AKASH_KEYRING_BACKEND" \
      --home "$AKASH_HOME" || {
        echo "Provider creation failed (might already exist)"
    }

  refresh_provider_cert.sh: |
    #!/bin/bash
    set -x

    AKASH_HOME="${AKASH_HOME:-/root/.akash}"
    AKASH_KEYRING_BACKEND="${AKASH_KEYRING_BACKEND:-test}"
    AKASH_FROM="${AKASH_FROM:-provider-wallet}"

    PROVIDER_ADDRESS=$(provider-services --home="$AKASH_HOME" keys show "$AKASH_FROM" --keyring-backend="$AKASH_KEYRING_BACKEND" -a)

    if [[ -z "$PROVIDER_ADDRESS" ]]; then
        echo "PROVIDER_ADDRESS variable empty. Something went wrong"
        exit 1
    fi

    export AKASH_HOME AKASH_KEYRING_BACKEND AKASH_FROM
    provider-services provider cert-create \
      --from "$AKASH_FROM" \
      --keyring-backend "$AKASH_KEYRING_BACKEND" \
      --home "$AKASH_HOME" || {
        echo "Certificate refresh failed"
        exit 1
    }

  deploy_keepalive.sh: |
    #!/bin/bash
    set -x

    AKASH_HOME="${AKASH_HOME:-/root/.akash}"
    AKASH_KEYRING_BACKEND="${AKASH_KEYRING_BACKEND:-test}"
    AKASH_FROM="${AKASH_FROM:-provider-wallet}"
    PROVIDER_ADDRESS="akash1c6h804ky08tdpnxrv72vum783xuey09qgzt2p6"
    SDL_FILE="/scripts/keepalive-deployment.yaml"

    echo "=== AUTO-KEEPALIVE: Creating minimal deployment ==="
    echo "Wallet: $AKASH_FROM"
    echo "Provider: $PROVIDER_ADDRESS"
    echo ""

    # Check if deployment already exists
    echo "Checking for existing deployments..."
    EXISTING_DEPLOYMENTS=$(provider-services query market deployment list --owner=$AKASH_FROM --output=json 2>/dev/null | jq -r '.deployments | length' || echo "0")
    echo "Existing deployments: $EXISTING_DEPLOYMENTS"

    if [ "$EXISTING_DEPLOYMENTS" -gt "0" ]; then
        echo "Deployment already exists, checking for active leases..."
        ACTIVE_LEASES=$(provider-services query market lease list --provider=$PROVIDER_ADDRESS --state=active --output=json 2>/dev/null | jq -r '.leases | length' || echo "0")
        echo "Active leases: $ACTIVE_LEASES"
        
        if [ "$ACTIVE_LEASES" -gt "0" ]; then
            echo "✓ Active lease found - provider will stay running!"
            exit 0
        fi
    fi

    echo "Creating new keepalive deployment..."
    
    # Create deployment WITHOUT deposit flag (per official Akash documentation)
    # Blockchain handles deposit automatically via escrow
    DEPLOYMENT_OUTPUT=$(provider-services tx deployment create $SDL_FILE --from $AKASH_FROM --yes 2>&1)
    echo "$DEPLOYMENT_OUTPUT"
    
    DSEQ=$(echo "$DEPLOYMENT_OUTPUT" | grep -oP 'dseq: \K\d+' || echo '')
    if [ -z "$DSEQ" ]; then
        echo "❌ ERROR: Failed to create deployment"
        exit 1
    fi
    echo "✓ Deployment created: DSEQ $DSEQ"
    echo ""

    # Wait for bids
    echo "Waiting for provider to bid (10 seconds)..."
    sleep 10
    
    BIDS=$(provider-services query market bid get --dseq $DSEQ --state open --output json 2>/dev/null || echo '[]')
    BID_COUNT=$(echo "$BIDS" | jq '.bids | length' 2>/dev/null || echo '0')
    echo "Bids found: $BID_COUNT"

    if [ "$BID_COUNT" -eq "0" ]; then
        echo "⚠️  No bids yet, waiting 30 more seconds..."
        sleep 30
        BIDS=$(provider-services query market bid get --dseq $DSEQ --state open --output json 2>/dev/null || echo '[]')
        BID_COUNT=$(echo "$BIDS" | jq '.bids | length' 2>/dev/null || echo '0')
        echo "Bids after wait: $BID_COUNT"
        
        if [ "$BID_COUNT" -eq "0" ]; then
            echo "❌ ERROR: Provider did not bid on own deployment"
            echo "This might indicate a pricing or inventory issue"
            exit 1
        fi
    fi

    echo "✓ Provider bid received!"
    echo ""

    # Get bid details
    FIRST_BID=$(echo "$BIDS" | jq '.bids[0]')
    GSEQ=$(echo "$FIRST_BID" | jq -r '.bid.id.gseq')
    OSEQ=$(echo "$FIRST_BID" | jq -r '.bid.id.oseq')
    PROVIDER=$(echo "$FIRST_BID" | jq -r '.bid.id.provider')
    
    echo "Bid details:"
    echo "  DSEQ: $DSEQ"
    echo "  GSEQ: $GSEQ"
    echo "  OSEQ: $OSEQ"
    echo "  Provider: $PROVIDER"
    echo ""

    # Create lease
    echo "Creating lease..."
    LEASE_OUTPUT=$(provider-services tx market lease create --dseq $DSEQ --gseq $GSEQ --oseq $OSEQ --from $AKASH_FROM --yes 2>&1)
    echo "$LEASE_OUTPUT"
    echo ""

    # Send manifest
    echo "Sending manifest..."
    MANIFEST_OUTPUT=$(provider-services send-manifest $SDL_FILE --dseq $DSEQ --provider $PROVIDER_ADDRESS --from $AKASH_FROM 2>&1)
    echo "$MANIFEST_OUTPUT"
    echo ""

    # Verify lease
    echo "Verifying lease status..."
    sleep 5
    LEASE_STATUS=$(provider-services query market lease get --dseq $DSEQ --state active --output json 2>/dev/null || echo '[]')
    LEASE_COUNT=$(echo "$LEASE_STATUS" | jq '.leases | length' 2>/dev/null || echo '0')
    echo "Active leases: $LEASE_COUNT"

    if [ "$LEASE_COUNT" -gt "0" ]; then
        echo ""
        echo "✅ SUCCESS: KEEPALIVE DEPLOYMENT ACTIVE"
        echo "Provider should now stay running with active lease!"
        exit 0
    else
        echo "❌ ERROR: Lease not active"
        exit 1
    fi

