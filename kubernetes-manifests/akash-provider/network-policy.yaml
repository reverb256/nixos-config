# Network policy for Akash provider namespace
# Allows: DNS, HTTPS to external RPC nodes, and internal cluster communication
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-provider-egress
  namespace: akash-services
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: provider
  policyTypes:
  - Egress
  egress:
  # Allow DNS resolution (both CoreDNS selectors)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow HTTPS to external RPC nodes
  - ports:
    - protocol: TCP
      port: 443
  # Allow HTTP fallback
  - ports:
    - protocol: TCP
      port: 80
  # Allow Kubernetes API server
  - to:
    - ipBlock:
        cidr: 10.0.0.0/16
    ports:
    - protocol: TCP
      port: 6443
  # Allow communication with cluster services (inventory, hostname operators)
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8081
    - protocol: TCP
      port: 8443
    - protocol: TCP
      port: 8444
---
# Allow inventory and hostname operator pods to reach external services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-operator-egress
  namespace: akash-services
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: provider
  policyTypes:
  - Egress
  egress:
  # DNS
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # HTTPS
  - ports:
    - protocol: TCP
      port: 443
  # Kubernetes API
  - to:
    - ipBlock:
        cidr: 10.0.0.0/16
    ports:
    - protocol: TCP
      port: 6443
  # Internal service mesh
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8081
    - protocol: TCP
      port: 8443
    - protocol: TCP
      port: 8444
