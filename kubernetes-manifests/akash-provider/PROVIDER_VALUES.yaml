# Akash Provider Helm Values - Production Configuration
# Chart: akash/provider 15.0.1 | App Version: 0.11.1
# Last Updated: 2026-04-02
# Source: https://github.com/akash-network/provider (official Context7 docs)

#
# =============================================================================
# PROVIDER IDENTITY
# =============================================================================
clusterPublicHostname: provider.reverb256.ca
domain: provider.reverb256.ca
providerAddress: akash1c6h804ky08tdpnxrv72vum783xuey09qgzt2p6
from: provider-wallet
email: admin@reverb256.ca
website: https://reverb256.ca

# =============================================================================
# IMAGE - latest stable release per support issue #422
# =============================================================================
image:
  repository: ghcr.io/akash-network/provider
  tag: 0.11.1
  pullPolicy: IfNotPresent

# =============================================================================
# BLOCKCHAIN CONNECTION
# =============================================================================
node: https://akash-rpc.polkachu.com:443
chainID: akashnet-2

# =============================================================================
# ENVIRONMENT
# =============================================================================
env:
  - name: AKASH_FROM
    value: "provider-wallet"
  - name: AP_CERT_ISSUER_EMAIL
    value: "admin@reverb256.ca"

# =============================================================================
# WITHDRAWAL PERIOD - disabled (prevents v0.11.x crash)
# =============================================================================
withdrawalperiod: ""

# =============================================================================
# BID PRICING
# =============================================================================
bidpricecpuscale: "0.004"
bidpricememoryscale: "0.0016"
bidpricestoragescale: "0.00016,beta2=0.00016,beta3=0.00016,ram=0.003"
bidpriceendpointscale: "1"
bidpriceipscale: "60"

# =============================================================================
# INGRESS & SERVICE
# =============================================================================
ingress:
  enabled: false

service:
  type: ClusterIP
  ports:
    - name: api
      port: 8443
      targetPort: api
    - name: grpc
      port: 8444
      targetPort: grpc

# =============================================================================
# LET'S ENCRYPT - disable
# =============================================================================
letsEncrypt:
  enabled: false

# =============================================================================
# RESOURCE LIMITS
# =============================================================================
resources:
  limits:
    cpu: "2"
    memory: 2Gi
  requests:
    cpu: "1"
    memory: 1Gi

# =============================================================================
# NODE SCHEDULING
# =============================================================================
tolerations: []

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: accelerator
          operator: In
          values:
          - nvidia-gpu
      - matchExpressions:
        - key: accelerator
          operator: In
          values:
          - amd-gpu

# =============================================================================
# INVENTORY OPERATOR
# =============================================================================
inventory:
  tolerations:
  - key: interactive
    operator: Equal
    value: "true"
    effect: NoExecute
  - key: workstation
    operator: Equal
    value: "true"
    effect: NoSchedule
  config:
    version: v1
    cluster_storage:
      - beta2
      - beta3
      - ram
    exclude:
      nodes:
        - ^zephyr.*
      node_storage: []

# =============================================================================
# HOSTNAME OPERATOR - Cloudflare DNS
# =============================================================================
hostname:
  cloudflare:
    enabled: true
    apiToken:
      valueFrom:
        secretKeyRef:
          name: cloudflare-dns-token
          key: CF_DNS_API_TOKEN

# =============================================================================
# CUSTOM INIT SCRIPT
# =============================================================================
scripts:
  init.sh: |
    #!/bin/bash
    set -x

    AKASH_HOME="${AKASH_HOME:-/root/.akash}"
    AKASH_KEYRING_BACKEND="${AKASH_KEYRING_BACKEND:-test}"
    AKASH_FROM="${AKASH_FROM:-provider-wallet}"
    EXPECTED_ADDRESS="akash1c6h804ky08tdpnxrv72vum783xuey09qgzt2p6"

    MNEMONIC="$(cat /boot-keys/mnemonic.txt)"

    echo "=== Importing Key from Mnemonic ==="
    echo "Expected address: $EXPECTED_ADDRESS"

    EXISTING_ADDRESS=$(provider-services --home="$AKASH_HOME" keys show "$AKASH_FROM" --keyring-backend="$AKASH_KEYRING_BACKEND" -a 2>/dev/null || echo "")

    if [ "$EXISTING_ADDRESS" = "$EXPECTED_ADDRESS" ]; then
        echo "Key already exists with correct address!"
    elif [ -n "$EXISTING_ADDRESS" ]; then
        echo "Key exists but has wrong address: $EXISTING_ADDRESS"
        echo "Deleting and re-importing..."
        provider-services --home="$AKASH_HOME" keys delete "$AKASH_FROM" --keyring-backend="$AKASH_KEYRING_BACKEND" -y || true
        echo "$MNEMONIC" | provider-services --home="$AKASH_HOME" keys add "$AKASH_FROM" --recover --keyring-backend="$AKASH_KEYRING_BACKEND" || exit 1
    else
        echo "Importing new key from mnemonic..."
        echo "$MNEMONIC" | provider-services --home="$AKASH_HOME" keys add "$AKASH_FROM" --recover --keyring-backend="$AKASH_KEYRING_BACKEND" || exit 1
    fi

    ACTUAL_ADDRESS=$(provider-services --home="$AKASH_HOME" keys show "$AKASH_FROM" --keyring-backend="$AKASH_KEYRING_BACKEND" -a)
    echo "Actual: $ACTUAL_ADDRESS"
    echo "Expected: $EXPECTED_ADDRESS"

    if [ "$ACTUAL_ADDRESS" != "$EXPECTED_ADDRESS" ]; then
        echo "Address mismatch!"
        exit 1
    fi

    echo "Key imported/verified successfully!"
    /scripts/wait_for_rpc.sh
    /scripts/create_provider.sh
    /scripts/refresh_provider_cert.sh

