apiVersion: apps/v1
kind: Deployment
metadata:
  name: mission-control
  namespace: orchestration
  labels:
    app: mission-control
    host: nexus
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mission-control
  template:
    metadata:
      labels:
        app: mission-control
        host: nexus
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["nexus"]
      automountServiceAccountToken: false
      containers:
        - name: mission-control
          image: ghcr.io/builderz-labs/mission-control:sha-503a289
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          env:
            - name: AUTH_USER
              value: "admin"
            - name: AUTH_PASS
              valueFrom:
                secretKeyRef:
                  name: mission-control-secrets
                  key: auth-pass
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: mission-control-secrets
                  key: api-key
            - name: PORT
              value: "3000"
            - name: NEXT_PUBLIC_GATEWAY_OPTIONAL
              value: "true"
            - name: MC_ALLOWED_HOSTS
              value: "mission-control.lan,mc.cluster.local,10.1.1.120,10.244.0.0/16,localhost,127.0.0.1"
            - name: MISSION_CONTROL_DATA_DIR
              value: "/data"
            - name: MC_CLAUDE_HOME
              value: "/hermes"
            - name: SKIP_AUTH_FOR_PROBES
              value: "true"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: hermes-home
              mountPath: /hermes
              readOnly: true
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mission-control-data
        - name: hermes-home
          hostPath:
            path: /home/j_kro
            type: Directory
        - name: tmp
          emptyDir: {}
