# Caddy Ingress Controller - Best Practices Setup
# Source: github.com/caddyserver/ingress (chart v1.3.0, app v0.2.1)
#
# Key design decisions for internal-only cluster:
# - disable-ssl-redirect annotation on all Ingress resources (no HTTP→HTTPS)
# - No TLS spec in Ingress resources (no cert generation)
# - NodePort service type (30080/30443) for access from host network
# - Pinned to nexus (46GB RAM, default workload target)
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: caddy-ingress-controller
  namespace: ingress-system
  labels:
    app.kubernetes.io/name: caddy-ingress-controller
    app.kubernetes.io/component: controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: caddy-ingress-controller
  labels:
    app.kubernetes.io/name: caddy-ingress-controller
    app.kubernetes.io/component: controller
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses/status"]
    verbs: ["update"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: caddy-ingress-controller
  labels:
    app.kubernetes.io/name: caddy-ingress-controller
    app.kubernetes.io/component: controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: caddy-ingress-controller
subjects:
  - kind: ServiceAccount
    name: caddy-ingress-controller
    namespace: ingress-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-ingress-controller-configmap
  namespace: ingress-system
  labels:
    app.kubernetes.io/name: caddy-ingress-controller
    app.kubernetes.io/component: controller
data:
  # No ACME and no email — internal-only domains (.lan, .cluster.local)
  # can't use Let's Encrypt. Caddy's built-in TLS will generate
  # self-signed certs for HTTPS (internal ACME).
  # The disable-ssl-redirect annotation on each Ingress prevents
  # HTTP→HTTPS redirect, allowing HTTP-only proxying from zephyr.
  acmeCA: ""
  email: ""
  debug: "false"
  metrics: "true"
  onDemandTLS: "false"
  proxyProtocol: "false"
  experimentalSmartSort: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy-ingress-controller
  namespace: ingress-system
  labels:
    app.kubernetes.io/name: caddy-ingress-controller
    app.kubernetes.io/component: controller
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: caddy-ingress-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: caddy-ingress-controller
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: caddy-ingress-controller
      nodeSelector:
        kubernetes.io/hostname: nexus
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: caddy-ingress-controller
          image: caddy/ingress:v0.2.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
            - name: metrics
              containerPort: 9765
              protocol: TCP
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          args:
            - -config-map=caddy-ingress-controller-configmap
            - -class-name=caddy
          readinessProbe:
            initialDelaySeconds: 3
            periodSeconds: 10
            httpGet:
              port: 9765
              path: /healthz
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: caddy-ingress-controller
  namespace: ingress-system
  labels:
    app.kubernetes.io/name: caddy-ingress-controller
    app.kubernetes.io/component: controller
spec:
  type: NodePort
  internalTrafficPolicy: Cluster
  externalTrafficPolicy: Cluster
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: http
      nodePort: 30080
    - name: https
      port: 443
      protocol: TCP
      targetPort: https
      nodePort: 30443
  selector:
    app.kubernetes.io/name: caddy-ingress-controller
