# NVIDIA GPU RuntimeClass
#
# This RuntimeClass allows pods to explicitly request the nvidia-container-runtime
# for GPU access, working with CDI (Container Device Interface) configuration.
#
# Usage: Add 'runtimeClassName: nvidia' to your GPU pod specs
#
# See: https://kubernetes.io/docs/concepts/containers/runtime-class/

apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: nvidia
handler: nvidia
overhead: null
scheduling:
  nodeSelector:
    # Only schedule on nodes with NVIDIA GPUs
    nvidia.com/gpu.present: "true"
---
# Alternative: RuntimeClass without node selector (if labels not set)
# Remove the nodeSelector section if GPU labels are not configured
