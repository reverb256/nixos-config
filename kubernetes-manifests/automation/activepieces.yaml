---
apiVersion: v1
kind: Secret
metadata:
  name: activepieces-secrets
  namespace: automation
type: Opaque
stringData:
  ap-api-key: "ap-sk-homelab-2026"
  ap-encryption-key: "ap-encryption-key-32chars-change"
  ap-jwt-secret: "ap-jwt-secret-change-me-32ch"
  postgres-password: "ap-postgres-2026"
  redis-password: "ap-redis-2026"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-activepieces
  namespace: automation
  labels:
    app: postgres-activepieces
spec:
  serviceName: postgres-activepieces
  replicas: 1
  selector:
    matchLabels:
      app: postgres-activepieces
  template:
    metadata:
      labels:
        app: postgres-activepieces
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [nexus]
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_DB
          value: activepieces
        - name: POSTGRES_USER
          value: activepieces
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: activepieces-secrets
              key: postgres-password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "activepieces"]
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "activepieces"]
          initialDelaySeconds: 5
          periodSeconds: 5
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: local-path
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-activepieces
  namespace: automation
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: postgres-activepieces
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-activepieces
  namespace: automation
  labels:
    app: redis-activepieces
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-activepieces
  template:
    metadata:
      labels:
        app: redis-activepieces
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [nexus]
      containers:
      - name: redis
        image: redis:7-alpine
        args: ["--requirepass", "$(REDIS_PASSWORD)"]
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: activepieces-secrets
              key: redis-password
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          exec:
            command: ["redis-cli", "-a", "$(REDIS_PASSWORD)", "ping"]
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          exec:
            command: ["redis-cli", "-a", "$(REDIS_PASSWORD)", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis-activepieces
  namespace: automation
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: redis-activepieces
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: activepieces
  namespace: automation
  labels:
    app: activepieces
spec:
  replicas: 1
  selector:
    matchLabels:
      app: activepieces
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: activepieces
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [nexus]
      containers:
      - name: activepieces
        image: activepieces/activepieces:0.37.2
        imagePullPolicy: IfNotPresent
        env:
        - name: AP_API_KEY
          valueFrom:
            secretKeyRef:
              name: activepieces-secrets
              key: ap-api-key
        - name: AP_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: activepieces-secrets
              key: ap-encryption-key
        - name: AP_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: activepieces-secrets
              key: ap-jwt-secret
        - name: AP_ENGINE_EXECUTABLE_PATH
          value: "dist/packages/engine/main.js"
        - name: AP_EXECUTION_MODE
          value: "UNSANDBOXED"
        - name: AP_NODE_EXECUTION_TIMEOUT
          value: "300"
        - name: AP_TELEMETRY_ENABLED
          value: "false"
        - name: AP_FRONTEND_URL
          value: "http://activepieces.automation.svc.cluster.local:80"
        - name: AP_WEBHOOK_TIMEOUT_SECONDS
          value: "30"
        - name: DB_TYPE
          value: "POSTGRES"
        - name: AP_POSTGRES_DATABASE
          value: "activepieces"
        - name: AP_POSTGRES_HOST
          value: "postgres-activepieces"
        - name: AP_POSTGRES_PORT
          value: "5432"
        - name: AP_POSTGRES_USERNAME
          value: "activepieces"
        - name: AP_POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: activepieces-secrets
              key: postgres-password
        - name: AP_REDIS_HOST
          value: "redis-activepieces"
        - name: AP_REDIS_PORT
          value: "6379"
        - name: AP_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: activepieces-secrets
              key: redis-password
        ports:
        - name: http
          containerPort: 80
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1"
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 45
          periodSeconds: 5
          timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: activepieces
  namespace: automation
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 80
  selector:
    app: activepieces
