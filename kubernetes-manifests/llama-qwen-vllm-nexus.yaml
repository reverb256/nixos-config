apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: llama-qwen-vllm-nexus
    host: nexus
    gpu: rtx3060ti
    app.kubernetes.io/managed-by: easykubenix
  name: llama-qwen-vllm-nexus
  namespace: ai-inference
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: llama-qwen-vllm-nexus
      host: nexus
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: llama-qwen-vllm-nexus
        host: nexus
        gpu: rtx3060ti
        app.kubernetes.io/managed-by: easykubenix
    spec:
      nodeName: nexus
      hostNetwork: true
      automountServiceAccountToken: false
      priorityClassName: high-priority-ai
      tolerations:
      - key: workstation
        operator: Exists
      - key: interactive
        operator: Exists
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: vllm
        image: ghcr.io/lillecarl/nix-csi/scratch:1.0.1
        imagePullPolicy: IfNotPresent
        command:
        - /nix/store/3kp34hyvqk7cpb8gf7diiz6y5wfg3b00-python3-3.12.13-env/bin/python3
        - -c
        - |
          import sys, os
          sys.path.insert(0, "/opt/vllm-python")
          import subprocess
          _orig = subprocess.check_output
          def _patch_ldconfig(cmd, *a, **kw):
              if isinstance(cmd, (list, tuple)) and len(cmd) == 2 and cmd[0] == "/sbin/ldconfig" and cmd[1] == "-p":
                  return b"libcuda.so.1 (libc6,x86-64) => /run/opengl-driver/lib/libcuda.so.1\n"
              return _orig(cmd, *a, **kw)
          subprocess.check_output = _patch_ldconfig
          vllm_site = "/tmp/vllm-test"
          sys.path.insert(1, "/opt/vllm-python")
          sys.path.insert(2, vllm_site)
          os.environ["PYTHONPATH"] = "/opt/vllm-python:" + vllm_site
          os.environ.setdefault("VLLM_WORKER_MULTIPROCESSING_METHOD", "spawn")
          import asyncio
          try:
              from turboquant.vllm_attn_backend import enable_no_alloc
              enable_no_alloc(key_bits=3, value_bits=4, buffer_size=128)
              print("TurboQuant KV compression: enabled (k3v4)", file=sys.stderr)
          except Exception as e:
              print(f"TurboQuant: {e}", file=sys.stderr)
          from vllm.entrypoints.openai.api_server import run_server, make_arg_parser
          from vllm.utils.argparse_utils import FlexibleArgumentParser
          parser = make_arg_parser(FlexibleArgumentParser())
          args = parser.parse_args()
          asyncio.run(run_server(args))
        - --model
        - /models/QuantTrio/Qwen3.5-2B-AWQ
        - --served-model-name
        - qwen3.5-2b-awq
        - --host
        - 0.0.0.0
        - --port
        - "8040"
        - --gpu-memory-utilization
        - "0.85"
        - --max-num-seqs
        - "16"
        - --max-model-len
        - "180000"
        - --quantization
        - awq
        - --enable-prefix-caching
        - --enforce-eager
        env:
        - name: LD_LIBRARY_PATH
          value: "/nix/store/si4q3zks5mn5jhzzyri9hhd3cv789vlm-gcc-15.2.0-lib/lib:/run/opengl-driver/lib"
        - name: CC
          value: /nix/store/qd70v8g0561vm8m33kmnp79z00cgyi5n-gcc-wrapper-15.2.0/bin/gcc
        - name: PATH
          value: /opt/cuda/bin:/usr/bin:/bin:/sbin
        - name: CUDA_HOME
          value: /opt/cuda
        - name: TRITON_PTXAS_PATH
          value: /opt/cuda/bin/ptxas
        - name: TRITON_CACHE_DIR
          value: /tmp/triton-cache
        - name: TRITON_MOCK_PTX_VERSION
          value: "12.9"
        resources:
          requests:
            cpu: "2"
            memory: 6Gi
          limits:
            cpu: "4"
            memory: 10Gi
            nvidia.com/gpu: "1"
        ports:
        - containerPort: 8040
          name: http
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: 8040
          initialDelaySeconds: 180
          periodSeconds: 30
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8040
          initialDelaySeconds: 90
          periodSeconds: 10
          failureThreshold: 10
        securityContext:
          privileged: true
        volumeMounts:
        - mountPath: /nix
          name: nix
          readOnly: true
        - mountPath: /run/opengl-driver/lib
          name: nvidia-libs
          readOnly: true
        - mountPath: /models
          name: models
          readOnly: true
        - mountPath: /tmp
          name: tmp
        - mountPath: /etc
          name: etc
          readOnly: true
        - mountPath: /sbin
          name: sbin
        - mountPath: /bin
          name: bin
          readOnly: true
        - mountPath: /usr
          name: usr
          readOnly: true
        - mountPath: /nix/store/si4q3zks5mn5jhzzyri9hhd3cv789vlm-gcc-15.2.0-lib/lib
          name: gcc-lib
          readOnly: true
        - mountPath: /opt/vllm-python
          name: sitecustomize
          readOnly: true
        - mountPath: /opt/cuda/bin
          name: cuda-bin
          readOnly: true
      volumes:
      - hostPath:
          path: /nix
          type: Directory
        name: nix
      - hostPath:
          path: /run/opengl-driver/lib
        name: nvidia-libs
      - hostPath:
          path: /home/j_kro/.lmstudio/models
        name: models
      - hostPath:
          path: /tmp
          type: Directory
        name: tmp
      - hostPath:
          path: /etc
          type: Directory
        name: etc
      - hostPath:
          path: /sbin
        name: sbin
      - hostPath:
          path: /bin
        name: bin
      - hostPath:
          path: /usr
        name: usr
      - hostPath:
          path: /nix/store/si4q3zks5mn5jhzzyri9hhd3cv789vlm-gcc-15.2.0-lib/lib
        name: gcc-lib
      - hostPath:
          path: /opt/vllm-python
        name: sitecustomize
      - hostPath:
          path: /opt/cuda/bin
        name: cuda-bin
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: llama-qwen-vllm-nexus
    app.kubernetes.io/managed-by: easykubenix
  name: llama-qwen-vllm-nexus
  namespace: ai-inference
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8040
    protocol: TCP
    targetPort: 8040
  selector:
    app: llama-qwen-vllm-nexus
    host: nexus
