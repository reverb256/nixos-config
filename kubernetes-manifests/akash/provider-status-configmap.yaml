apiVersion: v1
kind: ConfigMap
metadata:
  name: provider-status-page
  namespace: akash-services
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>reverb256 Akash Provider Status</title>
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
                color: #eaeaea;
                min-height: 100vh;
                padding: 20px;
            }
            .container { max-width: 1200px; margin: 0 auto; }
            .header { text-align: center; margin-bottom: 40px; padding: 40px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
            .header h1 { font-size: 2.5rem; margin-bottom: 10px; background: linear-gradient(90deg, #00d4ff, #7c3aed); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
            .status-badge { display: inline-block; padding: 8px 16px; border-radius: 20px; font-weight: 600; font-size: 0.9rem; }
            .status-online { background: #10b981; }
            .status-warning { background: #f59e0b; }
            .status-error { background: #ef4444; }
            .last-updated { color: #9ca3af; font-size: 0.9rem; }
            .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 40px; }
            .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 24px; backdrop-filter: blur(10px); }
            .card h3 { font-size: 1.2rem; margin-bottom: 16px; color: #00d4ff; }
            .metric { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
            .metric:last-child { border-bottom: none; }
            .metric-label { color: #9ca3af; }
            .metric-value { font-weight: 600; color: #10b981; }
            .resource-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 16px; }
            .resource-item { background: rgba(0,0,0,0.2); padding: 12px; border-radius: 8px; text-align: center; }
            .resource-item .name { font-size: 0.9rem; color: #9ca3af; }
            .resource-item .value { font-size: 1.5rem; font-weight: bold; }
            .resource-item .unit { font-size: 0.8rem; color: #6b7280; }
            .footer { text-align: center; padding: 40px 0; color: #9ca3af; font-size: 0.9rem; }
            .footer a { color: #00d4ff; text-decoration: none; }
            .footer a:hover { text-decoration: underline; }
            @media (max-width: 768px) { .header h1 { font-size: 1.8rem; } .grid { grid-template-columns: 1fr; } }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="header">
                <h1>reverb256</h1>
                <p>Akash Decentralized Cloud Provider</p>
                <div style="margin-top: 16px;"><span class="status-badge status-warning">⚠️ AWAITING VERIFICATION</span></div>
                <p class="last-updated">Last updated: <span id="updated">Loading...</span></p>
            </div>
            <div class="grid">
                <div class="card">
                    <h3>📋 Provider Info</h3>
                    <div class="metric"><span class="metric-label">Address</span><span class="metric-value" style="font-family: monospace; font-size: 0.9rem;">akash1c6h8...gzt2p6</span></div>
                    <div class="metric"><span class="metric-label">Public Hostname</span><span class="metric-value">provider.reverb256.ca</span></div>
                    <div class="metric"><span class="metric-label">Version</span><span class="metric-value">v0.10.7-v12</span></div>
                    <div class="metric"><span class="metric-label">Region</span><span class="metric-value">US West (homelab)</span></div>
                </div>
                <div class="card">
                    <h3>🖥️ Available Capacity</h3>
                    <div class="resource-grid">
                        <div class="resource-item"><div class="name">CPUs</div><div class="value">78</div><div class="unit">cores</div></div>
                        <div class="resource-item"><div class="name">GPUs</div><div class="value">5</div><div class="unit">× NVIDIA</div></div>
                        <div class="resource-item"><div class="name">Memory</div><div class="value">111</div><div class="unit">GB</div></div>
                        <div class="resource-item"><div class="name">Storage</div><div class="value">2+</div><div class="unit">TB</div></div>
                    </div>
                </div>
                <div class="card">
                    <h3>🎮 GPU Inventory</h3>
                    <div class="metric"><span class="metric-label">Forge</span><span class="metric-value">2× RTX 4060</span></div>
                    <div class="metric"><span class="metric-label">Nexus</span><span class="metric-value">1× NVIDIA</span></div>
                    <div class="metric"><span class="metric-label">Zephyr</span><span class="metric-value">2× NVIDIA</span></div>
                </div>
                <div class="card">
                    <h3>📊 Current Status</h3>
                    <div class="metric"><span class="metric-label">Active Leases</span><span class="metric-value">0</span></div>
                    <div class="metric"><span class="metric-label">Provider Status</span><span class="metric-value" style="color: #10b981;">● Online</span></div>
                </div>
                <div class="card">
                    <h3>💰 Pricing</h3>
                    <div class="metric"><span class="metric-label">CPU</span><span class="metric-value">0.004 uakt/mCPU/s</span></div>
                    <div class="metric"><span class="metric-label">Memory</span><span class="metric-value">0.0016 uakt/MB/s</span></div>
                    <div class="metric"><span class="metric-label">Storage</span><span class="metric-value">0.00016 uakt/MB/s</span></div>
                </div>
            </div>
            <div class="footer">
                <p>Powered by <a href="https://akash.network" target="_blank">Akash Network</a> |
                <a href="https://cloudmos.io" target="_blank">Deploy on Cloudmos</a> |
                <a href="https://docs.akash.network" target="_blank">Documentation</a></p>
                <p style="margin-top: 16px; opacity: 0.7;">Questions? <a href="mailto:admin@reverb256.ca">admin@reverb256.ca</a></p>
            </div>
        </div>
        <script>
            document.getElementById('updated').textContent = new Date().toLocaleString();
            setInterval(() => { document.getElementById('updated').textContent = new Date().toLocaleString(); }, 30000);
        </script>
    </body>
    </html>
