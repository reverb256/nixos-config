---
# CPU-only test deployment for Akash provider validation
# This deploys a web service that uses CPU only (no GPU contention)

apiVersion: v1
kind: Namespace
metadata:
  name: akash-cpu-test
  labels:
    purpose: akash-provider-testing

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-test
  namespace: akash-cpu-test
  labels:
    app: nginx-test
    workload-type: cpu-only
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-test
  template:
    metadata:
      labels:
        app: nginx-test
        workload-type: cpu-only
    spec:
      priorityClassName: akash-tenant
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - nginx-test
              topologyKey: kubernetes.io/hostname
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 250m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-test
  namespace: akash-cpu-test
spec:
  selector:
    app: nginx-test
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP

---
# CPU stress test to verify resource allocation
apiVersion: v1
kind: Pod
metadata:
  name: cpu-stress-test
  namespace: akash-cpu-test
  labels:
    app: stress-test
    workload-type: cpu-only
spec:
  priorityClassName: akash-tenant
  containers:
  - name: stress
    image: polinux/stress
    command: ["stress"]
    args: ["--cpu", "2", "--timeout", "300s", "--vm", "1", "--vm-bytes", "128M"]
    resources:
      requests:
        cpu: 500m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi
  restartPolicy: Never

---
# Memory stress test
apiVersion: v1
kind: Pod
metadata:
  name: memory-stress-test
  namespace: akash-cpu-test
  labels:
    app: stress-test
    workload-type: cpu-only
spec:
  priorityClassName: akash-tenant
  containers:
  - name: stress
    image: polinux/stress
    command: ["stress"]
    args: ["--vm", "2", "--vm-bytes", "256M", "--timeout", "300s"]
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
  restartPolicy: Never

---
# Network connectivity test
apiVersion: v1
kind: Pod
metadata:
  name: network-test
  namespace: akash-cpu-test
  labels:
    app: network-test
    workload-type: cpu-only
spec:
  priorityClassName: akash-tenant
  containers:
  - name: test
    image: nicolaka/netshoot
    command: ["sh", "-c"]
    args:
      - |
        echo "=== DNS Test ==="
        nslookup kubernetes.default.svc.cluster.local
        echo ""
        echo "=== External Connectivity Test ==="
        ping -c 3 8.8.8.8
        echo ""
        echo "=== HTTP Test ==="
        curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" https://www.google.com
        echo ""
        echo "=== Inter-pod Communication Test ==="
        wget -qO- http://nginx-test/ | head -5
        echo ""
        echo "All network tests completed!"
  restartPolicy: Never
