# Core Kubernetes Services - High Priority PDBs
# These services are critical for cluster operation
# NOTE: k3s auto-creates a coredns PDB - do not duplicate
# ---

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: metrics-server-pdb
  namespace: kube-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      k8s-app: metrics-server
# NOTE: ingress-nginx namespace unused (using caddy via ingress-system)
# ---

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nvidia-device-plugin-pdb
  namespace: kube-system
spec:
  minAvailable: 2
  selector:
    matchLabels:
      name: nvidia-device-plugin-ds
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: amdgpu-device-plugin-pdb
  namespace: kube-system
spec:
  minAvailable: 2
  selector:
    matchLabels:
      name: amdgpu-device-plugin-daemonset
