apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ai-inference
  namespace: ai-inference
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ai-inference
    - namespaceSelector:
        matchLabels:
          name: auth
    - namespaceSelector:
        matchLabels:
          name: search
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: ai-inference
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to: []
    ports:
    - protocol: TCP
      port: 443
