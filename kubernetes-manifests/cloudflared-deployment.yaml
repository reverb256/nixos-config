apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-tunnel
  namespace: akash-services
  labels:
    app: cloudflared-tunnel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared-tunnel
  template:
    metadata:
      labels:
        app: cloudflared-tunnel
    spec:
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:2024.8.2
        command: ["cloudflared"]
        args: ["tunnel", "--config", "/etc/cloudflared/config.yml", "--metrics", "0.0.0.0:54163", "run"]
        env:
        - name: TUNNEL_CREDENTIAL_FILE
          value: "/etc/cloudflared/credentials.json"
        volumeMounts:
        - name: config
          mountPath: /etc/cloudflared
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        # TODO: Fix metrics endpoint - health probes disabled temporarily
        # livenessProbe:
        #   httpGet:
        #     path: /metrics
        #     port: 54163
        #   initialDelaySeconds: 10
        #   periodSeconds: 10
        # readinessProbe:
        #   httpGet:
        #     path: /metrics
        #     port: 54163
        #   initialDelaySeconds: 5
        #   periodSeconds: 5
      volumes:
      - name: config
        projected:
          sources:
          - secret:
              name: cloudflared-tunnel-credentials
              items:
              - key: credentials.json
                path: credentials.json
          - configMap:
              name: cloudflared-config
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: cloudflared-metrics
  namespace: akash-services
  labels:
    app: cloudflared-tunnel
spec:
  type: ClusterIP
  ports:
  - port: 20241
    targetPort: 20241
    name: metrics
  selector:
    app: cloudflared-tunnel
