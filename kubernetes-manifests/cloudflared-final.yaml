# Cloudflare Tunnel Deployment
# Secure tunnel to Cloudflare edge for external access

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-tunnel
  namespace: akash-services
  labels:
    app: cloudflared-tunnel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared-tunnel
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: cloudflared-tunnel
    spec:
      # POD LEVEL SECURITY CONTEXT
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:2026.3.0
        imagePullPolicy: IfNotPresent
        command:
        - cloudflared
        args:
        - tunnel
        - --config
        - /etc/cloudflared/config.yml
        - run
        - --no-autoupdate
        # CONTAINER LEVEL SECURITY CONTEXT
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - name: metrics
          containerPort: 20241
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /metrics
            port: metrics
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /metrics
            port: metrics
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: config
          mountPath: /etc/cloudflared
          readOnly: true
      volumes:
      - name: tmp
        emptyDir: {}
      - name: config
        projected:
          defaultMode: 420
          sources:
          - configMap:
              name: cloudflared-final-config
          - secret:
              items:
              - key: credentials.json
                path: credentials.json
              name: cloudflared-final-credentials
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
