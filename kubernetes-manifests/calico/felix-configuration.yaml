apiVersion: crd.projectcalico.org/v1
kind: FelixConfiguration
metadata:
  name: default
spec:
  ipv6Support: false
  healthPort: 9097
  # Use iptables-nft backend to match K3s kube-router.
  # On NixOS, `iptables` is iptables-nft. Auto detects this.
  # Legacy mode creates rules in iptables-legacy, splitting
  # NAT DNAT rules across two separate nftables tables.
  iptablesBackend: Auto
  # Disable nftables native mode — use iptables compat instead.
  # Felix nftablesMode conflicts with K3s kube-router iptables rules.
  nftablesMode: Disabled
