# Akash Provider Helm Values - LATEST VERSION
# Using v0.11.0 (released 2026-03-22) with image override
# Helm chart: 14.0.8 (designed for 0.10.7, but compatible)
# Troubleshooting: "client is not running" error caused by:
#   1. AKASH_WITHDRAWAL_PERIOD: 1h (FIXED: set to "" to disable)
#   2. Manifest service context canceled (HOPEFULLY FIXED in 0.11.0)
# Last Updated: 2026-03-23 13:10 UTC

clusterPublicHostname: provider.reverb256.ca
domain: provider.reverb256.ca
providerAddress: akash1c6h804ky08tdpnxrv72vum783xuey09qzt2p6
from: provider-wallet
email: admin@reverb256.ca
website: https://reverb256.ca

# Using v0.11.0 (latest stable release)
image:
  repository: ghcr.io/akash-network/provider
  tag: "0.11.0"
  pullPolicy: IfNotPresent

# CRITICAL: Custom init script that imports mnemonic using --recover flag
# Based on working configuration from commit 740804b
scripts:
  init.sh: |
    #!/bin/bash
    set -x

    AKASH_HOME="${AKASH_HOME:-/root/.akash}"
    AKASH_KEYRING_BACKEND="${AKASH_KEYRING_BACKEND:-test}"
    AKASH_FROM="${AKASH_FROM:-provider-wallet}"
    EXPECTED_ADDRESS="akash1c6h804ky08tdpnxrv72vum783xuey09qgzt2p6"

    # Read mnemonic from mounted file
    MNEMONIC="$(cat /boot-keys/mnemonic.txt)"

    echo "=== Importing Key from Mnemonic ==="
    echo "Expected address: $EXPECTED_ADDRESS"

    # Check if key already exists
    EXISTING_ADDRESS=$(provider-services --home="$AKASH_HOME" keys show "$AKASH_FROM" --keyring-backend="$AKASH_KEYRING_BACKEND" -a 2>/dev/null || "")

    if [ "$EXISTING_ADDRESS" = "$EXPECTED_ADDRESS" ]; then
        echo "✓ Key already exists with correct address!"
    elif [ -n "$EXISTING_ADDRESS" ]; then
        echo "Key exists but has wrong address: $EXISTING_ADDRESS"
        echo "Deleting and re-importing..."
        provider-services --home="$AKASH_HOME" keys delete "$AKASH_FROM" --keyring-backend="$AKASH_KEYRING_BACKEND" || true
        echo "$MNEMONIC" | provider-services --home="$AKASH_HOME" keys add "$AKASH_FROM" \
            --recover \
            --keyring-backend="$AKASH_KEYRING_BACKEND" || exit 1
    else
        echo "Importing new key from mnemonic..."
        echo "$MNEMONIC" | provider-services --home="$AKASH_HOME" keys add "$AKASH_FROM" \
            --recover \
            --keyring-backend="$AKASH_KEYRING_BACKEND" || exit 1
    fi

    # Verify the address
    ACTUAL_ADDRESS=$(provider-services --home="$AKASH_HOME" keys show "$AKASH_FROM" --keyring-backend="$AKASH_KEYRING_BACKEND" -a)
    echo "Actual: $ACTUAL_ADDRESS"
    echo "Expected: $EXPECTED_ADDRESS"

    if [ "$ACTUAL_ADDRESS" = "$EXPECTED_ADDRESS" ]; then
        echo "✓ Key imported/verified successfully!"
        /scripts/wait_for_rpc.sh
        echo "✓ Ready to start provider"
    else
        echo "✗ Address mismatch!"
        exit 1
    fi

  run.sh: |
    #!/bin/bash

    # fail fast should these packages be missing
    type curl || exit 1
    type jq || exit 1
    type awk || exit 1
    type bc || exit 1

    ##
    # Wait for RPC
    ##
    bash /scripts/wait_for_rpc.sh

    ##
    # Create/Update Provider certs
    ##
    bash /scripts/refresh_provider_cert.sh

    # Build provider-services run command with optional certificate issuer flags
    PROVIDER_CMD="/usr/bin/provider-services run"

    # Add certificate issuer flags if enabled (HTTP challenge default, DNS providers optional)
    if [[ "${AP_CERT_ISSUER_ENABLED}" == "true" ]]; then
        PROVIDER_CMD="${PROVIDER_CMD} --cert-issuer-enabled=true"

        if [[ -n "${AP_CERT_ISSUER_EMAIL}" ]]; then
            PROVIDER_CMD="${PROVIDER_CMD} --cert-issuer-email=${AP_CERT_ISSUER_EMAIL}"
        fi

        if [[ -n "${AP_CERT_ISSUER_CA_DIR_URL}" ]]; then
            PROVIDER_CMD="${PROVIDER_CMD} --cert-issuer-ca-dir-url=${AP_CERT_ISSUER_CA_DIR_URL}"
        fi

        if [[ -n "${AP_CERT_ISSUER_DNS_PROVIDERS}" ]]; then
            PROVIDER_CMD="${PROVIDER_CMD} --cert-issuer-dns-providers=${AP_CERT_ISSUER_DNS_PROVIDERS}"
        fi

        if [[ -n "${AP_CERT_ISSUER_HTTP_CHALLENGE_PORT}" ]]; then
            PROVIDER_CMD="${PROVIDER_CMD} --cert-issuer-http-challenge-port=${AP_CERT_ISSUER_HTTP_CHALLENGE_PORT}"
        fi
    fi

    # Debug: Print the final command to see all flags
    echo "=== Provider Command Debug ==="
    echo "AP_CERT_ISSUER_ENABLED: ${AP_CERT_ISSUER_ENABLED}"
    echo "AP_CERT_ISSUER_EMAIL: ${AP_CERT_ISSUER_EMAIL}"
    echo "AP_CERT_ISSUER_CA_DIR_URL: ${AP_CERT_ISSUER_CA_DIR_URL}"
    echo "AP_CERT_ISSUER_DNS_PROVIDERS: ${AP_CERT_ISSUER_DNS_PROVIDERS}"
    echo "AP_CERT_ISSUER_HTTP_CHALLENGE_PORT: ${AP_CERT_ISSUER_HTTP_CHALLENGE_PORT}"
    echo "Final command: ${PROVIDER_CMD}"
    echo "=============================="

    # Start provider-services and monitor its output
    runcmd=${PROVIDER_CMD}

    run_debug=${AKASH_DEBUG:-false}
    dlv_port=${AKASH_DEBUG_DELVE_PORT:-2345}

    if [[ $run_debug == "true" ]]; then
        if command /go/bin/dlv; then
            runcmd="/go/bin/dlv --listen=:${dlv_port} --headless=true --api-version=2 --log exec -- ${PROVIDER_CMD}"
        else
            echo "AKASH_DEBUG is set, but no dlv is present in the image. check if docker image has debug suffix"
        fi
    fi

    ${runcmd}

  wait_for_rpc.sh: |
    #!/bin/bash

    # fail fast should these packages be missing
    type curl || exit 1
    type jq || exit 1
    type awk || exit 1
    type bc || exit 1

    ##
    # Wait for RPC
    ##
    NODE=${AKASH_NODE:-https://akash-rpc.polkachu.com:443}
    GENESIS=${AKASH_GENESIS:-}
    CHAIN_ID=${AKASH_CHAIN_ID:-}

    if [[ -z "$NODE" ]]; then
        echo "AKASH_NODE is required"
        exit 1
    fi

    # extract ip:port from node if https
    # this is needed for nc check
    if [[ "$NODE" =~ https:// ]]; then
        NODE_URL=$(echo "$NODE" | sed 's|https://||')
        solo_ip=$(echo "$NODE_URL" | cut -d: -f2 | cut -d/ -f1)
        port=$(echo "$NODE_URL" | cut -d: -f3 | cut -d/ -f1)
    else
        solo_ip=$(echo "$NODE" | cut -d: -f1)
        port=$(echo "$NODE" | cut -d: -f2)
    fi

    # Check if we can reach the RPC node
    if [[ "$NODE" =~ https:// ]]; then
        if ! nc -z -v -w5 "$solo_ip" "$port"; then
            echo "RPC node $NODE is not reachable"
            exit 1
        fi
    fi

    # Wait for node to be ready
    echo "Waiting for Akash RPC $NODE to be ready..."
    while true; do
        # Check if we can reach the node
        if [[ "$NODE" =~ https:// ]]; then
            CATCHING_UP=$(curl -s "$NODE/status" | jq -r '.result.sync_info.catching_up')
        else
            CATCHING_UP=$(curl -s "http://$NODE/status" | jq -r '.result.sync_info.catching_up')
        fi

        if [[ "$CATCHING_UP" == "false" ]]; then
            # Check latest block time
            if [[ "$NODE" =~ https:// ]]; then
                DATE_AKASH=$(curl -s "$NODE/status" | jq -r '.result.sync_info.latest_block_time')
            else
                DATE_AKASH=$(curl -s "http://$NODE/status" | jq -r '.result.sync_info.latest_block_time')
            fi

            TS_AKASH=$(date +%s --date "$DATE_AKASH")
            TS=$(date +%s)
            DIFF=$((TS - TS_AKASH))

            echo "Last block Akash RPC $NODE seen was $DIFF seconds ago"

            if [[ $DIFF -gt 30 ]]; then
                echo "Akash node not ready. Retrying"
                sleep 15
                continue
            fi

            echo "Last block Akash RPC $NODE seen was $DIFF seconds ago => OK"
            break
        fi

        sleep 5
    done

    echo "Akash RPC $NODE is ready"

  refresh_provider_cert.sh: |
    #!/bin/bash

    # fail fast should these packages be missing
    type curl || exit 1
    type jq || exit 1
    type awk || exit 1
    type bc || exit 1
    type openssl || exit 1

    set -e
    set -o pipefail

    echo "Generating new provider certificate"

    # Get provider address from on-chain
    PROVIDER_ADDRESS=$(provider-services query provider get --owner=$AKASH_FROM --output=json | jq -r '.address')

    # Generate a private key
    openssl genrsa -out /tmp/provider.key 2048

    # Generate a CSR
    openssl req -new -key /tmp/provider.key -out /tmp/provider.csr -subj "/CN=$PROVIDER_ADDRESS"

    # Send certificate signing request to blockchain
    provider-services tx cert create provider --from=$AKASH_FROM --cert-file=/tmp/provider.csr

    # Wait for certificate to be created
    echo "Waiting for certificate to be created on-chain..."
    sleep 10

    # Download certificate from blockchain
    provider-services query cert get --owner=$AKASH_FROM --output=/tmp/provider.pem

    # Verify certificate
    openssl x509 -in /tmp/provider.pem -noout -text

    echo "Certificate generated successfully"

# Extra environment variables for provider container
extraEnvs:
  - name: CF_DNS_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-dns-token
        key: CF_DNS_API_TOKEN

# Disable ingress (we use Cloudflare tunnel)
ingress:
  enabled: false

# CRITICAL: Enable Let's Encrypt with Cloudflare DNS-01 challenge
# Required for Gateway REST server TLS certificates (port 8443)
#
# NOTE: Provider binary expects DNS provider name "cf" not "cloudflare"
# The Helm chart ConfigMap template incorrectly uses "cloudflare"
# Manual patch required: kubectl patch configmap akash-provider-letsencrypt \
#   -n akash-services --type=json -p='[{"op":"replace","path":"/data/AP_CERT_ISSUER_DNS_PROVIDERS","value":"cf"}]'
letsEncrypt:
  enabled: true
  acme:
    email: "admin@reverb256.ca"
    caDirUrl: "https://acme-v02.api.letsencrypt.org/directory"
  providers:
    cloudflare:
      enabled: true

# Use ClusterIP (exposed via Cloudflare tunnel)
service:
  type: ClusterIP

# Resource limits (must comply with namespace LimitRange of 2Gi)
# Reduced to fit within available memory on zephyr node (only 1GB available)
resources:
  limits:
    cpu: "2"
    memory: 1Gi
  requests:
    cpu: "500m"
    memory: 512Mi

# Tolerations for workstation nodes (zephyr)
tolerations:
  - key: interactive
    operator: Equal
    value: "true"
    effect: NoExecute
  - key: workstation
    operator: Equal
    value: "true"
    effect: NoSchedule

# Inventory operator configuration with tolerations for hardware-discovery pods
inventory:
  tolerations:
    - key: interactive
      operator: Equal
      value: "true"
      effect: NoExecute
    - key: workstation
      operator: Equal
      value: "true"
      effect: NoSchedule

# Node affinity to prefer GPU nodes
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: accelerator
              operator: In
              values:
                - nvidia-gpu
                - amd-gpu

# CRITICAL: These secrets MUST exist before deployment
# Pre-install commands:
# kubectl create secret generic akash-provider-keys \
#   --from-literal=mnemonic.txt="zebra unknown capital train decide glue sphere acid actual focus lounge green ancient never visual either glimpse vault verb athlete tiger lamp catch jewel" \
#   --from-literal=key-pass.txt="password12345678"

# RPC node configuration (using fast, synced node)
# Updated 2026-03-23: Using Polkachu RPC endpoint with HTTPS
# Cosmos SDK RPC client works with HTTPS via reverse proxy
node: https://akash-rpc.polkachu.com:443
