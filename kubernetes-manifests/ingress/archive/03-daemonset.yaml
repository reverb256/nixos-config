apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: caddy-ingress
  namespace: ingress-system
  labels:
    app.kubernetes.io/name: caddy-ingress
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: caddy-ingress
  template:
    metadata:
      labels:
        app.kubernetes.io/name: caddy-ingress
    spec:
      serviceAccountName: caddy-ingress
      imagePullSecrets:
      - name: ghcr-pull-secret
      # No hostNetwork - use regular pod network
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/os
                operator: In
                values: ["linux"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["zephyr"]
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: caddy
        image: ghcr.io/reverb256/caddy-ingress:v2.8.0
        args:
          - caddy-with-modules
          - run
          - --config
          - /config/Caddyfile
          - --adapter
          - caddyfile
        ports:
        - name: http
          containerPort: 80
        - name: https
          containerPort: 443
        - name: admin
          containerPort: 2019
        livenessProbe:
          httpGet:
            path: /config
            port: admin
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /config
            port: admin
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: data
          mountPath: /data
        - name: cert-storage
          mountPath: /.local
        securityContext:
          runAsUser: 0
          runAsGroup: 0
      volumes:
      - name: config
        configMap:
          name: caddy-config
      - name: data
        emptyDir: {}
      - name: cert-storage
        emptyDir: {}
