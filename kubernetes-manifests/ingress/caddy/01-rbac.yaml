# Caddy Ingress Controller — RBAC
# Source: caddyserver/ingress chart v1.3.0 (controller v0.2.1)
# https://github.com/caddyserver/ingress
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: caddy-ingress-controller
  namespace: ingress-system
  labels:
    app.kubernetes.io/name: caddy-ingress-controller
    app.kubernetes.io/component: controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: caddy-ingress-controller-role
  labels:
    app.kubernetes.io/name: caddy-ingress-controller
rules:
  - apiGroups: [""]
    resources: [ingresses, ingresses/status]
    verbs: ["*"]
  - apiGroups: ["networking.k8s.io"]
    resources: [ingresses, ingresses/status]
    verbs: ["*"]
  - apiGroups: ["coordination.k8s.io"]
    resources: [leases]
    verbs: ["*"]
  - apiGroups: [""]
    resources: [secrets]
    verbs: ["*"]
  - apiGroups: [""]
    resources: [services, pods, nodes, configmaps]
    verbs: [list, get, watch]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: caddy-ingress-controller-role-binding
roleRef:
  kind: ClusterRole
  name: caddy-ingress-controller-role
  apiGroup: rbac.authorization.k8s.io
subjects:
- kind: ServiceAccount
  name: caddy-ingress-controller
  namespace: ingress-system
