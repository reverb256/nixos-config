# Caddy Ingress Controller — Deployment
# Source: caddyserver/ingress chart v1.3.0 (controller v0.2.1)
# https://github.com/caddyserver/ingress
#
# Scheduled to nexus (46GB RAM, default workload node).
# Excludes zephyr per AGENTS.md OOM rules.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy-ingress-controller
  namespace: ingress-system
  labels:
    app.kubernetes.io/name: caddy-ingress-controller
    app.kubernetes.io/component: controller
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: caddy-ingress-controller
      app.kubernetes.io/component: controller
  strategy:
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: caddy-ingress-controller
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: caddy-ingress-controller
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      # Schedule to nexus per AGENTS.md workload rules
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [nexus]
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: caddy-ingress-controller
        image: caddy/ingress:v0.2.1
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add: [NET_BIND_SERVICE]
            drop: [ALL]
          runAsUser: 0
          runAsGroup: 0
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        - name: https
          containerPort: 443
          protocol: TCP
        - name: metrics
          containerPort: 9765
          protocol: TCP
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        args:
        - -config-map=caddy-ingress-controller-configmap
        - -class-name=caddy
        readinessProbe:
          httpGet:
            path: /healthz
            port: 9765
          initialDelaySeconds: 3
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
