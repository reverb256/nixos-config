# Caddy Ingress Controller — Example Ingress Resources
#
# Internal cluster services accessible via .lan domains.
# Caddy auto-provisions self-signed TLS certs for internal domains.
# For Tailscale domains (.ts.net), Caddy obtains certs via Tailscale DERP.
#
# Test with: curl -k https://openwebui.lan:30443

---
# Open WebUI — AI chat interface
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openwebui
  namespace: ai-inference
  labels:
    app.kubernetes.io/name: openwebui
  annotations:
    caddy.k8s.io/tls-internal: "true"
spec:
  ingressClassName: caddy
  rules:
    - host: openwebui.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: open-webui
                port:
                  number: 8080
    - host: openwebui.cluster.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: open-webui
                port:
                  number: 8080
