apiVersion: v1
kind: Service
metadata:
  name: caddy-ingress-staging
  namespace: caddy-ingress
  labels:
    app.kubernetes.io/name: caddy-ingress
    app.kubernetes.io/component: controller
    app.kubernetes.io/environment: staging
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: caddy-ingress
    app.kubernetes.io/component: controller
    app.kubernetes.io/environment: staging
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  - name: https
    port: 443
    targetPort: 443
    protocol: TCP
