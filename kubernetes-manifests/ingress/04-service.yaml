---
# Internal cluster access (ClusterIP only)
apiVersion: v1
kind: Service
metadata:
  name: caddy-ingress-internal
  namespace: ingress-system
  labels:
    app.kubernetes.io/name: caddy-ingress
    app.kubernetes.io/component: ingress
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: caddy-ingress
    app.kubernetes.io/component: ingress
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  - name: https
    port: 443
    targetPort: https
    protocol: TCP

---
# Admin API service (for metrics and management)
apiVersion: v1
kind: Service
metadata:
  name: caddy-admin
  namespace: ingress-system
  labels:
    app.kubernetes.io/name: caddy-ingress
    app.kubernetes.io/component: ingress
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: caddy-ingress
    app.kubernetes.io/component: ingress
  ports:
  - name: admin
    port: 2019
    targetPort: admin
    protocol: TCP
