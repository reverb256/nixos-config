# Service Account for Caddy Ingress
apiVersion: v1
kind: ServiceAccount
metadata:
  name: caddy-ingress
  namespace: ingress-system
  labels:
    app.kubernetes.io/name: caddy-ingress
    app.kubernetes.io/component: ingress

---
# RBAC: ClusterRole for Caddy to watch Ingress resources
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: caddy-ingress
  labels:
    app.kubernetes.io/name: caddy-ingress
    app.kubernetes.io/component: ingress
rules:
  # Ingress watching
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  # Service discovery
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list", "watch"]
  # Secret watching for TLS certificates
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  # ConfigMap watching for dynamic config
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]

---
# ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: caddy-ingress
  labels:
    app.kubernetes.io/name: caddy-ingress
    app.kubernetes.io/component: ingress
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: caddy-ingress
subjects:
  - kind: ServiceAccount
    name: caddy-ingress
    namespace: ingress-system
