# Caddy Configuration - Complete Caddyfile for Cluster Ingress
# This ConfigMap contains the full configuration with all services enabled
apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-config
  namespace: ingress-system
  labels:
    app.kubernetes.io/name: caddy-ingress
    app.kubernetes.io/component: ingress
data:
  Caddyfile: |
    {
      # Admin API on all interfaces for Kubernetes health probes
      admin 0.0.0.0:2019

      # Auto HTTPS with Let's Encrypt
      email admin@cluster.local

      # Default SNI for internal services
      default_sni cluster.local
    }

    # Common security headers snippet
    (security_headers) {
      header {
        # Enable HSTS with 1 year max age
        Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"

        # Prevent content type sniffing
        X-Content-Type-Options "nosniff"

        # Prevent clickjacking
        X-Frame-Options "SAMEORIGIN"

        # XSS protection
        X-XSS-Protection "1; mode=block"

        # Referrer policy
        Referrer-Policy "strict-origin-when-cross-origin"

        # Content Security Policy (basic - services can override)
        Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https:"

        # Remove server header
        -Server
      }
    }

    # Common compression snippet
    (compression) {
      encode zstd gzip
    }

    # ============================================================================
    # CLUSTER INTERNAL SERVICES (.cluster.local)
    # ============================================================================

    # AI Inference Gateway
    # NOT DEPLOYED: Service exists but has no matching pods (0/0 replicas)
