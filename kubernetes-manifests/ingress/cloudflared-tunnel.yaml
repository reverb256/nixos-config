---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-tunnel
  namespace: cloudflared
  labels:
    app: cloudflared-tunnel
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cloudflared-tunnel
  template:
    metadata:
      labels:
        app: cloudflared-tunnel
    spec:
      nodeName: nexus
      containers:
        - name: cloudflared
          image: docker.io/cloudflare/cloudflared:2026.7.1
          imagePullPolicy: IfNotPresent
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config/config.yaml
            - run
          env:
            - name: NO_AUTOUPDATE
              value: "true"
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            failureThreshold: 5
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            failureThreshold: 5
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: tunnel-config
              mountPath: /etc/cloudflared/config
            - name: tunnel-credentials
              mountPath: /etc/cloudflared/credentials
              readOnly: true
      volumes:
        - name: tunnel-config
          configMap:
            name: tunnel-config
        - name: tunnel-credentials
          secret:
            secretName: tunnel-credentials
            items:
              - key: credentials.json
                path: credentials.json
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tunnel-config
  namespace: cloudflared
data:
  config.yaml: |
    tunnel: 66d76492-036b-4177-8fac-8682e0eda37e
    credentials-file: /etc/cloudflared/credentials/credentials.json
    no-autoupdate: true
    metrics: 0.0.0.0:2000
    protocol: http2
    ingress:
      - hostname: quill.maplespike.ca
        service: http://quill-portal.maplespike.svc.cluster.local:8080
      - hostname: api.maplespike.ca
        service: http://maplespike-api.maplespike.svc.cluster.local:8082
      - hostname: mcp.maplespike.ca
        service: http://maplespike-mcp.maplespike.svc.cluster.local:3001
      - hostname: datafabric.maplespike.ca
        service: http://maplespike-portal.maplespike.svc.cluster.local:8080
      - hostname: data.maplespike.ca
        service: http://maplespike-mcp.maplespike.svc.cluster.local:3001
      - hostname: haven.maplespike.ca
        service: http://haven.haven.svc.cluster.local:8080
      - hostname: brain.maplespike.ca
        service: http://qdrant.search.svc.cluster.local:6333
      - service: http_status:404
---
apiVersion: v1
kind: Service
metadata:
  name: cloudflared-tunnel
  namespace: cloudflared
spec:
  ports:
    - port: 2000
      targetPort: 2000
      name: metrics
  selector:
    app: cloudflared-tunnel
