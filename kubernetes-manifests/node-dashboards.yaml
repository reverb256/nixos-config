# Node Homepage Dashboards for NixOS Kubernetes Cluster
# One dashboard per cluster node: zephyr.lan, nexus.lan, forge.lan, sentry.lan
# Serves static HTML with nginx:alpine, pinned to specific node via nodeSelector

---
# ZEPHYR DASHBOARD - Control Plane, Workstation, Gaming, VR, AI
# CPU: AMD 5950X (32 cores) | RAM: 31GB | GPUs: RTX 3090 + RTX 3060 Ti
apiVersion: v1
kind: ConfigMap
metadata:
  name: zephyr-dashboard-html
  namespace: default
  labels:
    app.kubernetes.io/name: zephyr-dashboard
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Zephyr - Cluster Dashboard</title>
      <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
          --bg-primary: #0a0e1a;
          --bg-secondary: #111827;
          --bg-card: #1f2937;
          --text-primary: #f9fafb;
          --text-secondary: #9ca3af;
          --accent: #3b82f6;
          --success: #10b981;
          --warning: #f59e0b;
          --border: #374151;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, var(--bg-primary) 0%, #1a1f35 100%); color: var(--text-primary); min-height: 100vh; line-height: 1.6; }
        .container { max-width: 1400px; margin: 0 auto; padding: 2rem; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
        h1 { font-size: 2.5rem; font-weight: 700; }
        .hostname { color: var(--accent); }
        .badge { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.875rem; font-weight: 500; }
        .badge.online { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .badge.role { background: rgba(59, 130, 246, 0.2); color: var(--accent); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .card { background: var(--bg-card); border-radius: 12px; padding: 1.5rem; border: 1px solid var(--border); }
        .card-title { font-size: 1.125rem; font-weight: 600; margin-bottom: 1rem; color: var(--text-secondary); }
        .info-row { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .info-label { color: var(--text-secondary); }
        .info-value { font-weight: 500; font-family: monospace; }
        .gpu-list, .service-list { list-style: none; }
        .gpu-list li, .service-list li { padding: 0.75rem; margin-bottom: 0.5rem; background: var(--bg-secondary); border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .gpu-badge { padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
        .gpu-badge.nvidia { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .service-url { color: var(--accent); text-decoration: none; font-size: 0.875rem; padding: 0.25rem 0.75rem; border-radius: 6px; background: rgba(59, 130, 246, 0.1); }
        .nav-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
        .nav-link { display: flex; flex-direction: column; padding: 1rem; background: var(--bg-secondary); border-radius: 8px; text-decoration: none; color: var(--text-primary); border: 1px solid transparent; }
        .nav-link:hover { border-color: var(--accent); background: rgba(59, 130, 246, 0.1); }
        footer { margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--border); text-align: center; color: var(--text-secondary); font-size: 0.875rem; }
        @media (max-width: 768px) { h1 { font-size: 1.75rem; } .grid { grid-template-columns: 1fr; } }
      </style>
    </head>
    <body>
      <div class="container">
        <header>
          <div>
            <h1><span class="hostname">Zephyr</span> Dashboard</h1>
            <p style="color: var(--text-secondary); margin-top: 0.5rem;">Control Plane • Workstation • Gaming</p>
          </div>
          <div><span class="badge online">● Online</span> <span class="badge role">K8s Master</span></div>
        </header>

        <div class="card" style="margin-bottom: 2rem;">
          <div class="card-title">Cluster Overview</div>
          <div style="display: flex; gap: 2rem; flex-wrap: wrap;">
            <div style="display: flex; flex-direction: column;"><span style="font-size: 2rem; font-weight: 700; color: var(--accent);">4</span><span style="font-size: 0.875rem; color: var(--text-secondary);">Nodes</span></div>
            <div style="display: flex; flex-direction: column;"><span style="font-size: 2rem; font-weight: 700; color: var(--accent);">78</span><span style="font-size: 0.875rem; color: var(--text-secondary);">CPU Cores</span></div>
            <div style="display: flex; flex-direction: column;"><span style="font-size: 2rem; font-weight: 700; color: var(--accent);">123GB</span><span style="font-size: 0.875rem; color: var(--text-secondary);">RAM</span></div>
            <div style="display: flex; flex-direction: column;"><span style="font-size: 2rem; font-weight: 700; color: var(--accent);">7</span><span style="font-size: 0.875rem; color: var(--text-secondary);">GPUs</span></div>
          </div>
        </div>

        <div class="grid">
          <div class="card">
            <div class="card-title">Node Information</div>
            <div class="info-row"><span class="info-label">Hostname</span><span class="info-value">zephyr</span></div>
            <div class="info-row"><span class="info-label">IP Address</span><span class="info-value">10.1.1.110</span></div>
            <div class="info-row"><span class="info-label">K8s Version</span><span class="info-value">v1.35.0</span></div>
            <div class="info-row"><span class="info-label">CNI</span><span class="info-value">Flannel VXLAN</span></div>
          </div>

          <div class="card">
            <div class="card-title">Hardware</div>
            <div class="info-row"><span class="info-label">CPU</span><span class="info-value">AMD 5950X (32 cores)</span></div>
            <div class="info-row"><span class="info-label">Memory</span><span class="info-value">31 GB</span></div>
            <div class="info-row"><span class="info-label">Storage</span><span class="info-value">1.85 TB SSD</span></div>
          </div>

          <div class="card">
            <div class="card-title">GPUs</div>
            <ul class="gpu-list">
              <li><span>RTX 3090</span> <span class="gpu-badge nvidia">NVIDIA 24GB</span></li>
              <li><span>RTX 3060 Ti</span> <span class="gpu-badge nvidia">NVIDIA 8GB</span></li>
            </ul>
          </div>
        </div>

        <div class="grid">
          <div class="card">
            <div class="card-title">Services</div>
            <ul class="service-list">
              <li><span>Kubernetes API</span> <span class="service-url">:6443</span></li>
              <li><span>AI Inference</span> <a href="http://ai.cluster.local" class="service-url">ai.cluster.local</a></li>
              <li><span>SearXNG</span> <a href="http://search.cluster.local" class="service-url">search.cluster.local</a></li>
            </ul>
          </div>

          <div class="card">
            <div class="card-title">Quick Links</div>
            <div class="nav-grid">
              <a href="http://dash.cluster.local" class="nav-link"><span style="font-weight: 600;">Grafana</span><span style="font-size: 0.875rem; color: var(--text-secondary);">Dashboards</span></a>
              <a href="http://metrics.cluster.local" class="nav-link"><span style="font-weight: 600;">Prometheus</span><span style="font-size: 0.875rem; color: var(--text-secondary);">Metrics</span></a>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-title">Other Nodes</div>
          <div class="nav-grid">
            <a href="http://nexus.lan" class="nav-link"><span style="font-weight: 600;">Nexus</span><span style="font-size: 0.875rem; color: var(--text-secondary);">Storage • 24 cores</span></a>
            <a href="http://forge.lan" class="nav-link"><span style="font-weight: 600;">Forge</span><span style="font-size: 0.875rem; color: var(--text-secondary);">Multi-GPU • 6 cores</span></a>
            <a href="http://sentry.lan" class="nav-link"><span style="font-weight: 600;">Sentry</span><span style="font-size: 0.875rem; color: var(--text-secondary);">Monitoring • 16 cores</span></a>
          </div>
        </div>

        <footer><p>NixOS Cluster • Kubernetes v1.35.0 • <span id="timestamp"></span></p></footer>
      </div>
      <script>document.getElementById('timestamp').textContent = new Date().toLocaleString(); setTimeout(() => location.reload(), 60000);</script>
    </body>
    </html>

---
