---
# Deployments with nodeSelector
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zephyr-dashboard
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zephyr-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zephyr-dashboard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/hostname: zephyr
      containers:
      - name: dashboard
        image: nginxinc/nginx-unprivileged:alpine
        ports:
        - containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
          readOnly: true
        resources:
          requests: { cpu: 50m, memory: 32Mi }
          limits: { cpu: 100m, memory: 64Mi }
      volumes:
      - name: html
        configMap:
          name: zephyr-dashboard-html

