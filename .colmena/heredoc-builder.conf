{ config, lib, pkgs, ... }:
{
  # Enable build machine support
  nix.settings = {
    max-jobs = lib.mkDefault 8;
    cores = lib.mkDefault 0;
    # Disable sandboxing for distributed builds
    sandbox = false;
    # Allow remote builds
    trusted-users = [ "j_kro" ];
  };
  
  # SSH for build machine communication
  services.openssh = {
    enable = true;
    settings = {
      PermitRootLogin = "no";
      PasswordAuthentication = false;
      X11Forwarding = false;
      AllowTcpForwarding = true;
    };
  };
  
  # Nix daemon optimized for builds
  systemd.services.nix-daemon = {
    serviceConfig = {
      LimitNOFILE = 1048576;
    };
  };
}