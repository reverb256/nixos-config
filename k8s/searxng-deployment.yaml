apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: search
  labels:
    app: searxng
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: searxng
    spec:
      containers:
      - name: searxng
        # Pinned per AGENTS.md (no :latest — admission policy).
        # SearXNG is rolling-release: tag is YYYY.M.D-<git-sha>. Verify this
        # tag exists in the cluster image cache before deploying; otherwise
        # pre-pull on the target host: docker pull searxng/searxng:2026.7.8-1412926f5
        image: searxng/searxng:2026.7.8-1412926f5
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP

        # Environment variables
        env:
        - name: SEARXNG_SECRET
          valueFrom:
            secretKeyRef:
              name: searxng-secret
              key: secret-key

        # Resource limits (prevents resource exhaustion)
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

        # Health checks
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

        # Volume mounts (Fix #1: Mount ConfigMap)
        volumeMounts:
        - name: config
          mountPath: /etc/searxng/settings.yml
          subPath: settings.yml
          readOnly: true

      # Volumes (Fix #1: Define ConfigMap volume)
      volumes:
      - name: config
        configMap:
          name: searxng-config
          items:
          - key: settings.yml
            path: settings.yml

      restartPolicy: Always
      dnsPolicy: ClusterFirst
